# Nightly full lane (SPEC 2, 17): for every enabled instance, release:latest, then branch:main with a differential
# against release:latest. Both calls of e2e.yml join the concurrency group e2e-<instance>, so they never overlap with
# each other, with dispatched runs or with the janitor. The optional web-UI lane (e2e-webui.yml) runs last.
#
# Enabled instances: repository variable E2E_TARGETS, a JSON list such as ["free", "enterprise"] (default ["free"]).
# Each matrix entry calls e2e.yml with one instance, which must also be in the allowlist E2E_INSTANCES when that is set.
# Scheduled runs are skipped until E2E_TARGETS is set, so a fresh fork or clone stays quiet; workflow_dispatch always runs.
# Web-UI lane: E2E_WEB_UI_ENABLED == 'true' and E2E_WEB_UI_TARGETS (default ["free"]), docs/web-ui-testing.md.
# Job names show the shard of the instance: repository variable E2E_INSTANCE_SHARDS ({instance: shard}, written by
# ci-sync from E2E_SHARD), else the instance name.
name: nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions: {}

cache-mode: none

jobs:
  release:
    name: release:latest (${{ fromJSON(vars.E2E_INSTANCE_SHARDS || '{}')[matrix.target] || matrix.target }})
    if: ${{ vars.E2E_TARGETS != '' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      # the called workflow logs in to HashiCorp Vault with its OIDC token (a caller caps its permissions)
      id-token: write
    strategy:
      fail-fast: false
      # two instances at a time: the instances share accounts, so their sessions share the 5000 requests per hour of
      # the admin; a session that runs dry pauses until the reset (E2E_RATE_WAIT_MAX)
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(vars.E2E_TARGETS || '["free"]') }}
    uses: ./.github/workflows/e2e.yml
    # the environment secrets of the called jobs: without inherit GitHub gives a called workflow no secret, not
    # even those of the environment its job declares (the repository holds no secret: they all live in environments)
    secrets: inherit
    with:
      target: ${{ matrix.target }}
      sut: release:latest
      lane: nightly-full

  main:
    name: branch:main vs release:latest (${{ fromJSON(vars.E2E_INSTANCE_SHARDS || '{}')[matrix.target] || matrix.target }})
    needs: release
    if: ${{ !cancelled() && (vars.E2E_TARGETS != '' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      # the called workflow logs in to HashiCorp Vault with its OIDC token (a caller caps its permissions)
      id-token: write
    strategy:
      fail-fast: false
      # two instances at a time: the instances share accounts, so their sessions share the 5000 requests per hour of
      # the admin; a session that runs dry pauses until the reset (E2E_RATE_WAIT_MAX)
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(vars.E2E_TARGETS || '["free"]') }}
    uses: ./.github/workflows/e2e.yml
    # the environment secrets of the called jobs: without inherit GitHub gives a called workflow no secret, not
    # even those of the environment its job declares (the repository holds no secret: they all live in environments)
    secrets: inherit
    with:
      target: ${{ matrix.target }}
      sut: branch:main
      base_sut: release:latest
      lane: nightly-full

  # Optional web-UI lane (docs/web-ui-testing.md): only when the repository variable E2E_WEB_UI_ENABLED is 'true',
  # for the instances of E2E_WEB_UI_TARGETS (JSON list, default ["free"]), each with an e2e-<instance>-webui
  # environment holding the admin bot's web credentials; trusted SUT only, after the other sessions of the night.
  webui:
    name: web-UI tier release:latest (${{ fromJSON(vars.E2E_INSTANCE_SHARDS || '{}')[matrix.target] || matrix.target }})
    needs: [release, main]
    if: ${{ !cancelled() && vars.E2E_WEB_UI_ENABLED == 'true' }}
    permissions:
      contents: read
      # the called workflow logs in to HashiCorp Vault with its OIDC token (a caller caps its permissions)
      id-token: write
    strategy:
      fail-fast: false
      # one instance at a time, like the lists of e2e-webui.yml: the web logins of the bot accounts never overlap
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(vars.E2E_WEB_UI_TARGETS || '["free"]') }}
    uses: ./.github/workflows/e2e-webui.yml
    # the environment secrets of the called jobs: without inherit GitHub gives a called workflow no secret, not
    # even those of the environment its job declares (the repository holds no secret: they all live in environments)
    secrets: inherit
    with:
      target: ${{ matrix.target }}
      sut: release:latest
