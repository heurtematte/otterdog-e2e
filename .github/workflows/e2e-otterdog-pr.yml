# Test a proposed eclipse-csi/otterdog pull request, pinned to a reviewed head commit (SPEC 17, SEC-15).
#
# Dispatched by a maintainer (gh workflow run, the Actions UI, or the otterdog-side `/e2e` comment trigger documented
# in docs/testing-an-otterdog-pr.md, which uses a GitHub App token limited to Actions: write on this repository).
# `resolve` validates the inputs in bash (target: one instance or a comma separated list, each in the allowlist
# E2E_INSTANCES, else E2E_TARGETS) and checks with the GitHub API that the PR belongs to eclipse-csi/otterdog and that
# the pinned sha is reachable from its head. e2e.yml (one call; it runs one job per instance) then classifies the SUT
# `pr:<N>@<sha>` as untrusted, and each job waits for an approval of its `e2e-<instance>-untrusted` environment
# before any secret is used.
name: e2e otterdog PR
run-name: "e2e otterdog PR #${{ inputs.pr }} on ${{ inputs.target }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "eclipse-csi/otterdog pull request number"
        type: string
        required: true
      sha:
        description: "Full 40-hex head commit to test (the commit you reviewed)"
        type: string
        required: true
      target:
        description: "Instance or comma separated instances (allowlist: E2E_INSTANCES)"
        type: string
        default: free
        required: true
      suites:
        description: "auto (offline + differential + live tiers, tags from the changed files) or a comma separated list"
        type: string
        default: auto
      strict_diff:
        description: "Fail on unexpected differential deltas"
        type: boolean
        default: false

permissions: {}

cache-mode: none

jobs:
  resolve:
    name: resolve the pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sut: ${{ steps.check.outputs.sut }}
      target: ${{ steps.check.outputs.target }}
      suites: ${{ steps.check.outputs.suites }}
    steps:
      - name: Validate the inputs and the pin
        id: check
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          TARGET: ${{ inputs.target }}
          # the instances that may be dispatched (JSON list): the allowlist of e2e.yml, checked again there
          INSTANCES: ${{ vars.E2E_INSTANCES || vars.E2E_TARGETS || '["free","team","enterprise"]' }}
          SUITES: ${{ inputs.suites }}
          UPSTREAM: eclipse-csi/otterdog
          # read-only API access to the public upstream repository (anonymous requests share a 60/h IP budget)
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$PR" =~ ^[0-9]{1,7}$ ]] || fail "pr must be a pull request number"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "sha must be the full 40-hex commit (lower case)"
          jq -e 'type == "array" and all(.[]; type == "string")' <<< "$INSTANCES" > /dev/null \
            || fail "the repository variable E2E_INSTANCES (or E2E_TARGETS) must be a JSON list of instance names"
          # target: one instance or a comma separated list (spaces ignored), every instance in the allowlist
          list="${TARGET//[[:space:]]/}"
          [[ "$list" =~ ^[a-z0-9,-]{1,400}$ && "$list" != ,* && "$list" != *, && "$list" != *,,* ]] \
            || fail "target must be an instance name or a comma separated list of instance names"
          IFS=',' read -r -a names <<< "$list"
          targets=()
          for name in "${names[@]}"; do
            [[ "$name" =~ ^[a-z0-9][a-z0-9-]{0,38}$ ]] || fail "invalid instance name: $name"
            # reserved: the suffixes of the environments of an instance
            case "$name" in *-untrusted | *-webui) fail "an instance name cannot end with -untrusted or -webui" ;; lists) fail "lists is a reserved name (the directory of the instance lists)" ;; esac
            jq -e --arg name "$name" 'any(.[]; . == $name)' <<< "$INSTANCES" > /dev/null \
              || fail "instance $name is not allowed (repository variable E2E_INSTANCES, else E2E_TARGETS)"
            case " ${targets[*]} " in *" $name "*) ;; *) targets+=("$name") ;; esac
          done
          (( ${#targets[@]} >= 1 && ${#targets[@]} <= 8 )) || fail "target must list 1 to 8 instances"
          printf -v target '%s,' "${targets[@]}"
          target="${target%,}"
          [[ "$SUITES" =~ ^[a-z,]{1,120}$ ]] || fail "suites must be auto or a comma separated list"
          if [[ "$SUITES" != auto ]]; then
            IFS=',' read -r -a suites <<< "$SUITES"
            for suite in "${suites[@]}"; do
              case "$suite" in
                unit | offline | cli | webhooks | webapp | enterprise | differential) ;;
                *) fail "unknown suite: $suite" ;;
              esac
            done
          fi
          base_repo="$(gh api "repos/$UPSTREAM/pulls/$PR" --jq .base.repo.full_name)"
          [[ "$base_repo" == "$UPSTREAM" ]] || fail "PR #$PR does not target $UPSTREAM"
          head_sha="$(gh api "repos/$UPSTREAM/pulls/$PR" --jq .head.sha)"
          # identical: the pin is the head; ahead: the head moved on, the pin is one of its ancestors
          status="$(gh api "repos/$UPSTREAM/compare/$SHA...$head_sha" --jq .status)"
          case "$status" in
            identical | ahead) ;;
            *) fail "sha $SHA is not reachable from the head of PR #$PR (compare status: $status)" ;;
          esac
          {
            echo "sut=pr:$PR@$SHA"
            echo "target=$target"
            echo "suites=$SUITES"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### otterdog PR #$PR"
            echo
            echo "- pinned commit: \`$SHA\` (current head: \`$head_sha\`, $status)"
            echo "- instances: \`$target\` (one job and one approval each), suites: \`$SUITES\`"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    needs: resolve
    permissions:
      contents: read
      # the called workflow logs in to HashiCorp Vault with its OIDC token (a caller caps its permissions)
      id-token: write
    cache-mode: none
    uses: ./.github/workflows/e2e.yml
    with:
      target: ${{ needs.resolve.outputs.target }}
      sut: ${{ needs.resolve.outputs.sut }}
      base_sut: auto
      suites: ${{ needs.resolve.outputs.suites }}
      lane: pr-fast
      strict_diff: ${{ inputs.strict_diff }}
