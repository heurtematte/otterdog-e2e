# Documentation site (GitHub Pages): a strict MkDocs build of docs/ and README.md (the home page) for every change of the
# documentation, deployed from main. It uses no secret: the build job only reads the repository (and, on main, the
# Pages settings); the deploy job alone may publish the site, in the github-pages environment.
#
# Repository setup, once: Settings > Pages > Build and deployment > Source: "GitHub Actions" (docs/local-development.md).
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "docs_hooks.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "docs_hooks.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

# no Actions cache in this repository (SEC-16)
cache-mode: none

# Runs on main share the group "pages": one at a time, never cancelled (a deployment in progress always completes,
# a newer run replaces the one waiting). Other refs (pull requests) get their own group, so a pull request build never
# replaces a waiting deployment.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('docs-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # actions/configure-pages reads the Pages settings of the repository (main only)
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install MkDocs (pinned versions, hash-checked wheels)
        run: >-
          python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all:
          -r docs/requirements.txt
      - name: Build the site (strict, broken links and anchors fail)
        env:
          # Material's banner about MkDocs 2: the pins keep mkdocs<2
          NO_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # the only job that writes anything: the Pages deployment (pages) and the OIDC token proving its origin (id-token)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
