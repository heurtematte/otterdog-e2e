# Documentation site (GitHub Pages): a strict Zensical build of docs/ and README.md (the home page), with the scenario
# explorer generated from scenarios/ and tests/ (docs_scenarios.py), both staged by docs_site.py, for every change of the
# documentation, deployed from main. It uses no secret: the build job only reads the repository (and, on main, the Pages settings); the deploy
# job alone may publish the site, in the github-pages environment.
#
# The nightly dashboard (docs/nightly.md): on main, the build first collects the history of the nightly runs
# (docs_nightly.py: the published history, then the runs, jobs and digest annotations it lacks, read with GITHUB_TOKEN:
# actions and checks read), and the end of every nightly (workflow_run) rebuilds the site with its results.
#
# Repository setup, once: Settings > Pages > Build and deployment > Source: "GitHub Actions" (docs/local-development.md).
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "zensical.toml"
      - "docs-theme/**"
      - "docs_site.py"
      - "docs_hooks.py"
      - "docs_nightly.py"
      # the scenario explorer is generated from these (docs_scenarios.py)
      - "docs_scenarios.py"
      - "scenarios/**"
      - "tests/**/*.py"
      - "src/otterdog_acceptance/scenarios/checks.py"
      - "src/otterdog_acceptance/github/oracle.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "zensical.toml"
      - "docs-theme/**"
      - "docs_site.py"
      - "docs_hooks.py"
      - "docs_nightly.py"
      # the scenario explorer is generated from these (docs_scenarios.py)
      - "docs_scenarios.py"
      - "scenarios/**"
      - "tests/**/*.py"
      - "src/otterdog_acceptance/scenarios/checks.py"
      - "src/otterdog_acceptance/github/oracle.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  # the end of a nightly: its results join the history of the dashboard (the run uses the workflow of main)
  workflow_run:
    workflows: [nightly]
    types: [completed]

permissions: {}

# no Actions cache in this repository (SEC-16)
cache-mode: none

# Runs on main share the group "pages": one at a time, never cancelled (a deployment in progress always completes,
# a newer run replaces the one waiting). Other refs (pull requests) get their own group, so a pull request build never
# replaces a waiting deployment.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('docs-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # actions/configure-pages reads the Pages settings of the repository (main only)
      pages: read
      # docs_nightly.py reads the runs and jobs of the nightly and the annotations of its jobs (main only)
      actions: read
      checks: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Zensical (pinned versions, hash-checked wheels)
        run: >-
          python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all:
          -r docs/requirements.txt
      - name: Collect the history of the nightly dashboard (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # {instance: shard}: the runs before the shard names show their instance (ci-sync writes it)
          E2E_INSTANCE_SHARDS: ${{ vars.E2E_INSTANCE_SHARDS }}
        run: python docs_nightly.py collect
      - name: Build the site (staged by docs_site.py; strict, broken links and anchors fail)
        run: python docs_site.py build --strict
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # the only job that writes anything: the Pages deployment (pages) and the OIDC token proving its origin (id-token)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
