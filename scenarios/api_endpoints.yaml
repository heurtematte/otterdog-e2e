  - endpoint: PUT /repos/{owner}/{repo}/codespaces/secrets/{name}
    source: otterdog/providers/github/rest/secret_client.py:185
    trigger: a repository Codespaces secret is added or forced (#890)
    feature: secrets-variables.repo-dependabot-codespaces-secrets
  - endpoint: DELETE /repos/{owner}/{repo}/codespaces/secrets/{name}
