    feature: org-roles.lifecycle
  - endpoint: DELETE /orgs/{org}/organization-roles/{id}
    source: otterdog/providers/github/rest/org_client.py:314
    trigger: a custom organization role is removed (apply -d, enterprise)
    feature: org-roles.lifecycle

  # --- code security configurations ---------------------------------------------------------------------------------
  - endpoint: POST /orgs/{org}/code-security/configurations
    source: otterdog/providers/github/rest/org_client.py:369
