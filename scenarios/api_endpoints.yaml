    feature: secrets-variables.org-variable.lifecycle
  - endpoint: PUT /orgs/{org}/actions/variables/{name}/repositories
    source: otterdog/providers/github/rest/org_client.py:653
    trigger: the selected repositories of an organization variable change (visibility 'selected')
    feature: secrets-variables.org-variable.selected-repositories
  - endpoint: DELETE /orgs/{org}/actions/variables/{name}
    source: otterdog/providers/github/rest/org_client.py:700
