  - endpoint: DELETE /orgs/{org}/actions/secrets/{name}
    source: otterdog/providers/github/rest/secret_client.py:215
    trigger: an organization secret is removed (apply -d)
    feature: secrets-variables.org-secret.lifecycle
  - endpoint: PUT /orgs/{org}/dependabot/secrets/{name}
    source: otterdog/providers/github/rest/secret_client.py:185
    trigger: an organization Dependabot secret is added or changes (#890)
    feature: secrets-variables.org-dependabot-codespaces-secrets
  - endpoint: DELETE /orgs/{org}/dependabot/secrets/{name}
    source: otterdog/providers/github/rest/secret_client.py:215
    trigger: an organization Dependabot secret is removed (apply -d)
    feature: secrets-variables.org-dependabot-codespaces-secrets
  - endpoint: PUT /orgs/{org}/codespaces/secrets/{name}
    source: otterdog/providers/github/rest/secret_client.py:185
    trigger: an organization Codespaces secret is added or changes (#890)
    feature: secrets-variables.org-dependabot-codespaces-secrets
  - endpoint: DELETE /orgs/{org}/codespaces/secrets/{name}
