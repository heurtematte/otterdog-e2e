    feature: custom-properties.repository-values

  # --- teams --------------------------------------------------------------------------------------------------------
  - endpoint: POST /orgs/{org}/teams
    source: otterdog/providers/github/rest/team_client.py:76
    trigger: a team is added
    feature: teams.lifecycle
  - endpoint: PATCH /orgs/{org}/teams/{name}
    source: otterdog/providers/github/rest/team_client.py:107
    trigger: a team's description, privacy, notifications or parent changes
    feature: teams.lifecycle
  - endpoint: DELETE /orgs/{org}/teams/{name}
    source: otterdog/providers/github/rest/team_client.py:180
    trigger: a team is removed (apply -d)
    feature: teams.lifecycle
  - endpoint: PUT /orgs/{org}/teams/{name}/memberships/{name}
    source: otterdog/providers/github/rest/team_client.py:156
    trigger: a member is added to a team (or a maintainer's role changes)
    feature: teams.members
  - endpoint: DELETE /orgs/{org}/teams/{name}/memberships/{name}
    source: otterdog/providers/github/rest/team_client.py:168
    trigger: a member is removed from a team
    feature: teams.members
  - endpoint: PATCH /orgs/{org}/teams/{name}/team-sync/group-mappings
    source: otterdog/providers/github/rest/team_client.py:232
    trigger: a team's identity provider groups change (team sync, enterprise, #911)
    feature: teams.lifecycle
  - endpoint: PATCH /orgs/{org}/teams/{name}/external-groups
    source: otterdog/providers/github/rest/team_client.py:328
    trigger: a team's external group is set (enterprise managed users, #911)
    feature: teams.lifecycle
  - endpoint: DELETE /orgs/{org}/teams/{name}/external-groups
    source: otterdog/providers/github/rest/team_client.py:340
    trigger: a team's external group is removed (enterprise managed users, #911)
    feature: teams.lifecycle
  - endpoint: PUT /orgs/{org}/teams/{name}/repos/{owner}/{repo}
    source: otterdog/providers/github/rest/repo_client.py:1026
    trigger: a team is added to a repository's team_permissions or its permission changes
    feature: teams.repository-permissions
    notes: >-
      #924: before it, a change of team_permissions alone also sent PATCH /repos/{owner}/{repo} with the field,
      refused (403) on an archived repository before this request was sent.
  - endpoint: DELETE /orgs/{org}/teams/{name}/repos/{owner}/{repo}
    source: otterdog/providers/github/rest/repo_client.py:1044
    trigger: a team is removed from a repository's team_permissions (KB-005 fixed in 1.7.0, #842)
    feature: teams.repository-permissions

