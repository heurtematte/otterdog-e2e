    feature: code-security.configuration.settings
  - endpoint: PUT /orgs/{org}/code-security/configurations/{id}/defaults
    source: otterdog/providers/github/rest/org_client.py:402
    trigger: default_for_new_repos of a configuration changes; also settings.default_code_security_configurations_disabled (org_client.py:926)
    feature: code-security.configuration.settings
  - endpoint: DELETE /orgs/{org}/code-security/configurations/{id}
    source: otterdog/providers/github/rest/org_client.py:415
    trigger: a code security configuration is removed (apply -d)
    feature: code-security.configuration.lifecycle
  - endpoint: POST /orgs/{org}/code-security/configurations/{id}/attach
    source: otterdog/providers/github/rest/org_client.py:509
    trigger: a repository's code_security_configuration changes, or a repository is created with one
