    feature: rulesets.org.repository-conditions
  - endpoint: DELETE /orgs/{org}/rulesets/{id}
    source: otterdog/providers/github/rest/org_client.py:1011
    trigger: an organization ruleset is removed (apply -d)
    feature: rulesets.org.repository-conditions

  # --- repositories -------------------------------------------------------------------------------------------------
  - endpoint: POST /orgs/{org}/repos
    source: otterdog/providers/github/rest/repo_client.py:330
    trigger: a repository is added (neither a fork nor from a template)
    feature: repositories.lifecycle
  - endpoint: POST /repos/{owner}/{repo}/generate
    source: otterdog/providers/github/rest/repo_client.py:249
    trigger: a repository is added with template_repository
    feature: repositories.template-repositories
  - endpoint: POST /repos/{owner}/{repo}/forks
    source: otterdog/providers/github/rest/repo_client.py:218
    trigger: a repository is added with forked_repository
    feature: repositories.fork
  - endpoint: PATCH /repos/{owner}/{repo}
    source: otterdog/providers/github/rest/repo_client.py:165
    trigger: >-
      a repository setting changes (update_repo), archived included; also the settings of a new repository after its
      creation, and default_branch when the branch exists (repo_client.py:739)
    feature: repositories.lifecycle
    notes: >-
      Never sent when only sub-resources change (team_permissions since #924, code_security_configuration). GitHub
      refuses it (403) on an archived repository: otterdog skips the fields of
      Repository._unavailable_fields_in_archived_repos while archived.
  - endpoint: DELETE /repos/{owner}/{repo}
    source: otterdog/providers/github/rest/repo_client.py:527
    trigger: a repository is removed (apply -d)
    feature: repositories.lifecycle
  - endpoint: POST /repos/{owner}/{repo}/branches/{name}/rename
    source: otterdog/providers/github/rest/repo_client.py:99
    trigger: default_branch names a branch that does not exist (the current default branch is renamed)
    feature: repositories.default-branch
  - endpoint: PUT /repos/{owner}/{repo}/topics
    source: otterdog/providers/github/rest/repo_client.py:848
    trigger: a repository's topics change
    feature: repositories.lifecycle
  - endpoint: POST /repos/{owner}/{repo}/pages
    source: otterdog/providers/github/rest/repo_client.py:639
    trigger: gh_pages_build_type is enabled on a repository without a pages site
    feature: repositories.pages
  - endpoint: PUT /repos/{owner}/{repo}/pages
    source: otterdog/providers/github/rest/repo_client.py:644
    trigger: a pages setting changes (source, build type; cname and https_enforced at repo_client.py:660-670)
    feature: repositories.pages
  - endpoint: DELETE /repos/{owner}/{repo}/pages
    source: otterdog/providers/github/rest/repo_client.py:612
    trigger: gh_pages_build_type becomes 'disabled'
    feature: repositories.pages
  - endpoint: PATCH /repos/{owner}/{repo}/code-scanning/default-setup
    source: otterdog/providers/github/rest/repo_client.py:721
    trigger: code_scanning_default_setup_enabled, _query_suite or _languages change
    feature: repositories.code-scanning
  - endpoint: PUT /repos/{owner}/{repo}/vulnerability-alerts
    source: otterdog/providers/github/rest/repo_client.py:760
    trigger: dependabot_alerts_enabled becomes true
    feature: repositories.security
  - endpoint: DELETE /repos/{owner}/{repo}/vulnerability-alerts
    source: otterdog/providers/github/rest/repo_client.py:760
    trigger: dependabot_alerts_enabled becomes false
    feature: repositories.security
  - endpoint: PUT /repos/{owner}/{repo}/private-vulnerability-reporting
    source: otterdog/providers/github/rest/repo_client.py:823
    trigger: private_vulnerability_reporting_enabled becomes true
    feature: repositories.security
  - endpoint: DELETE /repos/{owner}/{repo}/private-vulnerability-reporting
    source: otterdog/providers/github/rest/repo_client.py:823
    trigger: private_vulnerability_reporting_enabled becomes false
    feature: repositories.security
  - endpoint: PUT /repos/{owner}/{repo}/immutable-releases
    source: otterdog/providers/github/rest/repo_client.py:800
    trigger: immutable_releases_enabled becomes true
    feature: repositories.immutable-releases
  - endpoint: DELETE /repos/{owner}/{repo}/immutable-releases
    source: otterdog/providers/github/rest/repo_client.py:800
    trigger: immutable_releases_enabled becomes false
    feature: repositories.immutable-releases

