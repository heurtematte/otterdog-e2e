    feature: secrets-variables.org-variable.lifecycle

  # --- organization rulesets ----------------------------------------------------------------------------------------
  - endpoint: POST /orgs/{org}/rulesets
    source: otterdog/providers/github/rest/org_client.py:1003
    trigger: an organization ruleset is added
    feature: rulesets.org.repository-conditions
  - endpoint: PUT /orgs/{org}/rulesets/{id}
    source: otterdog/providers/github/rest/org_client.py:993
