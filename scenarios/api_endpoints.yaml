# Inventory of the HTTP write requests otterdog sends to GitHub (REST methods other than GET, GraphQL mutations).
#
# Each endpoint is written as otterdog's request statistics name it (otterdog >= 1.7.0, #881,
# otterdog/providers/github/stats/__init__.py rest_endpoint): the method and the path with every name or id replaced
# by a placeholder ({org}, {owner}/{repo}, {name}, {id}), or 'mutation <name>' for GraphQL. These are the strings a
# live scenario step names in `apply.api.sent` / `apply.api.not_sent` (src/otterdog_acceptance/otterdog/api_usage.py); every
# write endpoint a scenario names must be listed here (tests/unit/test_api_endpoints.py), and docs/api-coverage.md,
# generated from this file and the scenarios, shows which endpoints a step asserts and which none does yet:
#   .venv/bin/python tests/unit/test_api_endpoints.py --write
#
# Fields:
#   endpoint  METHOD /path (placeholders as above) or 'mutation <name>'
#   source    otterdog file:line of the request at otterdog.ref
#   trigger   the configuration change (or command) that makes otterdog send it
#   feature   the coverage feature of scenarios/coverage.yaml it belongs to
#   scope     cli (plan/apply/import) or webapp (only the webapp sends it; the cli tier cannot assert it)
#   notes     caveats (object states, conditions, known bugs)
#
# Paths were normalized with otterdog's own rest_endpoint at otterdog.ref. The REST clients are
# otterdog/providers/github/rest/*.py, the GraphQL mutations otterdog/providers/github/graphql.py. Settings that
# otterdog changes through the web UI (otterdog/providers/github/web.py) are page loads, not endpoints: the web-UI
# tier covers them (tests/web_ui).
schema_version: 1
otterdog:
  repository: eclipse-csi/otterdog
  ref: a1964948184689a022d21f482a2c555682340863  # main after #923 and #924

endpoints:
  # --- organization settings ----------------------------------------------------------------------------------------
  - endpoint: PATCH /orgs/{org}
    source: otterdog/providers/github/rest/org_client.py:92
    trigger: an organization setting changes (update_settings)
    feature: org-settings.profile
  - endpoint: PUT /orgs/{org}/settings/immutable-releases
    source: otterdog/providers/github/rest/org_client.py:162
    trigger: settings.immutable_releases_enforced_repositories changes
    feature: org-settings.immutable-releases
  - endpoint: PUT /orgs/{org}/settings/immutable-releases/repositories
    source: otterdog/providers/github/rest/org_client.py:188
    trigger: settings.immutable_releases_selected_repositories changes (enforced_repositories 'selected')
    feature: org-settings.immutable-releases
  - endpoint: PUT /orgs/{org}/organization-roles/teams/{name}/{id}
    source: otterdog/providers/github/rest/org_client.py:240
    trigger: a team is added to settings.security_managers (security manager role)
    feature: org-settings.security-managers
  - endpoint: DELETE /orgs/{org}/organization-roles/teams/{name}/{id}
    source: otterdog/providers/github/rest/org_client.py:262
    trigger: a team is removed from settings.security_managers
    feature: org-settings.security-managers

  # --- organization Actions settings --------------------------------------------------------------------------------
  - endpoint: PUT /orgs/{org}/actions/permissions
    source: otterdog/providers/github/rest/org_client.py:754
    trigger: workflows.enabled_repositories or workflows.allowed_actions changes
    feature: org-workflows.enabled-repositories
  - endpoint: PUT /orgs/{org}/actions/permissions/repositories
    source: otterdog/providers/github/rest/org_client.py:834
    trigger: workflows.selected_repositories changes (enabled_repositories 'selected')
    feature: org-workflows.enabled-repositories
  - endpoint: PUT /orgs/{org}/actions/permissions/selected-actions
    source: otterdog/providers/github/rest/org_client.py:856
    trigger: workflows.github_owned_allowed, verified_allowed or patterns_allowed changes
    feature: org-workflows.allowed-actions
  - endpoint: PUT /orgs/{org}/actions/permissions/workflow
    source: otterdog/providers/github/rest/org_client.py:876
    trigger: workflows.default_workflow_permissions or actions_can_approve_pull_request_reviews changes
    feature: org-workflows.default-permissions
  - endpoint: PUT /orgs/{org}/actions/permissions/fork-pr-contributor-approval
    source: otterdog/providers/github/rest/org_client.py:898
    trigger: workflows.approval_policy changes
    feature: org-workflows.fork-pr-approval
  - endpoint: PUT /orgs/{org}/actions/cache/storage-limit
    source: otterdog/providers/github/rest/org_client.py:808
    trigger: workflows.max_cache_size_gb changes
    feature: org-workflows.cache-size
    notes: the documented endpoint is /organizations/{org}/... (KB-006)

  # --- custom organization roles ------------------------------------------------------------------------------------
  - endpoint: POST /orgs/{org}/organization-roles
    source: otterdog/providers/github/rest/org_client.py:306
    trigger: a custom organization role is added (enterprise)
    feature: org-roles.lifecycle
  - endpoint: PATCH /orgs/{org}/organization-roles/{id}
    source: otterdog/providers/github/rest/org_client.py:297
