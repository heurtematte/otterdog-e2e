  # --- custom properties --------------------------------------------------------------------------------------------
  - endpoint: PUT /orgs/{org}/properties/schema/{name}
    source: otterdog/providers/github/rest/org_client.py:529
    trigger: a custom property definition is added or changes (add_custom_property, update_custom_property:538)
    feature: custom-properties.definitions
  - endpoint: DELETE /orgs/{org}/properties/schema/{name}
    source: otterdog/providers/github/rest/org_client.py:546
