# Offline tier (battery, plan semantics): branch protection settings that depend on a toggle.
id: O-LPLAN-BPR-DEPENDENTS
tier: offline
title: Branch protection settings behind a disabled toggle are not diffed
description: >-
  BranchProtectionRule.include_field_for_diff_computation drops the settings their toggle disables: the review
  settings while requires_pull_request is false, review dismissal allowances without restricts_review_dismissals,
  force-push bypass allowances while force pushes are allowed, status checks and their strictness without
  requires_status_checks, deployment environments without requires_deployments and push restrictions without
  restricts_pushes. Changing all of them plans nothing (validation reports them, see O-VAL-BPR); with the toggles on
  the same changes are planned and counted one by one.
priority: P1
tags: [offline, bpr, environments]
observe: true
variables: {plan: free}
steps:
  - name: dependents-ignored
    base_fragments:
      repositories:
        - |-
          orgs.newRepo('{{ p }}-bpr') {
            environments: [orgs.newEnvironment('{{ p }}-staging')],
            branch_protection_rules: [
              orgs.newBranchProtectionRule('main') {
                requires_pull_request: false,
                required_approving_review_count: 1,
                requires_status_checks: false,
                allows_force_pushes: true,
              },
            ],
          }
    fragments:
      repositories:
        - |-
          orgs.newRepo('{{ p }}-bpr') {
            environments: [orgs.newEnvironment('{{ p }}-staging')],
            branch_protection_rules: [
              orgs.newBranchProtectionRule('main') {
                requires_pull_request: false,
                required_approving_review_count: 3,
                dismisses_stale_reviews: true,
                requires_code_owner_reviews: true,
                require_last_push_approval: true,
                bypass_pull_request_allowances: ['@{{ org }}/{{ p }}-bypass'],
                review_dismissal_allowances: ['@{{ org }}/{{ p }}-dismiss'],
                requires_status_checks: false,
                required_status_checks: ['any:ci'],
                requires_strict_status_checks: true,
                allows_force_pushes: true,
                bypass_force_push_allowances: ['@{{ org }}/{{ p }}-force'],
                required_deployment_environments: ['{{ p }}-staging'],
                push_restrictions: ['@{{ org }}/{{ p }}-pushers'],
              },
            ],
          }
    validate: {ok: true, errors: 0, warnings_min: 6}
    plan:
      expect: noop
      counts: {add: 0, change: 0, delete: 0}
      not_contains: ['~ branch_protection_rule[']
  - name: dependents-managed
    base_fragments:
      repositories:
        - |-
          orgs.newRepo('{{ p }}-bpr') {
            environments: [orgs.newEnvironment('{{ p }}-staging')],
            branch_protection_rules: [
              orgs.newBranchProtectionRule('main') {
                required_approving_review_count: 1,
                restricts_review_dismissals: true,
                requires_deployments: true,
                restricts_pushes: true,
              },
            ],
          }
    fragments:
      repositories:
        - |-
          orgs.newRepo('{{ p }}-bpr') {
            environments: [orgs.newEnvironment('{{ p }}-staging')],
            branch_protection_rules: [
              orgs.newBranchProtectionRule('main') {
                required_approving_review_count: 3,
                restricts_review_dismissals: true,
                review_dismissal_allowances: ['@{{ org }}/{{ p }}-dismiss'],
                bypass_force_push_allowances: ['@{{ org }}/{{ p }}-force'],
                required_status_checks: ['any:ci'],
                requires_strict_status_checks: true,
                requires_deployments: true,
                required_deployment_environments: ['{{ p }}-staging'],
                restricts_pushes: true,
                push_restrictions: ['@{{ org }}/{{ p }}-pushers'],
              },
            ],
          }
    validate: {ok: true, errors: 0}
    plan:
      expect: changes
      counts: {add: 0, change: 7, delete: 0}
      contains:
        - '~ branch_protection_rule[pattern="main", repository={{ p }}-bpr] {'
        - '= 1 -> 3'
        - '+ "@{{ org }}/{{ p }}-dismiss"'
        - '+ "@{{ org }}/{{ p }}-force"'
        - '+ "any:ci"'
        - '+ "{{ p }}-staging"'
        - '+ "@{{ org }}/{{ p }}-pushers"'
