# Offline tier (battery, webhooks): removing the secret of a webhook in local-plan.
id: O-LPLAN-WEBHOOK-SECRET-REMOVED
tier: offline
title: Removing a webhook secret is planned as a change with a warning
description: >-
  A webhook whose secret goes from a provider reference to null is planned as a change of that one attribute ('-
  secret = ...' inside the '~' block) followed by "Warning: removing secret for webhook with url '<url>'", for
  organization and repository webhooks alike, so that dropping a secret by mistake is visible in every plan and in
  the webapp's validation comment. A changed secret reference is an ordinary change without the warning, an
  unchanged one plans nothing.
priority: P2
tags: [offline, cli, webhooks, secrets]
observe: true
variables: {plan: free}
steps:
  - name: org-webhook-secret-removed
    base_fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}h') { secret: 'pass:e2e/hook-secret' }"]
    fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}h') { secret: null }"]
    validate: {ok: true, errors: 0}
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 0}
      contains:
        - '~ org_webhook[url="{{ hook_base }}h"] {'
        - '- secret = "pass:e2e/hook-secret",'
        - "Warning: removing secret for webhook with url '{{ hook_base }}h'"
      not_contains: ["+ add ", "- remove "]
  - name: repo-webhook-secret-removed
    base_fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-hooks') { webhooks: [orgs.newRepoWebhook('{{ hook_base }}r') { secret: 'pass:e2e/hook-secret' }] }"
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-hooks') { webhooks: [orgs.newRepoWebhook('{{ hook_base }}r') { secret: null }] }"
    validate: {ok: true, errors: 0}
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 0}
      contains:
        - '~ repo_webhook[url="{{ hook_base }}r", repository={{ p }}-hooks] {'
        - '- secret = "pass:e2e/hook-secret",'
        - "Warning: removing secret for webhook with url '{{ hook_base }}r'"
  - name: secret-reference-changed
    base_fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}h') { secret: 'pass:e2e/hook-secret' }"]
    fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}h') { secret: 'pass:e2e/hook-secret-2' }"]
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 0}
      contains:
        - '~ org_webhook[url="{{ hook_base }}h"] {'
        - '~ secret = "pass:e2e/hook-secret" -> "pass:e2e/hook-secret-2"'
      not_contains: ["removing secret for webhook"]
  - name: secret-unchanged
    base_fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}h') { secret: 'pass:e2e/hook-secret' }"]
    fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}h') { secret: 'pass:e2e/hook-secret' }"]
    plan:
      expect: noop
      counts: {add: 0, change: 0, delete: 0}
      not_contains: ["removing secret for webhook", "org_webhook["]
