# Offline tier (battery, validation and plan): immutable releases (eclipse-csi/otterdog#665).
id: O-VAL-IMMUTABLE-RELEASES
tier: offline
title: Immutable releases are validated and planned at organization and repository level
description: >-
  Since #665 (v1.7.0) the organization settings immutable_releases_enforced_repositories (all | none | selected,
  enumerated by the schema) and immutable_releases_selected_repositories, and the repository setting
  immutable_releases_enabled are managed. OrganizationSettings.validate warns about selected repositories while the
  policy is not 'selected' (the list is not planned then); the selected repositories are compared without case and
  duplicates; a repository whose releases the organization enforces does not manage its own setting (coerced at
  load, so the documented Info never prints, like KB-033). Older SUTs skip it (fixed_in).
priority: P2
tags: [offline, org-settings, repo]
observe: true
fixed_in: 1.7.0.dev58
variables: {plan: free}
references:
  - pr: 665
    note: >-
      "Apply fixes from PR 664": adds the immutable releases settings of organizations and repositories (and their
      validation); older SUTs have no such keys in the template, so the scenario skips them (fixed_in).
steps:
  - name: unknown-policy
    fragments:
      settings: ["immutable_releases_enforced_repositories: 'some'"]
    validate:
      ok: false
      exit_code: 1
      contains:
        - >-
          failed to load configuration: invalid value at 'settings.immutable_releases_enforced_repositories': 'some'
          is not one of ['all', 'none', 'selected']
  - name: selected-repositories-ignored
    fragments:
      settings:
        - "immutable_releases_enforced_repositories: 'all'"
        - "immutable_releases_selected_repositories: ['{{ p }}-app']"
      repositories: ["orgs.newRepo('{{ p }}-app')"]
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      exit_code: 0
      contains:
        - >-
          Warning: 'immutable_releases_enforced_repositories' is set to 'all', but
          'immutable_releases_selected_repositories' is set to '['{{ p }}-app']', setting will be ignored.
  - name: repository-setting-enforced
    known_bug: KB-033
    fragments:
      settings: ["immutable_releases_enforced_repositories: 'all'"]
      repositories: ["orgs.newRepo('{{ p }}-app') { immutable_releases_enabled: false }"]
    validate:  # the repository is coerced at load (immutable_releases_enabled unset), so the Info never prints
      verbose: true
      ok: true
      errors: 0
      infos: 1
      exit_code: 0
      contains:
        - >-
          Info: repository[name="{{ p }}-app"] has 'immutable_releases_enabled' disabled, while the organization
          enforces immutable releases for this repository, setting will be ignored.
  - name: policy-changed
    base_fragments:
      repositories: ["orgs.newRepo('{{ p }}-app')"]
    fragments:
      settings:
        - "immutable_releases_enforced_repositories: 'selected'"
        - "immutable_releases_selected_repositories: ['{{ p }}-app']"
      repositories: ["orgs.newRepo('{{ p }}-app')"]
    plan:  # settings count one change per key
      expect: changes
      counts: {add: 0, change: 2, delete: 0}
      contains: ['~ settings {', '~ immutable_releases_enforced_repositories = "none" -> "selected"']
  - name: selected-repositories-normalized
    base_fragments:
      settings:
        - "immutable_releases_enforced_repositories: 'selected'"
        - "immutable_releases_selected_repositories: ['{{ p }}-app']"
      repositories: ["orgs.newRepo('{{ p }}-app')"]
    fragments:
      settings:
        - "immutable_releases_enforced_repositories: 'selected'"
        - "immutable_releases_selected_repositories: ['{{ p | upper }}-APP', '{{ p }}-app']"
      repositories: ["orgs.newRepo('{{ p }}-app')"]
    plan:  # names are compared without case, duplicates dropped
      expect: noop
      counts: {add: 0, change: 0, delete: 0}
  - name: repository-enabled
    base_fragments:
      repositories: ["orgs.newRepo('{{ p }}-app')"]
    fragments:
      repositories: ["orgs.newRepo('{{ p }}-app') { immutable_releases_enabled: true }"]
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 0}
      contains: ['~ repository[name="{{ p }}-app"] {', '~ immutable_releases_enabled = false -> true']
  - name: repository-enforced-by-organization
    base_fragments:
      settings: ["immutable_releases_enforced_repositories: 'all'"]
      repositories: ["orgs.newRepo('{{ p }}-app')"]
    fragments:
      settings: ["immutable_releases_enforced_repositories: 'all'"]
      repositories: ["orgs.newRepo('{{ p }}-app') { immutable_releases_enabled: true }"]
    plan:  # the organization enforces immutable releases: the repository setting is not managed
      expect: noop
      counts: {add: 0, change: 0, delete: 0}
