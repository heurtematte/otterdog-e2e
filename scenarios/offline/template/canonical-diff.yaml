# Offline tier (SPEC 19, P1): the canonical form of a configuration.
id: O-CANON
title: canonical-diff compares the configuration with its canonical form
description: >-
  canonical-diff --local re-renders the configuration the way otterdog writes it (import, fetch-config) and prints a
  unified diff against the file as written. The harness renders a two-layer configuration with a header comment, so
  the diff is never empty and its content is checked: the header comment exists only in the file as written and is a
  removed ('-') line, the canonical template import (`local orgs = import ...` without the harness's alias) exists only
  in the canonical form and is an added ('+') line, and the command exits 0. The 'already-canonical' step writes a
  complete configuration in the form otterdog itself writes (files/canonical-form.jsonnet) and expects an empty diff,
  so a change of the canonical form or of its comparison shows up. The 'bracketed-description' step writes the same
  file with a repository description holding a bracketed word: the canonical form drops it (KB-050, also in the
  configuration written by import), so the diff is not empty and the step declares the bug. The labels are known to
  be swapped (KB-010: the lines of the original file are shown on the 'canonical' side): the 'labels' step asserts the
  correct orientation ('--- original', '+++ canonical') and declares the bug. A fix of either bug shows as a
  KnownBugNotReproducedWarning instead of a failure (BAT-12).
priority: P1
tags: [offline, template, repo, rulesets]
observe: true
references:
  - pr: 900
    note: >-
      "Feat/ruleset additional rule types" (head 15c685a): step ruleset-rule-lists sets the push rules and the
      code scanning tools, whose lists the canonical form keeps in order: base fails to load them (exit 1); head
      validates them (restricted_file_extensions warns on the free plan), shows them and canonical-diff compares
      them.
    expected_deltas:
      - {step: ruleset-rule-lists, kind: cli, key: canonical-diff}
      - {step: ruleset-rule-lists, kind: cli, key: show}
      - {step: ruleset-rule-lists, kind: cli, key: validate}
steps:
  - name: canonical
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-canon') { description: 'otterdog e2e: canonical form', has_wiki: false }"
    validate: {ok: true, errors: 0}
    commands:
      canonical-diff:
        exit_code: 0
        contains:
          - "-  Generated by otterdog-acceptance"
          - "+local orgs = import "
          - "{{ p }}-canon"
  - name: already-canonical
    config: {file: files/canonical-form.jsonnet, vars: {repo_description: "otterdog e2e: canonical form"}}
    validate: {ok: true, errors: 0}
    commands:
      canonical-diff:
        exit_code: 0
        contains: ["Showing canonical diff"]
        not_contains: ["@@ ", "--- ", "+++ ", "{{ p }}-canon"]
  - name: bracketed-description
    known_bug: {id: KB-050, phases: [commands]}
    config: {file: files/canonical-form.jsonnet, vars: {repo_description: "[e2e] canonical form"}}
    validate: {ok: true, errors: 0}
    commands:
      canonical-diff:
        exit_code: 0
        contains: ["Showing canonical diff"]
        not_contains: ["@@ ", "canonical form"]
  - name: ruleset-rule-lists
    fragments:
      repositories:
        - |-
          orgs.newRepo('{{ p }}-canon') {
            description: 'otterdog e2e: canonical form',
            has_wiki: false,
            rulesets: [
              orgs.newRepoRuleset('{{ p }}-scanning') {
                include_refs+: ['~DEFAULT_BRANCH'],
                required_code_scanning: orgs.newCodeScanning() { code_scanning_tools+: ['CodeQL:all:all'] },
              },
              orgs.newRepoRuleset('{{ p }}-push') {
                target: 'push',
                allows_creations: true,
                allows_deletions: true,
                allows_force_pushes: true,
                required_pull_request: null,
                required_status_checks: null,
                restricted_file_extensions+: ['*.exe'],
              },
            ],
          }
    # with #900 the canonical form writes the rule lists as a whole ('code_scanning_tools: [', not '+:'), so a default
    # list can be narrowed on import; before: the keys and template functions fail to load
    commands:
      canonical-diff: {exit_code: null}
      show: {exit_code: null}
  - name: labels
    known_bug: {id: KB-010, phases: [commands]}
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-canon') { description: 'otterdog e2e: canonical form', has_wiki: false }"
    commands:
      canonical-diff:
        exit_code: 0
        contains: ["--- original", "+++ canonical"]
