# Offline tier (SPEC 19): plan-dependent validation of organization secrets.
id: O-VAL-ORGSECRET-PRIVATE-FREE
title: Private organization secrets are refused on the free plan
description: >-
  On a free plan, organization secrets can only be visible to public repositories. A secret with visibility
  'private' must be reported as exactly one validation error naming the secret, the visibility and the plan. The
  value is a dummy ('********'): otterdog skips dummy values when it compares secrets, and the scenario never
  carries a real secret.
priority: P0
tags: [offline, secrets, org-settings]
observe: true
variables: {plan: free}
steps:
  - name: private-secret-on-free
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_PRIVATE') { value: '********', visibility: 'private' }"
    validate:
      ok: false
      errors: 1
      contains:
        - "org_secret[name=\"{{ P }}_PRIVATE\"] has 'visibility' of value 'private', which is not available for an organization with free plan."
