# Offline tier (battery, cli): secret values in local-plan (scenarios/offline/cli/<group>: the tier is that of
# offline/, the directory right below scenarios/).
id: O-LPLAN-SECRET-REFS
tier: offline
title: local-plan shows dummy secrets as <DUMMY> and diffs secret references
description: >-
  local-plan never resolves secrets (resolve_secrets is off) and replaces dummy values by '<DUMMY>' on both sides
  before the diff: a new secret with a dummy value is added with 'value = "<DUMMY>"' and never shows the asterisks,
  a dummy on both sides plans nothing (with --update-secrets local-plan forces it while local-apply skips it, a new
  finding asserted by tests/offline/test_cli_local_plan_flags.py), while provider references are compared as plain
  strings ('~ value = "pass:e2e/a" -> "pass:e2e/b"', organization, repository and environment secrets alike) and an
  unchanged reference plans nothing. This is what the webapp shows in pull request validations.
priority: P1
tags: [offline, cli, secrets, environments]
observe: true
variables: {plan: free}
steps:
  - name: dummy-added
    base_fragments: {}
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_S') { value: '********' }"]
    plan:
      expect: changes
      counts: {add: 1, change: 0, delete: 0}
      contains:
        - '+ add org_secret[name="{{ P }}_S"] {'
        - '"<DUMMY>"'
        - "there have been 1 validation infos, enable verbose output to display them."
      not_contains: ['"********"']
  - name: dummy-unchanged
    base_fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_S') { value: '********' }"]
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_S') { value: '********' }"]
    plan:
      expect: noop
      counts: {add: 0, change: 0, delete: 0}
      not_contains: ['org_secret[name="{{ P }}_S"]']
  - name: references-changed
    base_fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_S') { value: 'pass:e2e/a' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-vault') {
            secrets: [orgs.newRepoSecret('{{ P }}_R') { value: 'pass:e2e/repo-a' }],
            environments: [
              orgs.newEnvironment('{{ p }}-env') { secrets: [orgs.newEnvSecret('{{ P }}_E') { value: 'pass:e2e/env-a' }] },
            ],
          }
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_S') { value: 'pass:e2e/b' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-vault') {
            secrets: [orgs.newRepoSecret('{{ P }}_R') { value: 'pass:e2e/repo-b' }],
            environments: [
              orgs.newEnvironment('{{ p }}-env') { secrets: [orgs.newEnvSecret('{{ P }}_E') { value: 'pass:e2e/env-b' }] },
            ],
          }
    validate: {ok: true, errors: 0}
    plan:
      expect: changes
      counts: {add: 0, change: 3, delete: 0}
      contains:
        - '~ org_secret[name="{{ P }}_S"] {'
        - '~ value = "pass:e2e/a" -> "pass:e2e/b"'
        - '~ repo_secret[name="{{ P }}_R", repository={{ p }}-vault] {'
        - '~ value = "pass:e2e/repo-a" -> "pass:e2e/repo-b"'
        - '~ env_secret[name="{{ P }}_E", environment={{ p }}-env] {'
        - '~ value = "pass:e2e/env-a" -> "pass:e2e/env-b"'
      not_contains: ["! org_secret[", "! repo_secret[", "! env_secret[", "<DUMMY>"]
  - name: reference-unchanged
    base_fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_S') { value: 'pass:e2e/a' }"]
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_S') { value: 'pass:e2e/a' }"]
    plan:
      expect: noop
      counts: {add: 0, change: 0, delete: 0}
      not_contains: ['org_secret[name="{{ P }}_S"]']
