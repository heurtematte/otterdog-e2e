# Offline tier (battery, cli): --only-secrets (scenarios/offline/cli/<group>: the tier is that of offline/, the
# directory right below scenarios/).
id: O-LPLAN-ONLY-SECRETS
tier: offline
title: --only-secrets plans secret patches only, organization, repository and environment ones
description: >-
  --only-secrets drops every patch that is not a secret: with --update-secrets the forced updates of the
  organization, repository and environment secrets are planned ('!' blocks, four plus two plus two changed keys)
  while the description change of their repository is hidden; without --update-secrets nothing is left to plan
  (secret values are never compared). The control step without the flag shows the repository change and no forced
  update, so the difference is the flag's.
priority: P2
tags: [offline, cli, secrets, repo, environments]
observe: true
variables: {plan: free}
steps:
  - name: only-secrets-forced
    base_fragments: &base
      secrets: ["orgs.newOrgSecret('{{ P }}_S') { value: 'pass:e2e/org' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-a') {
            description: 'before',
            secrets: [orgs.newRepoSecret('{{ P }}_R') { value: 'pass:e2e/repo' }],
            environments: [
              orgs.newEnvironment('{{ p }}-env') { secrets: [orgs.newEnvSecret('{{ P }}_E') { value: 'pass:e2e/env' }] },
            ],
          }
    fragments: &head
      secrets: ["orgs.newOrgSecret('{{ P }}_S') { value: 'pass:e2e/org' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-a') {
            description: 'after',
            secrets: [orgs.newRepoSecret('{{ P }}_R') { value: 'pass:e2e/repo' }],
            environments: [
              orgs.newEnvironment('{{ p }}-env') { secrets: [orgs.newEnvSecret('{{ P }}_E') { value: 'pass:e2e/env' }] },
            ],
          }
    validate: {ok: true, errors: 0}
    plan:
      expect: changes
      only_secrets: true
      update_secrets: true
      counts: {add: 0, change: 8, delete: 0}
      contains:
        - '! org_secret[name="{{ P }}_S"] {'
        - '! value                 = "pass:e2e/org" -> "pass:e2e/org"'
        - '! repo_secret[name="{{ P }}_R", repository={{ p }}-a] {'
        - '! env_secret[name="{{ P }}_E", environment={{ p }}-env] {'
      not_contains: ['repository[name="{{ p }}-a"]', '"before" -> "after"']
  - name: only-secrets-unforced
    base_fragments: *base
    fragments: *head
    plan:
      expect: noop
      only_secrets: true
      counts: {add: 0, change: 0, delete: 0}
      not_contains: ['repository[name="{{ p }}-a"]', "! org_secret[", "! repo_secret[", "! env_secret["]
  - name: control
    base_fragments: *base
    fragments: *head
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 0}
      contains:
        - '~ repository[name="{{ p }}-a"] {'
        - '~ description = "before" -> "after"'
      not_contains: ["! org_secret[", "! repo_secret[", "! env_secret[", "_secret[name="]
