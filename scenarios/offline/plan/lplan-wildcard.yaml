# Offline tier (battery, plan semantics): keys ending with '*' (webhook URLs hiding a token, #84).
id: O-LPLAN-WILDCARD
tier: offline
title: A webhook url ending with '*' matches the existing hook whose url starts with the prefix
description: >-
  generate_live_patch_of_list matches a configured key ending with '*' with the existing object whose key starts with
  the prefix, so a webhook whose real url carries a token can be configured as '<prefix>*' (import masks urls the
  same way): nothing is removed nor added, only the other changes of the hook are planned, under the configured
  header, for organization and repository hooks. An existing hook outside the prefix is not matched (remove + add).
priority: P1
tags: [offline, webhooks]
observe: true
variables: {plan: free}
steps:
  - name: same-hook
    base_fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}w?token=x') { events+: ['push'] }"]
    fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}w*') { events+: ['push'] }"]
    validate: {ok: true, errors: 0}
    plan:
      expect: noop
      counts: {add: 0, change: 0, delete: 0}
      not_contains: ['+ add ', '- remove ', '~ org_webhook[']
  - name: changed-hook
    base_fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}w?token=x') { events+: ['push'] }"]
    fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}w*') { events+: ['push', 'pull_request'] }"]
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 0}
      contains: ['~ org_webhook[url="{{ hook_base }}w*"] {', '+ "pull_request"']
      not_contains: ['+ add ', '- remove ']
  - name: repository-hook
    base_fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-hooks') { webhooks: [orgs.newRepoWebhook('{{ hook_base }}r?token=x') { events+: ['push'] }] }"
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-hooks') { webhooks: [orgs.newRepoWebhook('{{ hook_base }}r*') { events+: ['push'], active: false }] }"
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 0}
      contains:
        - '~ repo_webhook[url="{{ hook_base }}r*", repository={{ p }}-hooks] {'
        - '~ active = true -> false'
      not_contains: ['+ add ', '- remove ']
  - name: prefix-without-match
    base_fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}other?token=x') { events+: ['push'] }"]
    fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}w*') { events+: ['push'] }"]
    plan:
      expect: changes
      counts: {add: 1, change: 0, delete: 1}
      contains:
        - '- remove org_webhook[url="{{ hook_base }}other?token=x"] {'
        - '+ add org_webhook[url="{{ hook_base }}w*"] {'
