# Offline tier (battery, validation): organization secret visibility.
id: O-VAL-ORG-SECRETS
tier: offline
title: Organization secret visibility and selected repositories are validated
description: >-
  OrganizationSecret.validate accepts the visibilities public | private | selected (private only above the free
  plan, see O-VAL-ORGSECRET-PRIVATE-FREE) and warns that selected_repositories are ignored unless the visibility is
  'selected'. The error and the warning are asserted with the secret's header, and a 'selected' secret naming a
  repository of the configuration validates silently and is planned.
priority: P2
tags: [offline, secrets]
observe: true
variables: {plan: free}
steps:
  - name: unknown-visibility
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_VIS') { value: '********', visibility: 'everyone' }"
    validate:
      ok: false
      errors: 1
      exit_code: 1
      contains:
        - >-
          Error: org_secret[name="{{ P }}_VIS"] has 'visibility' of value 'everyone', while only values ('public' |
          'private' | 'selected') are allowed.
  - name: selected-repositories-ignored
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_SEL') { value: '********', visibility: 'public', selected_repositories: ['{{ p }}-r'] }"
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      exit_code: 0
      contains:
        - >-
          Warning: org_secret[name="{{ P }}_SEL"] has 'visibility' set to 'public', but 'selected_repositories' is set
          to '['{{ p }}-r']', setting will be ignored.
  - name: selected-visibility
    base_fragments: {}
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_OK') { value: 'pass:e2e/ok', visibility: 'selected', selected_repositories: ['{{ p }}-r'] }"
      repositories: ["orgs.newRepo('{{ p }}-r')"]
    validate:
      ok: true
      errors: 0
      exit_code: 0
      contains: ["Validation succeeded"]
      not_contains: ["Error:", "Warning:"]
    plan:
      expect: changes
      counts: {add: 2, change: 0, delete: 0}
      contains:
        - '+ add org_secret[name="{{ P }}_OK"]'
        - '+ "{{ p }}-r"'
        - '= "selected"'
