# Offline tier (extension of SPEC 19, P1): validation of an ORGANIZATION ruleset whose status checks lack 'strict'
# (the organization-ruleset side of eclipse-csi/otterdog#790; live counterpart: E-ORG-RULESET).
id: O-VAL-ORG-RULESET-STRICT
title: Org ruleset status checks without 'strict' on an enterprise plan
description: >-
  #790 validates the required status checks of every ruleset. For an ORGANIZATION ruleset (enterprise plan, so the
  plan gate lets it through) whose required_status_checks has no 'strict', SUTs that contain #790 do not report the
  missing parameter: validation crashes with "'GitHubOrganization' object has no attribute 'get_model_header'" (exit
  2; the webapp shows a generic "Validation failed while evaluating the configuration"), because the parent object of
  an org ruleset is the organization, not a repository. Older SUTs validate the configuration (and fail at apply
  time). The outcome is SUT-dependent, so the YAML only records it: tests/offline/test_scenarios.py expects success
  on SUTs without #790, a validation error naming the parameter on fixed SUTs and reports the crash as an expected
  failure (known defect) until upstream fixes it. In the #790 differential it is deliberately NOT an expected delta:
  the change head makes here is a crash, not the intended validation error.
priority: P1
tags: [offline, rulesets, org-settings]
observe: true
variables: {plan: enterprise}
references:
  - pr: 790
    note: >-
      Deliberately referenced without an expected delta: base (b5f7bb1) validates this org ruleset, head (9bdeb75)
      crashes with "'GitHubOrganization' object has no attribute 'get_model_header'" (exit 2) instead of reporting the
      missing parameter, a defect introduced by #790 (KB-008) that the differential report must keep flagging as an
      UNEXPECTED delta until it is fixed (live counterpart: E-ORG-RULESET, enterprise.org-ruleset.missing-strict).
  - pr: 777
    note: >-
      "fix: model allowed_merge_methods in the pull_request ruleset rule": the pull_request rule of rulesets gains
      allowed_merge_methods (template default merge, squash, rebase), so show, show-default and local-plan print
      it for every ruleset with a pull_request rule.
    expected_deltas:
      - {step: org-no-strict, kind: cli, key: show}
steps:
  - name: org-no-strict
    fragments:
      rulesets:
        - |-
          orgs.newOrgRuleset('{{ p }}-org-rs') {
            include_refs+: ['~DEFAULT_BRANCH'],
            include_repo_names+: ['~ALL'],
            required_status_checks: { status_checks: ['ci'] },
          }
