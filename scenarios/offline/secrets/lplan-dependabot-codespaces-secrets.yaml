# Offline tier (battery, plan): Dependabot and Codespaces secrets in local-plan (eclipse-csi/otterdog#890).
id: O-LPLAN-DEPENDABOT-CODESPACES-SECRETS
tier: offline
title: local-plan diffs Dependabot and Codespaces secrets as objects of their own kind
description: >-
  Since #890 (main after v1.7.1) local-plan compares the Dependabot and Codespaces secrets of the organization and
  of each repository like Actions secrets, each kind on its own (a secret of the same name in two kinds is two
  objects): a dummy value shows as '<DUMMY>', references are compared as strings, a removal plans a delete,
  --update-secrets forces an update of every non-dummy secret of every kind and --only-secrets keeps the four kinds.
  Older SUTs skip it (fixed_in).
priority: P1
tags: [offline, secrets, repo]
observe: true
fixed_in: 1.8.0
variables: {plan: free}
references:
  - pr: 890
    note: >-
      "feat: manage Dependabot and Codespaces secrets": the four secret kinds are planned; the template of older
      SUTs has none of the four functions, so the scenario skips them (fixed_in).
steps:
  - name: same-name-in-every-kind
    base_fragments: {}
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_TOKEN') { value: '********' }"]
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_TOKEN') { value: '********' }]"
        - "codespaces_secrets: [orgs.newOrgCodespacesSecret('{{ P }}_TOKEN') { value: '********' }]"
    plan:
      expect: changes
      counts: {add: 3, change: 0, delete: 0}
      contains:
        - '+ add org_secret[name="{{ P }}_TOKEN"] {'
        - '+ add org_dependabot_secret[name="{{ P }}_TOKEN"] {'
        - '+ add org_codespaces_secret[name="{{ P }}_TOKEN"] {'
        - '"<DUMMY>"'
      not_contains: ['"********"']
  - name: references-changed
    base_fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_DEP') { value: 'pass:e2e/dep-a' }]"
      repositories:
        - "orgs.newRepo('{{ p }}-r') { codespaces_secrets: [orgs.newRepoCodespacesSecret('{{ P }}_RCS') { value: 'pass:e2e/rcs-a' }] }"
    fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_DEP') { value: 'pass:e2e/dep-b' }]"
      repositories:
        - "orgs.newRepo('{{ p }}-r') { codespaces_secrets: [orgs.newRepoCodespacesSecret('{{ P }}_RCS') { value: 'pass:e2e/rcs-b' }] }"
    plan:
      expect: changes
      counts: {add: 0, change: 2, delete: 0}
      contains:
        - '~ org_dependabot_secret[name="{{ P }}_DEP"] {'
        - '~ value = "pass:e2e/dep-a" -> "pass:e2e/dep-b"'
        - '~ repo_codespaces_secret[name="{{ P }}_RCS", repository={{ p }}-r] {'
        - '~ value = "pass:e2e/rcs-a" -> "pass:e2e/rcs-b"'
  - name: removed
    base_fragments:
      extra:
        - "codespaces_secrets: [orgs.newOrgCodespacesSecret('{{ P }}_CS') { value: 'pass:e2e/cs' }]"
      repositories:
        - "orgs.newRepo('{{ p }}-r') { dependabot_secrets: [orgs.newRepoDependabotSecret('{{ P }}_RDEP') { value: 'pass:e2e/rdep' }] }"
    fragments:
      repositories: ["orgs.newRepo('{{ p }}-r')"]
    plan:
      expect: changes
      counts: {add: 0, change: 0, delete: 2}
      contains:
        - '- remove org_codespaces_secret[name="{{ P }}_CS"] {'
        - '- remove repo_dependabot_secret[name="{{ P }}_RDEP", repository={{ p }}-r] {'
  - name: forced-update
    base_fragments:
      extra: &unchanged
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_DEP') { value: 'pass:e2e/dep' }]"
        - "codespaces_secrets: [orgs.newOrgCodespacesSecret('{{ P }}_CS') { value: 'pass:e2e/cs' }]"
    fragments:
      extra: *unchanged
    plan:  # every key of a forced secret is counted (4 per organization secret)
      expect: changes
      update_secrets: true
      counts: {add: 0, change: 8, delete: 0}
      contains: ['! org_dependabot_secret[name="{{ P }}_DEP"] {', '! org_codespaces_secret[name="{{ P }}_CS"] {']
  - name: only-secrets
    base_fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_DEP') { value: 'pass:e2e/dep-a' }]"
      repositories: ["orgs.newRepo('{{ p }}-r') { description: 'before' }"]
    fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_DEP') { value: 'pass:e2e/dep-b' }]"
      repositories: ["orgs.newRepo('{{ p }}-r') { description: 'after' }"]
    plan:
      expect: changes
      only_secrets: true
      counts: {add: 0, change: 1, delete: 0}
      contains: ['~ org_dependabot_secret[name="{{ P }}_DEP"] {']
      not_contains: ['repository[', description]
