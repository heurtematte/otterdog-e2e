# Offline tier (battery, validation): organization, repository and environment secrets.
id: O-VAL-SECRETS
tier: offline
title: Secret names and values are validated at every level
description: >-
  Secret.validate (organization, repository and environment secrets alike) refuses the reserved GITHUB_ prefix,
  warns about a value that does not use a supported credential provider (plain values and unknown prefixes such as
  'foo:'), informs with -v that a dummy '********' value is skipped, and validates 'pass:' references silently;
  lowercase names are accepted (GitHub upper-cases them). The warnings are asserted without the value: otterdog
  echoes plain values in validate and local-plan output (KB-026) and a reference with two ':' crashes validation
  (KB-025), each the expected failure of its own step (dummy values only).
priority: P1
tags: [offline, secrets, environments]
observe: true
variables: {plan: free}
steps:
  - name: github-prefix
    fragments:
      secrets:
        - "orgs.newOrgSecret('GITHUB_{{ P }}_ORG') { value: 'pass:e2e/org' }"
      repositories:
        - |-
          orgs.newRepo('{{ p }}-secrets') {
            secrets: [orgs.newRepoSecret('GITHUB_{{ P }}_REPO') { value: 'pass:e2e/repo' }],
            environments: [
              orgs.newEnvironment('{{ p }}-env') {
                secrets: [orgs.newEnvSecret('GITHUB_{{ P }}_ENV') { value: 'pass:e2e/env' }],
              },
            ],
          }
    validate:
      ok: false
      errors: 3
      contains:
        - "Error: org_secret[name=\"GITHUB_{{ P }}_ORG\"] starts with prefix 'GITHUB_' which is not allowed for secrets."
        - "Error: repo_secret[name=\"GITHUB_{{ P }}_REPO\"] starts with prefix 'GITHUB_' which is not allowed for secrets."
        - "Error: env_secret[name=\"GITHUB_{{ P }}_ENV\"] starts with prefix 'GITHUB_' which is not allowed for secrets."
      not_contains: ["that does not use a credential provider"]
  - name: provider-warnings
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_PLAIN') { value: 'e2e-dummy-{{ run }}' }"
        - "orgs.newOrgSecret('{{ P }}_FOO') { value: 'foo:e2e/b' }"
        - "orgs.newOrgSecret('{{ P }}_REF') { value: 'pass:e2e/org' }"
      repositories:
        - |-
          orgs.newRepo('{{ p }}-secrets') {
            environments: [
              orgs.newEnvironment('{{ p }}-env') {
                secrets: [orgs.newEnvSecret('{{ P }}_ENV_PLAIN') { value: 'e2e-dummy-{{ run }}' }],
              },
            ],
          }
    validate:
      ok: true
      errors: 0
      warnings_min: 3
      exit_code: 0
      contains:
        - "Validation succeeded': 0 info(s), 3 warning(s), 0 error(s)"
        - "Warning: org_secret[name=\"{{ P }}_PLAIN\"] has a value"
        - "Warning: org_secret[name=\"{{ P }}_FOO\"] has a value"
        - "Warning: env_secret[name=\"{{ P }}_ENV_PLAIN\"] has a value"
        - "that does not use a credential provider."
      not_contains: ["org_secret[name=\"{{ P }}_REF\"] has a value"]
  - name: dummy-values
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_ORG_DUMMY') { value: '********' }"
      repositories:
        - |-
          orgs.newRepo('{{ p }}-secrets') {
            secrets: [orgs.newRepoSecret('{{ P }}_REPO_DUMMY') { value: '***' }],
            environments: [
              orgs.newEnvironment('{{ p }}-env') {
                secrets: [orgs.newEnvSecret('{{ P }}_ENV_DUMMY') { value: '********' }],
              },
            ],
          }
    validate:
      verbose: true
      ok: true
      errors: 0
      infos: 3
      exit_code: 0
      contains:
        - "Info: org_secret[name=\"{{ P }}_ORG_DUMMY\"] only has a dummy value, resource will be skipped."
        - "Info: repo_secret[name=\"{{ P }}_REPO_DUMMY\"] only has a dummy value, resource will be skipped."
        - "Info: env_secret[name=\"{{ P }}_ENV_DUMMY\"] only has a dummy value, resource will be skipped."
      not_contains: ["Warning:"]
  - name: lowercase-name
    fragments:
      repositories:
        - |-
          orgs.newRepo('{{ p }}-secrets') {
            secrets: [orgs.newRepoSecret('{{ P | lower }}_lower') { value: 'pass:e2e/lower' }],
          }
    validate:
      ok: true
      errors: 0
      exit_code: 0
      contains: ["Validation succeeded"]
      not_contains: ["Error:", "Warning:"]
  - name: two-colons
    known_bug: KB-025
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_COLONS') { value: 'pass:a:b' }"
    validate:
      ok: true
      errors: 0
      exit_code: 0
      not_contains: ["too many values to unpack"]
  - name: plain-value-not-echoed
    known_bug: KB-026
    base_fragments: {}
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_PLAIN') { value: 'e2e-dummy-{{ run }}' }"]
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      contains: ["Warning: org_secret[name=\"{{ P }}_PLAIN\"] has a value", "that does not use a credential provider."]
      not_contains: ["e2e-dummy-{{ run }}"]
    plan:
      expect: changes
      counts: {add: 1, change: 0, delete: 0}
      contains: ['+ add org_secret[name="{{ P }}_PLAIN"] {']
      not_contains: ["e2e-dummy-{{ run }}"]
