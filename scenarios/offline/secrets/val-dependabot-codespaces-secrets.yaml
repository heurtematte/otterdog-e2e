# Offline tier (battery, validation): Dependabot and Codespaces secrets (eclipse-csi/otterdog#890).
id: O-VAL-DEPENDABOT-CODESPACES-SECRETS
tier: offline
title: Dependabot and Codespaces secrets are validated like Actions secrets at organization and repository level
description: >-
  Since #890 (main after v1.7.1) an organization and its repositories manage dependabot_secrets and codespaces_secrets
  (orgs.newOrgDependabotSecret, newOrgCodespacesSecret, newRepoDependabotSecret, newRepoCodespacesSecret). They share
  the rules of Actions secrets (Secret.validate: the reserved GITHUB_ prefix, uppercase names, a value without
  credential provider warned, a dummy value skipped with an Info), organization ones the visibility rules (an
  unknown visibility is a schema error at load, selected_repositories outside 'selected' warned), but only Actions
  organization secrets are gated by the plan: a private Dependabot or Codespaces secret validates on the free plan.
  Older SUTs skip it (fixed_in).
priority: P1
tags: [offline, secrets, repo]
observe: true
fixed_in: 1.8.0
variables: {plan: free}
references:
  - pr: 890
    note: >-
      "feat: manage Dependabot and Codespaces secrets": the four secret kinds, their validation and their plan; the
      template of older SUTs has none of the four functions, so the scenario skips them (fixed_in).
steps:
  - name: github-prefix
    fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('GITHUB_{{ P }}_DEP') { value: 'pass:e2e/dep' }]"
        - "codespaces_secrets: [orgs.newOrgCodespacesSecret('GITHUB_{{ P }}_CS') { value: 'pass:e2e/cs' }]"
      repositories:
        - |-
          orgs.newRepo('{{ p }}-secrets') {
            dependabot_secrets: [orgs.newRepoDependabotSecret('GITHUB_{{ P }}_RDEP') { value: 'pass:e2e/rdep' }],
            codespaces_secrets: [orgs.newRepoCodespacesSecret('GITHUB_{{ P }}_RCS') { value: 'pass:e2e/rcs' }],
          }
    validate:  # otterdog exits with the error count (KB-034): no exit_code expectation
      ok: false
      errors: 4
      contains:
        - "Error: org_dependabot_secret[name=\"GITHUB_{{ P }}_DEP\"] starts with prefix 'GITHUB_' which is not allowed for secrets."
        - "Error: org_codespaces_secret[name=\"GITHUB_{{ P }}_CS\"] starts with prefix 'GITHUB_' which is not allowed for secrets."
        - "Error: repo_dependabot_secret[name=\"GITHUB_{{ P }}_RDEP\"] starts with prefix 'GITHUB_' which is not allowed for secrets."
        - "Error: repo_codespaces_secret[name=\"GITHUB_{{ P }}_RCS\"] starts with prefix 'GITHUB_' which is not allowed for secrets."
  - name: lowercase-names
    fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P | lower }}_dep') { value: 'pass:e2e/dep' }]"
      repositories:
        - |-
          orgs.newRepo('{{ p }}-secrets') {
            codespaces_secrets: [orgs.newRepoCodespacesSecret('{{ P | lower }}_rcs') { value: 'pass:e2e/rcs' }],
          }
    validate:
      ok: false
      errors: 2
      contains:
        - >-
          Error: org_dependabot_secret[name="{{ P | lower }}_dep"] has 'name' of value '{{ P | lower }}_dep' which is
          not uppercase, while only uppercase names are allowed for secrets.
        - >-
          Error: repo_codespaces_secret[name="{{ P | lower }}_rcs"] has 'name' of value '{{ P | lower }}_rcs' which is
          not uppercase, while only uppercase names are allowed for secrets.
  - name: unknown-visibility
    fragments:
      extra:
        - "codespaces_secrets: [orgs.newOrgCodespacesSecret('{{ P }}_VIS') { value: 'pass:e2e/cs', visibility: 'everyone' }]"
    validate:
      ok: false
      exit_code: 1
      contains:
        - >-
          failed to load configuration: invalid value at 'codespaces_secrets[name="{{ P }}_VIS"].visibility':
          'everyone' is not one of ['public', 'private', 'selected']
  - name: private-on-free
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_ACTIONS') { value: 'pass:e2e/a', visibility: 'private' }"]
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_DEP') { value: 'pass:e2e/dep', visibility: 'private' }]"
        - "codespaces_secrets: [orgs.newOrgCodespacesSecret('{{ P }}_CS') { value: 'pass:e2e/cs', visibility: 'private' }]"
    validate:  # only the Actions secret is gated by the plan
      ok: false
      errors: 1
      exit_code: 1
      contains:
        - >-
          Error: org_secret[name="{{ P }}_ACTIONS"] has 'visibility' of value 'private', which is not available for an
          organization with free plan.
      not_contains: [org_dependabot_secret, org_codespaces_secret]
  - name: selected-repositories-ignored
    fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_DEP') { value: 'pass:e2e/dep', selected_repositories: ['{{ p }}-r'] }]"
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      exit_code: 0
      contains:
        - >-
          Warning: org_dependabot_secret[name="{{ P }}_DEP"] has 'visibility' set to 'public', but
          'selected_repositories' is set to '['{{ p }}-r']', setting will be ignored.
  - name: provider-and-dummy-values
    fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_PLAIN') { value: 'e2e-dummy-{{ run }}' }]"
      repositories:
        - |-
          orgs.newRepo('{{ p }}-secrets') {
            codespaces_secrets: [orgs.newRepoCodespacesSecret('{{ P }}_DUMMY') { value: '********' }],
          }
    validate:  # the plain value is echoed in the warning (KB-026): asserted without it
      verbose: true
      ok: true
      errors: 0
      infos: 1
      warnings_min: 1
      exit_code: 0
      contains:
        - "Warning: org_dependabot_secret[name=\"{{ P }}_PLAIN\"] has a value"
        - "that does not use a credential provider."
        - "Info: repo_codespaces_secret[name=\"{{ P }}_DUMMY\"] only has a dummy value, resource will be skipped."
  - name: valid-secrets
    base_fragments: {}
    fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_DEP') { value: 'pass:e2e/dep', visibility: 'selected', selected_repositories: ['{{ p }}-secrets'] }]"
        - "codespaces_secrets: [orgs.newOrgCodespacesSecret('{{ P }}_CS') { value: 'pass:e2e/cs' }]"
      repositories:
        - |-
          orgs.newRepo('{{ p }}-secrets') {
            dependabot_secrets: [orgs.newRepoDependabotSecret('{{ P }}_RDEP') { value: 'pass:e2e/rdep' }],
            codespaces_secrets: [orgs.newRepoCodespacesSecret('{{ P }}_RCS') { value: 'pass:e2e/rcs' }],
          }
    validate: {ok: true, errors: 0, exit_code: 0, not_contains: ["Warning:"]}
    plan:
      expect: changes
      counts: {add: 5, change: 0, delete: 0}
      contains:
        - '+ add org_dependabot_secret[name="{{ P }}_DEP"] {'
        - '+ add org_codespaces_secret[name="{{ P }}_CS"] {'
        - '+ add repository[name="{{ p }}-secrets"] {'
        - '+ add repo_dependabot_secret[name="{{ P }}_RDEP", repository={{ p }}-secrets] {'
        - '+ add repo_codespaces_secret[name="{{ P }}_RCS", repository={{ p }}-secrets] {'
