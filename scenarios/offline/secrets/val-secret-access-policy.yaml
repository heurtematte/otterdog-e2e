# Offline tier (battery, validation): the secret access policy of otterdog.json (eclipse-csi/otterdog#923).
id: O-VAL-SECRET-ACCESS-POLICY
tier: offline
title: The secret access policy of otterdog.json restricts the secrets an organization may reference
description: >-
  Since #923 (main after v1.7.1) otterdog.json may restrict the credential provider references of an organization:
  defaults.secrets.allowed_references lists patterns per provider (pass, vault, bitwarden) for every organization,
  organizations[].secrets.allowed_references adds patterns for one, defaults.secrets.mode is enforce (an error) unless
  set to warn (a warning). ValidationContext.validate_secret_reference checks the value of every organization,
  repository and environment secret and every organization and repository webhook secret that uses a provider
  (SecretAccessPolicy.check in otterdog/credentials/secret_access_policy.py): segments matched one by one, '*' inside
  a segment, '**' for any number of segments (at least one at the end), the placeholders {org_name} and {github_id}
  replaced by the values of otterdog.json (never by the jsonnet's newOrg names), a bitwarden reference matched by its
  item id, '.' and '..' segments refused, a provider without patterns refused entirely. Plain values, dummies and
  unknown providers are not checked. A malformed policy stops the loading of otterdog.json. The levels a reference
  meets (organization, repository, archived repository, environment, webhooks) go through the same check, each one is
  asserted; validation never resolves a secret, so these checks need no provider. The apply-time check before a
  secret is resolved needs a provider and stays untested here. Older SUTs ignore the policy and skip the scenario.
priority: P1
tags: [offline, secrets, webhooks, environments]
observe: true
fixed_in: 1.8.0
variables: {plan: free}
references:
  - pr: 923
    note: >-
      "feat: restrict the secrets that an organization can reference" (head 3ff66a4, squash a196494, 1.8.0) adds the
      policy: head reports each reference outside the allowed patterns as an error (a warning in warn mode) and
      refuses a malformed policy when it loads otterdog.json (exit 2, so show fails too); base ignores
      defaults.secrets and organizations[].secrets and validates every step. Steps allowed-references and
      values-without-provider must not change.
    expected_deltas:
      - {step: secrets-of-another-organization, kind: cli, key: validate}
      - {step: webhook-secrets-of-another-organization, kind: cli, key: validate}
      - {step: provider-without-patterns, kind: cli, key: validate}
      - {step: parent-segment, kind: cli, key: validate}
      - {step: trailing-double-star-needs-a-segment, kind: cli, key: validate}
      - {step: wildcards, kind: cli, key: validate}
      - {step: organization-patterns, kind: cli, key: validate}
      - {step: organization-patterns-without-defaults, kind: cli, key: validate}
      - {step: placeholders-from-otterdog-json, kind: cli, key: validate}
      - {step: bitwarden-items, kind: cli, key: validate}
      - {step: warn-mode, kind: cli, key: validate}
      - {step: invalid-mode, kind: cli, key: validate}
      - {step: unknown-provider, kind: cli, key: validate}
      - {step: unknown-placeholder, kind: cli, key: validate}
      - {step: parent-segment-in-pattern, kind: cli, key: validate}
      - {step: mode-of-an-organization, kind: cli, key: validate}
      - {step: invalid-mode, kind: cli, key: show}
      - {step: unknown-provider, kind: cli, key: show}
      - {step: unknown-placeholder, kind: cli, key: show}
      - {step: parent-segment-in-pattern, kind: cli, key: show}
      - {step: mode-of-an-organization, kind: cli, key: show}
steps:
  - name: allowed-references
    workspace: &policy
      defaults_override: {secrets: {allowed_references: {pass: ["bots/{org_name}/**"]}}}
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_ORG') { value: 'pass:bots/{{ org }}/github.com/token' }"]
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}org-allowed') { secret: 'pass:bots/{{ org }}/hooks/org' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-policy') {
            secrets: [orgs.newRepoSecret('{{ P }}_REPO') { value: 'pass:bots/{{ org }}/repo/token' }],
            webhooks: [orgs.newRepoWebhook('{{ hook_base }}repo-allowed') { secret: 'pass:bots/{{ org }}/hooks/repo' }],
            environments: [
              orgs.newEnvironment('{{ p }}-env') {
                secrets: [orgs.newEnvSecret('{{ P }}_ENV') { value: 'pass:bots/{{ org }}/env/token' }],
              },
            ],
          }
    validate: {ok: true, errors: 0, exit_code: 0, not_contains: ["not allowed to use"]}
  - name: secrets-of-another-organization
    workspace: *policy
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_ORG') { value: 'pass:bots/e2e-other/github.com/token' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-policy') {
            secrets: [orgs.newRepoSecret('{{ P }}_REPO') { value: 'pass:bots/e2e-other/repo/token' }],
            environments: [
              orgs.newEnvironment('{{ p }}-env') {
                secrets: [orgs.newEnvSecret('{{ P }}_ENV') { value: 'pass:bots/e2e-other/env/token' }],
              },
            ],
          }
        - |-
          orgs.newRepo('{{ p }}-archived') {
            archived: true,
            secrets: [orgs.newRepoSecret('{{ P }}_ARCHIVED') { value: 'pass:bots/e2e-other/archived/token' }],
          }
    validate:
      ok: false
      errors: 4
      contains:
        - >-
          Error: org_secret[name="{{ P }}_ORG"] references secret 'pass:bots/e2e-other/github.com/token' that the
          organization is not allowed to use: 'bots/e2e-other/github.com/token' does not match the allowed references
          of provider 'pass': 'bots/{{ org }}/**'.
        - >-
          Error: repo_secret[name="{{ P }}_REPO"] references secret 'pass:bots/e2e-other/repo/token' that the
          organization is not allowed to use: 'bots/e2e-other/repo/token' does not match the allowed references of
          provider 'pass': 'bots/{{ org }}/**'.
        - >-
          Error: env_secret[name="{{ P }}_ENV"] references secret 'pass:bots/e2e-other/env/token' that the
          organization is not allowed to use: 'bots/e2e-other/env/token' does not match the allowed references of
          provider 'pass': 'bots/{{ org }}/**'.
        - >-
          Error: repo_secret[name="{{ P }}_ARCHIVED"] references secret 'pass:bots/e2e-other/archived/token' that the
          organization is not allowed to use: 'bots/e2e-other/archived/token' does not match the allowed references of
          provider 'pass': 'bots/{{ org }}/**'.
  - name: webhook-secrets-of-another-organization
    workspace: *policy
    fragments:
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}org-other') { secret: 'pass:bots/e2e-other/hooks/org' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-policy') {
            webhooks: [orgs.newRepoWebhook('{{ hook_base }}repo-other') { secret: 'pass:bots/e2e-other/hooks/repo' }],
          }
    validate:
      ok: false
      errors: 2
      contains:
        - >-
          Error: org_webhook[url="{{ hook_base }}org-other"] references secret 'pass:bots/e2e-other/hooks/org' that
          the organization is not allowed to use: 'bots/e2e-other/hooks/org' does not match the allowed references of
          provider 'pass': 'bots/{{ org }}/**'.
        - >-
          Error: repo_webhook[url="{{ hook_base }}repo-other", repository={{ p }}-policy] references secret
          'pass:bots/e2e-other/hooks/repo' that the organization is not allowed to use: 'bots/e2e-other/hooks/repo'
          does not match the allowed references of provider 'pass': 'bots/{{ org }}/**'.
  - name: provider-without-patterns
    workspace: *policy
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_VAULT') { value: 'vault:{{ org }}/token' }"]
    validate:
      ok: false
      errors: 1
      contains:
        - >-
          Error: org_secret[name="{{ P }}_VAULT"] references secret 'vault:{{ org }}/token' that the organization is
          not allowed to use: no secret of provider 'vault' is allowed.
  - name: parent-segment
    workspace: *policy
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_UP') { value: 'pass:bots/{{ org }}/../e2e-other/token' }"]
    validate:
      ok: false
      errors: 1
      contains:
        - >-
          Error: org_secret[name="{{ P }}_UP"] references secret 'pass:bots/{{ org }}/../e2e-other/token' that the
          organization is not allowed to use: 'bots/{{ org }}/../e2e-other/token' is not a valid reference, it must
          consist of segments separated by '/' that only contain letters, digits, '.', '_', '@', '+' and '-', and are
          not '.' or '..'.
  - name: trailing-double-star-needs-a-segment
    workspace: *policy
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_BARE') { value: 'pass:bots/{{ org }}' }"]
    validate:
      ok: false
      errors: 1
      contains:
        - >-
          Error: org_secret[name="{{ P }}_BARE"] references secret 'pass:bots/{{ org }}' that the organization is not
          allowed to use: 'bots/{{ org }}' does not match the allowed references of provider 'pass':
          'bots/{{ org }}/**'.
  - name: wildcards
    workspace:
      defaults_override: {secrets: {allowed_references: {pass: ["bots/*-offline/**/token", "shared/*"]}}}
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_ZERO') { value: 'pass:bots/{{ org }}/token' }"
        - "orgs.newOrgSecret('{{ P }}_DEEP') { value: 'pass:bots/{{ org }}/github.com/bot/token' }"
        - "orgs.newOrgSecret('{{ P }}_SHARED') { value: 'pass:shared/sonatype' }"
        - "orgs.newOrgSecret('{{ P }}_NESTED') { value: 'pass:shared/sonatype/password' }"
    validate:
      ok: false
      errors: 1
      contains:
        - >-
          Error: org_secret[name="{{ P }}_NESTED"] references secret 'pass:shared/sonatype/password' that the
          organization is not allowed to use: 'shared/sonatype/password' does not match the allowed references of
          provider 'pass': 'bots/*-offline/**/token', 'shared/*'.
      not_contains: ["{{ P }}_ZERO\"] references", "{{ P }}_DEEP\"] references", "{{ P }}_SHARED\"] references"]
  - name: organization-patterns
    workspace:
      defaults_override: {secrets: {allowed_references: {pass: ["bots/{org_name}/**"]}}}
      org_entry: {secrets: {allowed_references: {pass: ["bots/shared/**"]}}}
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_OWN') { value: 'pass:bots/{{ org }}/token' }"
        - "orgs.newOrgSecret('{{ P }}_SHARED') { value: 'pass:bots/shared/sonatype/password' }"
        - "orgs.newOrgSecret('{{ P }}_OTHER') { value: 'pass:bots/e2e-other/token' }"
    validate:
      ok: false
      errors: 1
      contains:
        - >-
          Error: org_secret[name="{{ P }}_OTHER"] references secret 'pass:bots/e2e-other/token' that the organization
          is not allowed to use: 'bots/e2e-other/token' does not match the allowed references of provider 'pass':
          'bots/{{ org }}/**', 'bots/shared/**'.
      not_contains: ["{{ P }}_OWN\"] references", "{{ P }}_SHARED\"] references"]
  - name: organization-patterns-without-defaults
    workspace:
      org_entry: {secrets: {allowed_references: {pass: ["bots/shared/**"]}}}
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_SHARED') { value: 'pass:bots/shared/sonatype/password' }"
        - "orgs.newOrgSecret('{{ P }}_OWN') { value: 'pass:bots/{{ org }}/token' }"
    validate:
      ok: false
      errors: 1
      contains:
        - >-
          Error: org_secret[name="{{ P }}_OWN"] references secret 'pass:bots/{{ org }}/token' that the organization is
          not allowed to use: 'bots/{{ org }}/token' does not match the allowed references of provider 'pass':
          'bots/shared/**'.
  - name: placeholders-from-otterdog-json
    # the project name of otterdog.json differs from the github_id and from the name given to newOrg in the jsonnet
    workspace:
      defaults_override: {secrets: {allowed_references: {pass: ["bots/{org_name}/**"], vault: ["{github_id}/**"]}}}
      org_entry: {name: "{{ org }}-project"}
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_NAME') { value: 'pass:bots/{{ org }}-project/token' }"
        - "orgs.newOrgSecret('{{ P }}_ID') { value: 'vault:{{ org }}/token' }"
        - "orgs.newOrgSecret('{{ P }}_JSONNET') { value: 'pass:bots/{{ org }}/token' }"
    validate:
      ok: false
      errors: 1
      contains:
        - >-
          Error: org_secret[name="{{ P }}_JSONNET"] references secret 'pass:bots/{{ org }}/token' that the
          organization is not allowed to use: 'bots/{{ org }}/token' does not match the allowed references of provider
          'pass': 'bots/{{ org }}-project/**'.
      not_contains: ["{{ P }}_NAME\"] references", "{{ P }}_ID\"] references"]
  - name: bitwarden-items
    workspace:
      defaults_override: {secrets: {allowed_references: {bitwarden: ["0f1e2d3c-allowed"]}}}
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_ITEM') { value: 'bitwarden:0f1e2d3c-allowed@password' }"
        - "orgs.newOrgSecret('{{ P }}_OTHER') { value: 'bitwarden:9a8b7c6d-other@password' }"
        - "orgs.newOrgSecret('{{ P }}_NOFIELD') { value: 'bitwarden:0f1e2d3c-allowed' }"
    validate:
      ok: false
      errors: 2
      contains:
        - >-
          Error: org_secret[name="{{ P }}_OTHER"] references secret 'bitwarden:9a8b7c6d-other@password' that the
          organization is not allowed to use: '9a8b7c6d-other' does not match the allowed references of provider
          'bitwarden': '0f1e2d3c-allowed'.
        - >-
          Error: org_secret[name="{{ P }}_NOFIELD"] references secret 'bitwarden:0f1e2d3c-allowed' that the
          organization is not allowed to use: '0f1e2d3c-allowed' is not a valid bitwarden reference, expected
          '<item id>@<field>'.
      not_contains: ["{{ P }}_ITEM\"] references"]
  - name: warn-mode
    workspace:
      defaults_override: {secrets: {mode: warn, allowed_references: {pass: ["bots/{org_name}/**"]}}}
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_OTHER') { value: 'pass:bots/e2e-other/token' }"]
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      exit_code: 0
      contains:
        - >-
          Warning: org_secret[name="{{ P }}_OTHER"] references secret 'pass:bots/e2e-other/token' that the
          organization is not allowed to use: 'bots/e2e-other/token' does not match the allowed references of provider
          'pass': 'bots/{{ org }}/**'.
  - name: values-without-provider
    # plain values, dummies and unknown providers are not references: the policy leaves them to the usual checks
    workspace: *policy
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_PLAIN') { value: 'e2e-dummy-{{ run }}' }"
        - "orgs.newOrgSecret('{{ P }}_DUMMY') { value: '********' }"
        - "orgs.newOrgSecret('{{ P }}_FOO') { value: 'foo:e2e/b' }"
      webhooks: ["orgs.newOrgWebhook('{{ hook_base }}org-foo') { secret: 'foo:e2e/hook' }"]
    validate:
      ok: true
      errors: 0
      warnings_min: 2
      exit_code: 0
      contains:
        - "Warning: org_secret[name=\"{{ P }}_PLAIN\"] has a value"
        - "Warning: org_secret[name=\"{{ P }}_FOO\"] has a value"
      not_contains: ["not allowed to use"]
  - name: invalid-mode
    workspace:
      defaults_override: {secrets: {mode: block, allowed_references: {pass: ["bots/{org_name}/**"]}}}
    fragments: {}
    validate:
      ok: false
      exit_code: 2
      contains: ["invalid 'defaults.secrets.mode': expected one of 'warn', 'enforce', got 'block'"]
  - name: unknown-provider
    workspace:
      defaults_override: {secrets: {allowed_references: {env: ["{org_name}/**"]}}}
    fragments: {}
    validate:
      ok: false
      exit_code: 2
      contains:
        - >-
          invalid 'defaults.secrets.allowed_references': unknown provider 'env', expected one of 'bitwarden', 'pass',
          'vault'
  - name: unknown-placeholder
    workspace:
      defaults_override: {secrets: {allowed_references: {pass: ["bots/{project}/**"]}}}
    fragments: {}
    validate:
      ok: false
      exit_code: 2
      contains:
        - >-
          invalid 'defaults.secrets.allowed_references.pass': invalid pattern 'bots/{project}/**': unknown placeholder
          '{project}', supported placeholders are '{org_name}' and '{github_id}'
  - name: parent-segment-in-pattern
    workspace:
      defaults_override: {secrets: {allowed_references: {pass: ["bots/{org_name}/../**"]}}}
    fragments: {}
    validate:
      ok: false
      exit_code: 2
      contains:
        - >-
          invalid 'defaults.secrets.allowed_references.pass': invalid pattern 'bots/{org_name}/../**': empty, '.' and
          '..' segments are not allowed
  - name: mode-of-an-organization
    # the mode is global: an organization only adds patterns; the error is printed as rich markup, which drops the
    # '[<name>]' of the key (KB-050)
    known_bug: KB-050
    workspace:
      org_entry: {secrets: {mode: warn, allowed_references: {pass: ["bots/shared/**"]}}}
    fragments: {}
    validate:
      ok: false
      exit_code: 2
      contains: ["invalid 'organizations[{{ org }}].secrets': unexpected keys ['mode']"]
