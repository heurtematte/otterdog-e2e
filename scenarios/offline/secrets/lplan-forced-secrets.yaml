# Offline tier (battery, plan semantics): secret values in local-plan and the forced-update flags.
id: O-LPLAN-FORCED-SECRETS
tier: offline
title: Secret values, dummy secrets and --update-secrets / --update-filter / --only-secrets in local-plan
description: >-
  local-plan never resolves secrets and never prints a dummy '********' itself; two dummies are no change and a
  changed reference is shown as 'old -> new'. New dummy secrets: plan and apply skip such secrets entirely, while
  local-plan adds them as '<DUMMY>' (KB-056): the 'dummy-values' step keeps only what holds either way (the raw dummy
  is never printed, the repository and environment are added), the 'dummy-skipped' step asserts plan's behaviour and
  declares KB-056, so a fix shows as a KnownBugNotReproducedWarning, not as a regression (BAT-15). --update-secrets forces a '!' update of every organization, repository and environment secret
  (every key 'v -> v', all counted), --update-filter restricts the forced updates to the matching secret names, and
  --only-secrets drops every other change from the plan (with or without forced updates). Secret values are dummies
  or 'pass:' references only.
priority: P1
tags: [offline, secrets, environments, variables]
observe: true
variables: {plan: free}
steps:
  - name: dummy-values
    base_fragments: {}
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_ORG_DUMMY') { value: '********' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-vault') {
            secrets: [orgs.newRepoSecret('{{ P }}_REPO_DUMMY') { value: '********' }],
            environments: [orgs.newEnvironment('{{ p }}-env') { secrets: [orgs.newEnvSecret('{{ P }}_ENV_DUMMY') { value: '****' }] }],
          }
    validate: {ok: true, errors: 0}
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-vault"] {'
        - '+ add environment[name="{{ p }}-env", repository={{ p }}-vault] {'
      not_contains: ['"********"', '"****"']
  - name: dummy-skipped
    known_bug: {id: KB-056, phases: [local-plan]}
    base_fragments: {}
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_ORG_DUMMY') { value: '********' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-vault') {
            secrets: [orgs.newRepoSecret('{{ P }}_REPO_DUMMY') { value: '********' }],
            environments: [orgs.newEnvironment('{{ p }}-env') { secrets: [orgs.newEnvSecret('{{ P }}_ENV_DUMMY') { value: '****' }] }],
          }
    plan:
      expect: changes
      counts: {add: 2, change: 0, delete: 0}
      not_contains:
        - 'add org_secret[name="{{ P }}_ORG_DUMMY"]'
        - 'add repo_secret[name="{{ P }}_REPO_DUMMY"'
        - 'add env_secret[name="{{ P }}_ENV_DUMMY"'
        - '"<DUMMY>"'
  - name: dummy-unchanged
    base_fragments: &dummies
      secrets: ["orgs.newOrgSecret('{{ P }}_ORG_DUMMY') { value: '********' }"]
      repositories: ["orgs.newRepo('{{ p }}-vault') { secrets: [orgs.newRepoSecret('{{ P }}_REPO_DUMMY') { value: '********' }] }"]
    fragments: *dummies
    plan:
      expect: noop
      counts: {add: 0, change: 0, delete: 0}
  - name: reference-changed
    base_fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_REF') { value: 'pass:e2e/a' }"]
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_REF') { value: 'pass:e2e/b' }"]
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 0}
      contains: ['~ org_secret[name="{{ P }}_REF"] {', '~ value = "pass:e2e/a" -> "pass:e2e/b"']
  - name: dummy-replaced-by-reference
    base_fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_REF') { value: '********' }"]
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_REF') { value: 'pass:e2e/b' }"]
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 0}
      contains: ['~ value = "<DUMMY>" -> "pass:e2e/b"']
  - name: update-secrets
    base_fragments: &vault
      secrets: ["orgs.newOrgSecret('{{ P }}_ORG') { value: 'pass:e2e/org' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-vault') {
            secrets: [
              orgs.newRepoSecret('{{ P }}_A1') { value: 'pass:e2e/a1' },
              orgs.newRepoSecret('{{ P }}_B1') { value: 'pass:e2e/b1' },
            ],
            environments: [orgs.newEnvironment('{{ p }}-env') { secrets: [orgs.newEnvSecret('{{ P }}_E1') { value: 'pass:e2e/e1' }] }],
          }
    fragments: *vault
    plan:
      expect: changes
      update_secrets: true
      counts: {add: 0, change: 10, delete: 0}
      contains:
        - '! org_secret[name="{{ P }}_ORG"] {'
        - '= "pass:e2e/org" -> "pass:e2e/org"'
        - '! repo_secret[name="{{ P }}_A1", repository={{ p }}-vault] {'
        - '! value = "pass:e2e/a1" -> "pass:e2e/a1"'
        - '! repo_secret[name="{{ P }}_B1", repository={{ p }}-vault] {'
        - '! env_secret[name="{{ P }}_E1", environment={{ p }}-env] {'
      not_contains: ['~ org_secret[', '~ repo_secret[', '~ env_secret[', '+ add ', '- remove ']
  - name: update-filter
    base_fragments: *vault
    fragments: *vault
    plan:
      expect: changes
      update_secrets: true
      update_filter: "{{ P }}_A*"
      counts: {add: 0, change: 2, delete: 0}
      contains: ['! repo_secret[name="{{ P }}_A1", repository={{ p }}-vault] {']
      not_contains: ['! repo_secret[name="{{ P }}_B1"', '! org_secret[', '! env_secret[']
  - name: only-secrets-forced
    base_fragments: *vault
    fragments:
      secrets: ["orgs.newOrgSecret('{{ P }}_ORG') { value: 'pass:e2e/org' }"]
      variables: ["orgs.newOrgVariable('{{ P }}_VAR') { value: 'x' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-vault') {
            description: 'changed',
            secrets: [
              orgs.newRepoSecret('{{ P }}_A1') { value: 'pass:e2e/a1' },
              orgs.newRepoSecret('{{ P }}_B1') { value: 'pass:e2e/b1' },
            ],
            environments: [orgs.newEnvironment('{{ p }}-env') { secrets: [orgs.newEnvSecret('{{ P }}_E1') { value: 'pass:e2e/e1' }] }],
          }
    plan:
      expect: changes
      only_secrets: true
      update_secrets: true
      counts: {add: 0, change: 10, delete: 0}
      contains: ['! org_secret[name="{{ P }}_ORG"] {', '! env_secret[name="{{ P }}_E1", environment={{ p }}-env] {']
      not_contains: ['repository[', 'org_variable[', 'description']
  - name: only-secrets-changes
    base_fragments: *vault
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_ORG') { value: 'pass:e2e/org-new' }"
        - "orgs.newOrgSecret('{{ P }}_NEW') { value: 'pass:e2e/new' }"
      variables: ["orgs.newOrgVariable('{{ P }}_VAR') { value: 'x' }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-vault') {
            description: 'changed',
            secrets: [orgs.newRepoSecret('{{ P }}_A1') { value: 'pass:e2e/a1' }],
            environments: [orgs.newEnvironment('{{ p }}-env') { secrets: [orgs.newEnvSecret('{{ P }}_E1') { value: 'pass:e2e/e1' }] }],
          }
    plan:
      expect: changes
      only_secrets: true
      counts: {add: 1, change: 1, delete: 1}
      contains:
        - '~ value = "pass:e2e/org" -> "pass:e2e/org-new"'
        - '+ add org_secret[name="{{ P }}_NEW"] {'
        - '- remove repo_secret[name="{{ P }}_B1", repository={{ p }}-vault] {'
      not_contains: ['repository[name=', 'org_variable[', 'description', '! org_secret[', '! repo_secret[']
