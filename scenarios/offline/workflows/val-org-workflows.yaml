# Offline tier (battery, validation): the organization Actions settings (settings.workflows).
id: O-VAL-ORG-WORKFLOWS
tier: offline
title: Organization Actions settings are validated (enums and ignored settings)
description: >-
  settings.workflows accepts allowed_actions all | local_only | selected, default_workflow_permissions read | write,
  the three fork_pr_approval_policy values and enabled_repositories all | none | selected; action patterns outside
  'selected' and selected repositories outside 'selected' are warnings (ignored settings). The fork policy message
  prints a Python set whose order changes between runs (KB-038), so only its stable parts are asserted. An invalid
  allowed_actions crashes validation as soon as a repository exists (KB-029). Since #878 (v1.7.0) the schema refuses
  every invalid enum value at load ("'some' is not one of [...]", exit 1), which makes both defects unreachable: the
  outcome of the enum steps per SUT is asserted by ENUM_SCHEMA_STEPS of tests/offline/test_scenarios.py.
priority: P1
tags: [offline, workflows, org-settings]
observe: true
variables: {plan: free}
references:
  - pr: 878
    note: >-
      "Configuration guides playground": the JSON schemas enumerate the allowed values, so an invalid value is a
      load error ("failed to load configuration: invalid value at '<path>': '<value>' is not one of [...]", exit 1)
      before the model's own check; show fails to load the configuration too. ENUM_SCHEMA_STEPS of
      tests/offline/test_scenarios.py asserts each side (model errors before, the load error since).
    expected_deltas:
      - {step: allowed-actions, kind: cli, key: validate}
      - {step: allowed-actions, kind: cli, key: show}
      - {step: allowed-actions-with-repository, kind: cli, key: validate}
      - {step: allowed-actions-with-repository, kind: cli, key: show}
      - {step: workflow-permissions, kind: cli, key: validate}
      - {step: workflow-permissions, kind: cli, key: show}
      - {step: fork-pr-approval-policy, kind: cli, key: validate}
      - {step: fork-pr-approval-policy, kind: cli, key: show}
      - {step: enabled-repositories, kind: cli, key: validate}
      - {step: enabled-repositories, kind: cli, key: show}
steps:
  - name: allowed-actions
    fragments:
      settings: ["workflows+: { allowed_actions: 'some' }"]
    validate: {ok: false}  # outcome per SUT (#878): ENUM_SCHEMA_STEPS of tests/offline/test_scenarios.py
  - name: action-patterns-ignored
    fragments:
      settings: ["workflows+: { allowed_actions: 'all', allow_action_patterns: ['actions/*@*'] }"]
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      exit_code: 0
      contains:
        - >-
          Warning: settings has 'workflows.allowed_actions' set to 'all', but 'allow_action_patterns' is set to
          '['actions/*@*']', setting will be ignored.
  - name: workflow-permissions
    fragments:
      settings: ["workflows+: { default_workflow_permissions: 'admin' }"]
    validate: {ok: false}  # outcome per SUT (#878): ENUM_SCHEMA_STEPS of tests/offline/test_scenarios.py
  - name: fork-pr-approval-policy
    fragments:
      settings: ["workflows+: { fork_pr_approval_policy: 'nobody' }"]
    validate: {ok: false}  # outcome per SUT (#878): ENUM_SCHEMA_STEPS of tests/offline/test_scenarios.py
  - name: enabled-repositories
    fragments:
      settings: ["workflows+: { enabled_repositories: 'some' }"]
    validate: {ok: false}  # outcome per SUT (#878): ENUM_SCHEMA_STEPS of tests/offline/test_scenarios.py
  - name: selected-repositories-ignored
    fragments:
      settings: ["workflows+: { enabled_repositories: 'all', selected_repositories: ['{{ p }}-wf'] }"]
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      exit_code: 0
      contains:
        - >-
          Warning: settings has 'enabled_repositories' set to 'all', but 'selected_repositories' is set to
          '['{{ p }}-wf']', setting will be ignored.
  - name: valid-selected
    fragments:
      settings:
        - |-
          workflows+: {
            enabled_repositories: 'selected',
            selected_repositories: ['{{ p }}-wf'],
            allowed_actions: 'selected',
            allow_action_patterns: ['actions/*@*'],
            default_workflow_permissions: 'write',
            fork_pr_approval_policy: 'all_external_contributors',
          }
      repositories:
        - "orgs.newRepo('{{ p }}-wf')"
    validate:
      ok: true
      errors: 0
      exit_code: 0
      contains: ["Validation succeeded"]
      not_contains: ["Error:", "Warning:"]
  - name: allowed-actions-with-repository
    fragments:
      settings: ["workflows+: { allowed_actions: 'some' }"]
      repositories:
        - "orgs.newRepo('{{ p }}-wf')"
    validate: {ok: false}  # outcome per SUT (#878): ENUM_SCHEMA_STEPS of tests/offline/test_scenarios.py
