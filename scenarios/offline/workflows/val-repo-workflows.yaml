# Offline tier (battery, validation): repository Actions settings (workflows) against the organization settings.
id: O-VAL-REPO-WORKFLOWS
tier: offline
title: Repository Actions settings are validated against the organization Actions settings
description: >-
  RepositoryWorkflowSettings.validate refuses code scanning default setup while Actions are disabled for the
  repository (by the repository or by the organization), and with -v informs about repository settings the
  organization overrides (Actions disabled for all or only for selected repositories, more restricted allowed
  actions, read-only workflow permissions, no pull request approvals). The enums of the shared workflow settings
  apply with the repository header (the fork policy set order varies: KB-038). An invalid repository allowed_actions
  crashes validation with a KeyError (KB-029). Since #878 (v1.7.0) the schema refuses these values at load, before
  the model: ENUM_SCHEMA_STEPS of tests/offline/test_scenarios.py asserts the outcome of the enum steps per SUT. Since
  #946 (1.9.0) a repository may require actions pinned to a full-length commit SHA (sha_pinning_required) whatever
  the organization says, while a repository that does not require it under an organization that does is informed
  that its setting is ignored; older SUTs refuse the key at load, so these steps record only (SUT_EXPECTATIONS).
priority: P2
tags: [offline, workflows, repo]
observe: true
variables: {plan: free}
references:
  - pr: 878
    note: >-
      "Configuration guides playground": the JSON schemas enumerate the allowed values, so an invalid value is a
      load error ("failed to load configuration: invalid value at '<path>': '<value>' is not one of [...]", exit 1)
      before the model's own check; show fails to load the configuration too. ENUM_SCHEMA_STEPS of
      tests/offline/test_scenarios.py asserts each side (model errors before, the load error since).
    expected_deltas:
      - {step: workflow-enums, kind: cli, key: validate}
      - {step: workflow-enums, kind: cli, key: show}
      - {step: unknown-allowed-actions, kind: cli, key: validate}
      - {step: unknown-allowed-actions, kind: cli, key: show}
  - pr: 946
    note: >-
      "feat: support sha_pinning_required in the workflow settings" (head ddc6fdd, squash 44f2b7b after v1.8.0, 1.9.0): the
      repository workflow settings accept sha_pinning_required; RepositoryWorkflowSettings.validate informs that a
      repository not requiring it is ignored while the organization requires it, and coerce_from_org_settings drops the
      repository value then (PUT /repos/{owner}/{repo}/actions/permissions). Base refuses the key at load (exit 1).
      Template base, as on O-VAL-ORG-WORKFLOWS (the template default false would add a line to every show). The
      other steps must not change.
    template: base
    expected_deltas:
      - step: sha-pinning-ignored-while-organization-requires
        kind: cli
        key: validate
        note: head validates with one validation info (exit 0); base load error on the unknown key (exit 1)
      - step: sha-pinning-ignored-while-organization-requires
        kind: cli
        key: local-plan
        note: >-
          head plans the repository and the organization setting and prints the info "has 'sha_pinning_required'
          disabled, while on organization level it is required, setting will be ignored." (-v); base load error
      - step: sha-pinning-ignored-while-organization-requires
        kind: cli
        key: show
        note: head shows the configuration; base load error
      - step: sha-pinning-required-by-repository
        kind: cli
        key: validate
        note: head validates it without notice (exit 0); base load error on the unknown key (exit 1)
      - step: sha-pinning-required-by-repository
        kind: cli
        key: show
        note: head shows sha_pinning_required = true in the repository workflows; base load error
steps:
  - name: code-scanning-without-actions
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-wf') { code_scanning_default_setup_enabled: true, workflows+: { enabled: false } }"
    validate:
      ok: false
      errors: 1
      exit_code: 1
      contains:
        - >-
          Error: repository[name="{{ p }}-wf"] has 'code_scanning_default_setup_enabled' of value 'True' while
          GitHub Actions are disabled.
  - name: code-scanning-with-actions-disabled-by-organization
    fragments:
      settings: ["workflows+: { enabled_repositories: 'none' }"]
      repositories:
        - "orgs.newRepo('{{ p }}-wf') { code_scanning_default_setup_enabled: true }"
    validate:
      verbose: true
      ok: false
      errors: 1
      infos: 1
      exit_code: 1
      contains:
        - >-
          Info: repository[name="{{ p }}-wf"] has enabled workflows, while on organization level it is disabled for
          all repositories, setting will be ignored.
        - >-
          Error: repository[name="{{ p }}-wf"] has 'code_scanning_default_setup_enabled' of value 'True' while
          GitHub Actions are disabled.
  - name: actions-only-for-selected-repositories
    fragments:
      settings: ["workflows+: { enabled_repositories: 'selected', selected_repositories: ['{{ p }}-other'] }"]
      repositories: ["orgs.newRepo('{{ p }}-wf')", "orgs.newRepo('{{ p }}-other')"]
    validate:
      verbose: true
      ok: true
      errors: 0
      infos: 1
      exit_code: 0
      contains:
        - >-
          Info: repository[name="{{ p }}-wf"] has enabled workflows, while on organization level it is only enabled
          for selected repositories, setting will be ignored.
      not_contains: ["repository[name=\"{{ p }}-other\"] has enabled workflows"]
  - name: organization-restrictions
    fragments:
      settings: ["workflows+: { allowed_actions: 'local_only', actions_can_approve_pull_request_reviews: false }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-wf') {
            workflows+: {
              allowed_actions: 'all',
              default_workflow_permissions: 'write',
              actions_can_approve_pull_request_reviews: true,
            },
          }
    validate:
      verbose: true
      ok: true
      errors: 0
      infos: 3
      exit_code: 0
      contains:
        - >-
          Info: repository[name="{{ p }}-wf"] has set 'allowed_actions' to 'all', while on organization level it is
          more restricted to 'local_only', setting will be ignored.
        - >-
          Info: repository[name="{{ p }}-wf"] has 'default_workflow_permissions' of value 'write', while on
          organization level it is restricted to 'read', setting will be ignored.
        - >-
          Info: repository[name="{{ p }}-wf"] has 'actions_can_approve_pull_request_reviews' enabled, while on
          organization level it is disabled, setting will be ignored.
  - name: disabled-repository
    fragments:
      settings: ["workflows+: { enabled_repositories: 'none' }"]
      repositories: ["orgs.newRepo('{{ p }}-wf') { workflows+: { enabled: false } }"]
    validate:
      verbose: true
      ok: true
      errors: 0
      infos: 0
      exit_code: 0
      contains: ["Validation succeeded"]
      not_contains: ["Info:", "Error:", "Warning:"]
  - name: workflow-enums
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-wf') { workflows+: { default_workflow_permissions: 'admin', fork_pr_approval_policy: 'nobody' } }"
    validate: {ok: false}  # outcome per SUT (#878): ENUM_SCHEMA_STEPS of tests/offline/test_scenarios.py
  - name: action-patterns-ignored
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-wf') { workflows+: { allowed_actions: 'all', allow_action_patterns: ['actions/*@*'] } }"
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      exit_code: 0
      contains:
        - >-
          Warning: repository[name="{{ p }}-wf"] has 'workflows.allowed_actions' set to 'all', but
          'allow_action_patterns' is set to '['actions/*@*']', setting will be ignored.
  - name: unknown-allowed-actions
    fragments:
      repositories: ["orgs.newRepo('{{ p }}-wf') { workflows+: { allowed_actions: 'some' } }"]
    validate: {ok: false}  # outcome per SUT (#878): ENUM_SCHEMA_STEPS of tests/offline/test_scenarios.py
  - name: sha-pinning-ignored-while-organization-requires
    # outcome per SUT (#946): SUT_EXPECTATIONS of tests/offline/test_scenarios.py (the info of local-plan -v)
    commands: {show: {exit_code: null}}  # before #946, show cannot load the key either
    base_fragments:
      settings: ["workflows+: { sha_pinning_required: false }"]
    fragments:
      settings: ["workflows+: { sha_pinning_required: true }"]
      repositories: ["orgs.newRepo('{{ p }}-wf') { workflows+: { sha_pinning_required: false } }"]
    plan: {expect: any, verbose: true}
  - name: sha-pinning-required-by-repository
    # outcome per SUT (#946): SUT_EXPECTATIONS of tests/offline/test_scenarios.py
    commands: {show: {exit_code: null}}  # before #946, show cannot load the key either
    fragments:
      settings: ["workflows+: { sha_pinning_required: false }"]
      repositories: ["orgs.newRepo('{{ p }}-wf') { workflows+: { sha_pinning_required: true } }"]
