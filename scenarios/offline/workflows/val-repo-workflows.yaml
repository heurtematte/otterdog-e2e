# Offline tier (battery, validation): repository Actions settings (workflows) against the organization settings.
id: O-VAL-REPO-WORKFLOWS
tier: offline
title: Repository Actions settings are validated against the organization Actions settings
description: >-
  RepositoryWorkflowSettings.validate refuses code scanning default setup while Actions are disabled for the
  repository (by the repository or by the organization), and with -v informs about repository settings the
  organization overrides (Actions disabled for all or only for selected repositories, more restricted allowed
  actions, read-only workflow permissions, no pull request approvals). The enums of the shared workflow settings
  apply with the repository header (the fork policy set order varies: KB-038). An invalid repository allowed_actions
  crashes validation with a KeyError (KB-029): that step expects the documented error.
priority: P2
tags: [offline, workflows, repo]
observe: true
variables: {plan: free}
steps:
  - name: code-scanning-without-actions
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-wf') { code_scanning_default_setup_enabled: true, workflows+: { enabled: false } }"
    validate:
      ok: false
      errors: 1
      exit_code: 1
      contains:
        - >-
          Error: repository[name="{{ p }}-wf"] has 'code_scanning_default_setup_enabled' of value 'True' while
          GitHub Actions are disabled.
  - name: code-scanning-with-actions-disabled-by-organization
    fragments:
      settings: ["workflows+: { enabled_repositories: 'none' }"]
      repositories:
        - "orgs.newRepo('{{ p }}-wf') { code_scanning_default_setup_enabled: true }"
    validate:
      verbose: true
      ok: false
      errors: 1
      infos: 1
      exit_code: 1
      contains:
        - >-
          Info: repository[name="{{ p }}-wf"] has enabled workflows, while on organization level it is disabled for
          all repositories, setting will be ignored.
        - >-
          Error: repository[name="{{ p }}-wf"] has 'code_scanning_default_setup_enabled' of value 'True' while
          GitHub Actions are disabled.
  - name: actions-only-for-selected-repositories
    fragments:
      settings: ["workflows+: { enabled_repositories: 'selected', selected_repositories: ['{{ p }}-other'] }"]
      repositories: ["orgs.newRepo('{{ p }}-wf')", "orgs.newRepo('{{ p }}-other')"]
    validate:
      verbose: true
      ok: true
      errors: 0
      infos: 1
      exit_code: 0
      contains:
        - >-
          Info: repository[name="{{ p }}-wf"] has enabled workflows, while on organization level it is only enabled
          for selected repositories, setting will be ignored.
      not_contains: ["repository[name=\"{{ p }}-other\"] has enabled workflows"]
  - name: organization-restrictions
    fragments:
      settings: ["workflows+: { allowed_actions: 'local_only', actions_can_approve_pull_request_reviews: false }"]
      repositories:
        - |-
          orgs.newRepo('{{ p }}-wf') {
            workflows+: {
              allowed_actions: 'all',
              default_workflow_permissions: 'write',
              actions_can_approve_pull_request_reviews: true,
            },
          }
    validate:
      verbose: true
      ok: true
      errors: 0
      infos: 3
      exit_code: 0
      contains:
        - >-
          Info: repository[name="{{ p }}-wf"] has set 'allowed_actions' to 'all', while on organization level it is
          more restricted to 'local_only', setting will be ignored.
        - >-
          Info: repository[name="{{ p }}-wf"] has 'default_workflow_permissions' of value 'write', while on
          organization level it is restricted to 'read', setting will be ignored.
        - >-
          Info: repository[name="{{ p }}-wf"] has 'actions_can_approve_pull_request_reviews' enabled, while on
          organization level it is disabled, setting will be ignored.
  - name: disabled-repository
    fragments:
      settings: ["workflows+: { enabled_repositories: 'none' }"]
      repositories: ["orgs.newRepo('{{ p }}-wf') { workflows+: { enabled: false } }"]
    validate:
      verbose: true
      ok: true
      errors: 0
      infos: 0
      exit_code: 0
      contains: ["Validation succeeded"]
      not_contains: ["Info:", "Error:", "Warning:"]
  - name: workflow-enums
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-wf') { workflows+: { default_workflow_permissions: 'admin', fork_pr_approval_policy: 'nobody' } }"
    validate:
      ok: false
      errors: 2
      contains:
        - >-
          Error: repository[name="{{ p }}-wf"] has 'workflows.default_workflow_permissions' of value 'admin', while
          only values ('read' | 'write') are allowed.
        - "Error: repository[name=\"{{ p }}-wf\"] has 'workflows.fork_pr_approval_policy' of value 'nobody', while only values {"
  - name: action-patterns-ignored
    fragments:
      repositories:
        - "orgs.newRepo('{{ p }}-wf') { workflows+: { allowed_actions: 'all', allow_action_patterns: ['actions/*@*'] } }"
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      exit_code: 0
      contains:
        - >-
          Warning: repository[name="{{ p }}-wf"] has 'workflows.allowed_actions' set to 'all', but
          'allow_action_patterns' is set to '['actions/*@*']', setting will be ignored.
  - name: unknown-allowed-actions
    known_bug: KB-029
    fragments:
      repositories: ["orgs.newRepo('{{ p }}-wf') { workflows+: { allowed_actions: 'some' } }"]
    validate:
      ok: false
      errors: 1
      exit_code: 1
      contains:
        - >-
          Error: repository[name="{{ p }}-wf"] has 'workflows.allowed_actions' of value 'some', while only values
          ('all' | 'local_only' | 'selected') are allowed.
