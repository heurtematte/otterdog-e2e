# PR manifest (SPEC 14): eclipse-csi/otterdog#792, branch fix/stale-pr-status-overwrite (OPEN at the time of writing).
#
# Head d0d3b0832d8e21a9da86e0ef967859d2634af894 = 4 commits on top of main 9bdeb75, touching only
# otterdog/webapp/db/service.py (update_or_create_pull_request) and tests/webapp/db/test_pull_request_service.py:
#   2c5f977 fix: do not revert pull request status with an outdated snapshot
#   e3285b6 fix: make the pull request status update atomic
#   f0bf0c6 test: make pull request creation actually race in the test
#   d0d3b08 fix: do not go back in the pull request lifecycle within the same second
# Bug on the base: a task scheduled with a webhook snapshot stores the snapshot's lifecycle fields when it finishes,
# so a late snapshot (e.g. the backed-off sync check, or any stale 'open' event) turns a merged PR back to 'open'
# (incident osgi/.eclipsefdn#25).
#
# `base` is left out: the differential base is the merge base of the PR head with main (9bdeb75), which is what
# `otterdog-e2e pr 792 --sha d0d3b0832d8e21a9da86e0ef967859d2634af894` uses (--e2e-base-sut auto). The head is an
# untrusted pr: SUT: it runs as a docker image, and the webapp tier needs a config_reader identity.
pr: 792
title: "fix: do not revert pull request status with an outdated snapshot"
template: own
tags: [webapp]
scenarios: [W-STALE-STATUS-792]
expected_deltas:
  - scenario: W-STALE-STATUS-792
    note: >-
      after a merge, a stale converted_to_draft snapshot injected with a valid signature (204) leaves the PR merged on
      head (it stays in /api/pullrequests/merged, merged_at/closed_at kept); on base it reappears in
      /api/pullrequests/open with status open and merged_at null
notes: >-
  The PR changes the webapp's database layer only: the CLI is identical, so every offline scenario must be unchanged
  between base and head (any offline delta is unexpected). No bot comment or commit status may be created by the
  injected stale event on either side; only the stored pull request state differs.
