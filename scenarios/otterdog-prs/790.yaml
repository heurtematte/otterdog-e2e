# PR manifest (SPEC 14): eclipse-csi/otterdog#790 "fix: validate required status checks of rulesets".
#
# Merged by squash as 9bdeb75f3e82a6cbd107d6bc3c9ec90392475c08; the PR head was 0cee9e3. The differential compares the
# squash commit with its first parent b5f7bb1 (#791), so the only difference between both sides is #790 itself
# (otterdog/models/ruleset.py +3 lines, tests/models/test_ruleset.py). The example template is identical on both
# sides, so `template: own` and `template: head` give the same observations.
#
# Reproduce the differential proof of concept (no GitHub access, no target needed; `base` below is the default base):
#   otterdog-e2e run --sut sha:9bdeb75 --suite offline,differential --pr-manifest scenarios/otterdog-prs/790.yaml
#   (or: pytest tests/offline tests/differential --e2e-sut=sha:9bdeb75 --e2e-base-sut=sha:b5f7bb1 \
#          --e2e-pr-manifest=scenarios/otterdog-prs/790.yaml)
# and read <artifacts>/<run>/differential.md: the two expected deltas below, plus ONE unexpected delta on
# O-VAL-790-ORG (see notes): every other observation is unchanged.
# Through the PR flow: otterdog-e2e pr 790 --sha 0cee9e302282fefa092b4e0767248a997a9272ea (untrusted pr: SUT, docker
# image); `base` below overrides the merge base of the PR head with main (a77ad1c, #784), which predates #791 and
# would add #791's own changes to the comparison.
pr: 790
title: "fix: validate required status checks of rulesets"
base: sha:b5f7bb1c79ad29cdcde8506f5fa7ec4c070ffda8
template: own
tags: [rulesets, offline]
scenarios: [O-VAL-790, O-VAL-790-ORG]
expected_deltas:
  - scenario: O-VAL-790
    step: no-strict
    kind: cli
    key: validate
    note: >-
      head reports "has not set required parameter 'required_status_checks.strict'" as a validation error (exit 1);
      base validated the ruleset and only failed at apply time ("Error for key strict_required_status_checks_policy")
  - scenario: O-VAL-790
    step: no-strict
    kind: cli
    key: local-plan
    note: >-
      head aborts local-plan on the validation error (exit 1, no Plan: line); base planned the repository and its
      ruleset (Plan: 2 to add)
notes: >-
  The fix must not reject complete status checks: step with-strict of O-VAL-790 (strict set) and every other offline
  scenario are expected to be unchanged. O-VAL-790-ORG (an ORGANIZATION ruleset without strict, plan enterprise) is
  deliberately not an expected delta: base validates it, head crashes with "'GitHubOrganization' object has no
  attribute 'get_model_header'" (exit 2) instead of reporting the missing parameter, a defect introduced by #790
  that the report must keep flagging as unexpected until it is fixed (live counterpart: E-ORG-RULESET).
