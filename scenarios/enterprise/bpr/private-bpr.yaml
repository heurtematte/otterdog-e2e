# E-PRIVATE-BPR (SPEC 19, enterprise): branch protection on a private repository (positive counterpart).
id: enterprise.private-bpr
title: Branch protection rule on a private repository (Enterprise)
description: |
  The positive counterpart of the Free discovery scenario cli.neg.private-bpr: on Enterprise Cloud (and Team) a
  branch protection rule on a private repository must be created, read back through GraphQL and converge, then be
  updated. Private repos of the example template need allow_forking false (members_can_fork_private_repositories is
  disabled by the template) and has_wiki false.
  The repository is created PUBLIC in a first step and made private by the next one: otterdog before 1.7.0.dev14
  cannot create a private repository on an organization without Code Security (the code scanning default setup
  PATCH of new repositories fails, #791; regression.private-repo-template-defaults covers that path).
priority: P0
min_plan: enterprise
requires: [private_repo_branch_protection]
tags: [bpr, repo, enterprise, private]
steps:
  - name: public
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-ent-bpr') {
            description: "otterdog e2e: private branch protection",
            has_wiki: false,
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-ent-bpr"]'
      counts: {add: 1, delete: 0}
    state:
      - kind: repo
        name: "{{ p }}-ent-bpr"
        match: {private: false}

  - name: create
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-ent-bpr') {
            description: "otterdog e2e: private branch protection",
            private: true,
            allow_forking: false,
            has_wiki: false,
            branch_protection_rules: [
              orgs.newBranchProtectionRule('main') {
                required_approving_review_count: 1,
                requires_linear_history: true,
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-ent-bpr"]'
        - '+ add branch_protection_rule[pattern="main", repository={{ p }}-ent-bpr]'
      not_contains:
        - '+ add repository[name="{{ p }}-ent-bpr"]'
      counts: {add: 1, delete: 0}
    state:
      - kind: repo
        name: "{{ p }}-ent-bpr"
        match: {private: true}
      - kind: bpr
        repo: "{{ p }}-ent-bpr"
        pattern: main
        match: {requiresApprovingReviews: true, requiredApprovingReviewCount: 1, requiresLinearHistory: true}

  - name: update
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-ent-bpr') {
            description: "otterdog e2e: private branch protection",
            private: true,
            allow_forking: false,
            has_wiki: false,
            branch_protection_rules: [
              orgs.newBranchProtectionRule('main') {
                required_approving_review_count: 2,
                requires_linear_history: true,
                requires_code_owner_reviews: true,
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '~ branch_protection_rule[pattern="main", repository={{ p }}-ent-bpr]'
      counts: {add: 0, delete: 0}
    state:
      - kind: bpr
        repo: "{{ p }}-ent-bpr"
        pattern: main
        match: {requiredApprovingReviewCount: 2, requiresCodeOwnerReviews: true}
