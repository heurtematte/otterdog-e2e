# E-ORG-ROLE (SPEC 19, enterprise): custom organization role lifecycle.
id: enterprise.org-role
title: Custom organization role
description: |
  A custom organization role (run-prefixed name) inheriting the 'read' base role with additional organization
  permissions (names from GitHub's documented example of POST /orgs/{org}/organization-roles and
  GET /orgs/{org}/organization-fine-grained-permissions; otterdog does not validate them: role.py "TODO: add
  validation for allowed permissions"). otterdog validates org roles against the CONFIGURED plan (enterprise only,
  github_organization.py:198-208); GitHub offers custom organization roles on Enterprise Cloud. The oracle reads the
  role back with GET /orgs/{org}/organization-roles (check kind org_role), then the scenario asserts convergence. The
  update step changes the description and adds a permission; cleanup (guarded apply -d) removes the role (an
  org-level object carrying this run's id).
priority: P0
min_plan: enterprise
requires: [custom_org_roles]
tags: [org-roles, enterprise]
steps:
  - name: create
    fragments:
      roles:
        - |
          orgs.newOrgRole('{{ p }}-role') {
            description: "otterdog e2e: custom organization role",
            base_role: "read",
            permissions: ["read_organization_custom_org_role"],
          }
    plan:
      expect: changes
      contains:
        - '+ add org_role[name="{{ p }}-role"]'
      counts: {add: 1, delete: 0}
    state:
      - kind: org_role
        name: "{{ p }}-role"
        match:
          description: "otterdog e2e: custom organization role"
          base_role: read
          permissions: {$unordered: [read_organization_custom_org_role]}

  - name: update
    fragments:
      roles:
        - |
          orgs.newOrgRole('{{ p }}-role') {
            description: "otterdog e2e: custom organization role (updated)",
            base_role: "read",
            permissions: ["read_organization_custom_org_role", "read_organization_custom_repo_role"],
          }
    plan:
      expect: changes
      contains:
        - '~ org_role[name="{{ p }}-role"]'
      counts: {add: 0, delete: 0}
    state:
      - kind: org_role
        name: "{{ p }}-role"
        match:
          description: "otterdog e2e: custom organization role (updated)"
          permissions: {$unordered: [read_organization_custom_org_role, read_organization_custom_repo_role]}
