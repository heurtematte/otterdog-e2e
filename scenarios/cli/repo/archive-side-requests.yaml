# Archiving a repository together with settings sent by their own requests (coverage: repositories.archive).
id: cli.repo.archive-side-requests
title: Archive a repository together with a topics change, then change its topics while archived
description: |
  update_repo sends PATCH /repos/{owner}/{repo} with the plain settings first, then the settings that have their own
  request (topics, custom property values, Pages, security toggles, default branch; repo_client.py:136-187). When a
  repository is archived in the same apply as a topics change, the PUT /repos/{owner}/{repo}/topics follows the
  archiving PATCH and reaches a read-only repository (KB-082, suspected). While the repository stays archived, topics
  are not among the fields otterdog ignores (Repository._unavailable_fields_in_archived_repos), so a topics change is
  still planned and sent (KB-058, suspected). The correct behaviour asserted here: archiving with a topics change
  applies both (the topics before the archiving, or the topics in a request GitHub accepts), and a topics change of
  a repository that stays archived plans nothing, like the other read-only fields. The same family as otterdog#924
  (team permissions sent with the settings of an archived repository). Each step declares its own suspected bug, so
  a live run tells which request GitHub refuses; the other steps stay strict. Two plan-only steps follow on the
  archived repository: Dependabot alerts and the code scanning default setup, both sent by their own requests (PUT
  .../vulnerability-alerts, PATCH .../code-scanning/default-setup), are among the ignored fields and must not be
  planned (strict); a default branch change, which is not, is still planned and would be sent as a branch rename or a
  PATCH (KB-083, suspected). They assert the plan only (no apply, no convergence): the topics may differ from the
  configuration after the known-bug steps. The cleanup deletes the archived repository (allowed).
priority: P1
min_plan: free
tags: [repo]
references:
  - pr: 942
    note: >-
      "Perf/parallel repo loading" (c91d111, after v1.8.0): the requests that load a repository are sent concurrently
      instead of one after the other; an archived repository must read back the same settings (the fields of
      Repository._unavailable_fields_in_archived_repos still ignored), so the plan of each step must not change
steps:
  - name: create
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-arch-side') {
            description: "otterdog e2e: archive side requests",
            topics: ["otterdog-acceptance", "side-a"],
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-arch-side"]'
      counts: {add: 1, change: 0, delete: 0}
    apply:
      api:
        sent:
          - 'POST /orgs/{org}/repos'
          - 'PUT /repos/{owner}/{repo}/topics'
    state:
      - kind: repo
        name: "{{ p }}-arch-side"
        match: {archived: false}
      - kind: repo_topics
        name: "{{ p }}-arch-side"
        match: {$unordered: [otterdog-acceptance, side-a]}

  - name: archive-with-topics
    known_bug: KB-082
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-arch-side') {
            description: "otterdog e2e: archive side requests",
            topics: ["otterdog-acceptance", "side-b"],
            archived: true,
          }
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-arch-side"]'
      counts: {add: 0, change: 2, delete: 0}
    apply:
      not_contains:
        - Repository was archived so is read-only
      api:
        sent:
          - 'PATCH /repos/{owner}/{repo}'
          - 'PUT /repos/{owner}/{repo}/topics'
    state:
      - kind: repo
        name: "{{ p }}-arch-side"
        match: {archived: true}
      - kind: repo_topics
        name: "{{ p }}-arch-side"
        match: {$unordered: [otterdog-acceptance, side-b]}

  - name: archived-topics
    known_bug: KB-058
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-arch-side') {
            description: "otterdog e2e: archive side requests",
            topics: ["otterdog-acceptance", "side-c"],
            archived: true,
          }
    plan:
      expect: noop
      not_contains:
        - side-c
    state:
      - kind: repo
        name: "{{ p }}-arch-side"
        match: {archived: true}

  # plan-only steps: whatever the topics steps left (KB-082, KB-058), these settings must not be planned
  - name: archived-security
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-arch-side') {
            description: "otterdog e2e: archive side requests",
            topics: ["otterdog-acceptance", "side-b"],
            archived: true,
            dependabot_alerts_enabled: false,
            code_scanning_default_setup_enabled: true,
          }
    plan:
      expect: any
      not_contains:
        - dependabot_alerts_enabled
        - code_scanning_default_setup_enabled
    apply: null
    converge: false

  - name: archived-default-branch
    known_bug: KB-083
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-arch-side') {
            description: "otterdog e2e: archive side requests",
            topics: ["otterdog-acceptance", "side-b"],
            archived: true,
            default_branch: "trunk",
          }
    plan:
      expect: any
      not_contains:
        - default_branch
    apply: null
    converge: false
