# C-REPO-LIFECYCLE (SPEC 19, P0): create -> oracle -> converge -> update -> delete of one public run repository.
id: cli.repo.lifecycle
title: Repository lifecycle (create, update, delete)
description: |
  A public run repository is created with a description, a homepage, topics and non-default merge settings. The
  oracle checks the REST repository and its topics, then a converge loop (plan -r <run>-*) must reach a no-op. The
  update step changes the description, homepage, topics, merge methods and feature flags; the last step removes
  the repository from the configuration and applies with -d (guarded: the removal carries this run's id).
priority: P0
min_plan: free
tags: [repo, smoke]
references:
  - pr: 942
    note: >-
      "Perf/parallel repo loading" (c91d111, after v1.8.0): the live settings of the repositories are loaded
      concurrently (no more chunks of 50 repositories with 30 s pauses; the ~20 requests of a repository sent at once,
      at most 30 REST and 10 GraphQL requests in flight) and a rate-limited REST request is sent again up to 3 times.
      Only the order of the requests may change: the plan of each step, the requests of apply.api and the no-op of the
      converge loop must not
steps:
  - name: create
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-lifecycle') {
            description: "otterdog e2e: repository lifecycle",
            homepage: "https://example.org/otterdog-e2e/{{ run }}",
            topics: ["otterdog-acceptance", "lifecycle"],
            has_wiki: false,
            allow_merge_commit: true,
            allow_rebase_merge: false,
            allow_squash_merge: true,
            delete_branch_on_merge: false,
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-lifecycle"]'
      counts: {add: 1, change: 0, delete: 0}
    apply:
      api:
        sent:
          - 'POST /orgs/{org}/repos'
          - 'PUT /repos/{owner}/{repo}/topics'
    state:
      - kind: repo
        name: "{{ p }}-lifecycle"
        match:
          name: "{{ p }}-lifecycle"
          description: "otterdog e2e: repository lifecycle"
          homepage: "https://example.org/otterdog-e2e/{{ run }}"
          private: false
          archived: false
          has_wiki: false
          has_issues: true
          allow_merge_commit: true
          allow_rebase_merge: false
          allow_squash_merge: true
          delete_branch_on_merge: false
          default_branch: main
      - kind: repo_topics
        name: "{{ p }}-lifecycle"
        match: {$unordered: [otterdog-acceptance, lifecycle]}

  - name: update
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-lifecycle') {
            description: "otterdog e2e: repository lifecycle (updated)",
            homepage: "https://example.org/otterdog-e2e/{{ run }}/updated",
            topics: ["otterdog-acceptance", "updated"],
            has_wiki: false,
            has_issues: false,
            allow_merge_commit: false,
            allow_rebase_merge: true,
            allow_squash_merge: true,
            delete_branch_on_merge: true,
          }
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-lifecycle"]'
      counts: {add: 0, delete: 0}
    apply:
      api:
        sent:
          - 'PATCH /repos/{owner}/{repo}'
          - 'PUT /repos/{owner}/{repo}/topics'
    state:
      - kind: repo
        name: "{{ p }}-lifecycle"
        match:
          description: "otterdog e2e: repository lifecycle (updated)"
          homepage: "https://example.org/otterdog-e2e/{{ run }}/updated"
          has_issues: false
          allow_merge_commit: false
          allow_rebase_merge: true
          allow_squash_merge: true
          delete_branch_on_merge: true
      - kind: repo_topics
        name: "{{ p }}-lifecycle"
        match: {$unordered: [otterdog-acceptance, updated]}

  - name: delete
    plan:
      expect: changes
      contains:
        - '- remove repository[name="{{ p }}-lifecycle"]'
      counts: {add: 0, delete: 1}
    apply:
      delete: true
      api:
        sent:
          - 'DELETE /repos/{owner}/{repo}'
    state:
      - {kind: repo, name: "{{ p }}-lifecycle", absent: true}
