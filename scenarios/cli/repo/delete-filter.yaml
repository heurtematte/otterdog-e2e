# cli.apply.delete-filter (P1): apply -d --delete-filter applies only the selected deletions (otterdog#939).
id: cli.apply.delete-filter
title: Apply only the deletions selected by --delete-filter, skipping every other change
description: |
  Since eclipse-csi/otterdog#939 (main 61faaff after v1.8.0) apply takes repeatable --delete-filter selectors (only
  with -d): a type, optionally followed by [key=value, ...] conditions on the key of the resource or on its parent
  named by its type, values being shell patterns. The apply then becomes a targeted deletion: only the selected
  removals are applied, every other patch of the plan (additions, changes, the other removals) is skipped and counted
  ("Executed plan: ... D deleted, N skipped."; "N other change(s) are skipped, only the deletions selected by
  '--delete-filter' are applied." goes before the confirmation prompt, so the harness's apply -f sees it only when
  nothing is left to apply: operations/apply.py:139-158). The journey creates a repository with two variables and an
  environment, a second repository and a third one that is renamed later. Each later step plans the same pending
  changes (a description change and the removals) and deletes one kind of object with its own selector: a variable by
  its key, the environment by its parent, nothing (a selector that matches nothing warns and changes nothing), the
  second repository by its type. Each step asserts the requests: the DELETE of the selected object is sent, the other
  DELETEs and the repository PATCH (the skipped description change) are not, and the oracle sees the other objects
  untouched. A repository renamed through aliases that loses a variable is the case the pull request handles apart:
  only deletions are applied, so the rename is skipped and the variable is deleted from the repository under its
  current (old) name. The last step applies the skipped changes without a filter (the PATCH is sent). Released in the
  first release after v1.8.0: fixed_in skips the scenario on older SUTs.
priority: P1
min_plan: free
fixed_in: "1.9.0"
tags: [repo, variables, environments, cli]
references:
  - pr: 939
    note: >-
      "feat(cli): apply only selected deletions with --delete-filter" (61faaff, after v1.8.0): with --delete-filter
      the apply sends only the DELETE requests of the selected resources (never the PATCH of a skipped change nor
      another DELETE), nested resources of a renamed repository are deleted under its current name; without the
      option apply and apply -d must not change
steps:
  - name: create
    fragments:
      repositories:
        - &kept |
          orgs.newRepo('{{ p }}-df') {
            description: "otterdog e2e: delete filter one",
            variables: [
              orgs.newRepoVariable('{{ P }}_DF_V1') { value: "kept" },
              orgs.newRepoVariable('{{ P }}_DF_V2') { value: "gone" },
            ],
            environments: [orgs.newEnvironment('{{ p }}-df-env')],
          }
        - &gone |
          orgs.newRepo('{{ p }}-df-gone') {
            description: "otterdog e2e: delete filter, deleted by type",
          }
        - &old |
          orgs.newRepo('{{ p }}-df-old') {
            description: "otterdog e2e: delete filter, renamed",
            variables: [orgs.newRepoVariable('{{ P }}_DF_RV') { value: "renamed" }],
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-df"]'
        - '+ add repo_variable[name="{{ P }}_DF_V2", repository={{ p }}-df]'
        - '+ add environment[name="{{ p }}-df-env", repository={{ p }}-df]'
        - '+ add repository[name="{{ p }}-df-gone"]'
        - '+ add repo_variable[name="{{ P }}_DF_RV", repository={{ p }}-df-old]'
      counts: {add: 7, change: 0, delete: 0}
    apply:
      api:
        sent:
          - 'POST /orgs/{org}/repos'
          - 'POST /repos/{owner}/{repo}/actions/variables'
          - 'PUT /repos/{owner}/{repo}/environments/{name}'
    state:
      - kind: repo_variable
        repo: "{{ p }}-df"
        name: "{{ P }}_DF_V2"
        match: {value: gone}
      - {kind: environment, repo: "{{ p }}-df", name: "{{ p }}-df-env", absent: false}
      - {kind: repo, name: "{{ p }}-df-gone", absent: false}
      - kind: repo_variable
        repo: "{{ p }}-df-old"
        name: "{{ P }}_DF_RV"
        match: {value: renamed}

  - name: variable-by-key
    fragments:
      repositories:
        - &changed |
          orgs.newRepo('{{ p }}-df') {
            description: "otterdog e2e: delete filter two",
            variables: [
              orgs.newRepoVariable('{{ P }}_DF_V1') { value: "kept" },
            ],
          }
        - *old
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-df"]'
        - '- remove repo_variable[name="{{ P }}_DF_V2", repository={{ p }}-df]'
        - '- remove environment[name="{{ p }}-df-env", repository={{ p }}-df]'
        - '- remove repository[name="{{ p }}-df-gone"]'
      counts: {add: 0, change: 1, delete: 3}
    apply:
      delete: true
      delete_filter: ['repo_variable[name="{{ P }}_DF_V2"]']
      contains:
        - '- remove repo_variable[name="{{ P }}_DF_V2", repository={{ p }}-df]'
        - 'Executed plan: 0 added, 0 changed, 1 deleted, 3 skipped.'
      not_contains: ['- remove environment[', '- remove repository[', '~ repository[']
      api:
        sent:
          - 'DELETE /repos/{owner}/{repo}/actions/variables/{name}'
        not_sent:
          - 'DELETE /repos/{owner}/{repo}/environments/{name}'
          - 'DELETE /repos/{owner}/{repo}'
          - 'PATCH /repos/{owner}/{repo}'
    state:
      - {kind: repo_variable, repo: "{{ p }}-df", name: "{{ P }}_DF_V2", absent: true}
      - {kind: repo_variable, repo: "{{ p }}-df", name: "{{ P }}_DF_V1", match: {value: kept}}
      - {kind: environment, repo: "{{ p }}-df", name: "{{ p }}-df-env", absent: false}
      - {kind: repo, name: "{{ p }}-df-gone", absent: false}
      - {kind: repo, name: "{{ p }}-df", match: {description: "otterdog e2e: delete filter one"}}
    converge: false

  - name: environment-by-parent
    fragments:
      repositories: [*changed, *old]
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 2}
    apply:
      delete: true
      delete_filter: ['environment[repository={{ p }}-df]']
      contains:
        - '- remove environment[name="{{ p }}-df-env", repository={{ p }}-df]'
        - 'Executed plan: 0 added, 0 changed, 1 deleted, 2 skipped.'
      not_contains: ['- remove repository[', '~ repository[']
      api:
        sent:
          - 'DELETE /repos/{owner}/{repo}/environments/{name}'
        not_sent:
          - 'DELETE /repos/{owner}/{repo}'
          - 'PATCH /repos/{owner}/{repo}'
    state:
      - {kind: environment, repo: "{{ p }}-df", name: "{{ p }}-df-env", absent: true}
      - {kind: repo, name: "{{ p }}-df-gone", absent: false}
      - {kind: repo, name: "{{ p }}-df", match: {description: "otterdog e2e: delete filter one"}}
    converge: false

  - name: no-match
    fragments:
      repositories: [*changed, *old]
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 1}
    apply:
      delete: true
      delete_filter: [org_variable, repo_variable]
      contains:
        - "no resource to delete matches the delete filter 'org_variable'."
        - 'No changes required.'
        - "2 other change(s) are skipped, only the deletions selected by '--delete-filter' are applied."
      not_contains: ['Executed plan:', '- remove repository[']
      api:
        not_sent:
          - 'DELETE /repos/{owner}/{repo}'
          - 'PATCH /repos/{owner}/{repo}'
    state:
      - {kind: repo, name: "{{ p }}-df-gone", absent: false}
      - {kind: repo, name: "{{ p }}-df", match: {description: "otterdog e2e: delete filter one"}}
    converge: false

  - name: repository-by-type
    fragments:
      repositories: [*changed, *old]
    plan:
      expect: changes
      counts: {add: 0, change: 1, delete: 1}
    apply:
      delete: true
      delete_filter: [repository]
      contains:
        - '- remove repository[name="{{ p }}-df-gone"]'
        - 'Executed plan: 0 added, 0 changed, 1 deleted, 1 skipped.'
      not_contains: ['~ repository[']
      api:
        sent:
          - 'DELETE /repos/{owner}/{repo}'
        not_sent:
          - 'PATCH /repos/{owner}/{repo}'
    state:
      - {kind: repo, name: "{{ p }}-df-gone", absent: true}
      - {kind: repo, name: "{{ p }}-df", match: {description: "otterdog e2e: delete filter one"}}
    converge: false

  - name: renamed-repository
    fragments:
      repositories:
        - *changed
        - &renamed |
          orgs.newRepo('{{ p }}-df-new') {
            aliases: ['{{ p }}-df-old'],
            description: "otterdog e2e: delete filter, renamed",
          }
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-df-new"]'
        - '- remove repo_variable[name="{{ P }}_DF_RV", repository={{ p }}-df-new]'
      counts: {add: 0, change: 2, delete: 1}
    apply:
      delete: true
      delete_filter: [repo_variable]
      contains:
        - '- remove repo_variable[name="{{ P }}_DF_RV", repository={{ p }}-df-old]'
        - 'Executed plan: 0 added, 0 changed, 1 deleted, 2 skipped.'
      not_contains: ['~ repository[', 'failed to apply patch']
      api:
        sent:
          - 'DELETE /repos/{owner}/{repo}/actions/variables/{name}'
        not_sent:
          - 'PATCH /repos/{owner}/{repo}'
    state:
      - {kind: repo_variable, repo: "{{ p }}-df-old", name: "{{ P }}_DF_RV", absent: true}
      - {kind: repo, name: "{{ p }}-df-old", match: {description: "otterdog e2e: delete filter, renamed"}}
      - {kind: repo, name: "{{ p }}-df-new", absent: true}
    converge: false

  - name: apply-the-rest
    fragments:
      repositories: [*changed, *renamed]
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-df"]'
        - '~ repository[name="{{ p }}-df-new"]'
      not_contains: ['- remove ']
      counts: {add: 0, change: 2, delete: 0}
    apply:
      api:
        sent:
          - 'PATCH /repos/{owner}/{repo}'
        not_sent:
          - 'DELETE /repos/{owner}/{repo}'
          - 'DELETE /repos/{owner}/{repo}/actions/variables/{name}'
    state:
      - {kind: repo, name: "{{ p }}-df", match: {description: "otterdog e2e: delete filter two"}}
      - {kind: repo, name: "{{ p }}-df-new", absent: false}
      - {kind: repo, name: "{{ p }}-df-old", absent: true}
