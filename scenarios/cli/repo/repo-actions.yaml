# Repository GitHub Actions settings (coverage: repo-workflows.enabled, repo-workflows.allowed-actions,
# repo-workflows.fork-pr-approval, repo-workflows.default-permissions (actions_can_approve_pull_request_reviews)).
id: cli.repo.actions
tier: cli
title: Repository Actions enablement, allowed actions and fork pull request approval
description: |
  The workflows settings of a public run repository (models/repo_workflow_settings.py, written by
  providers/github/rest/repo_client.py:1164-1338). The disabled step creates the repository with Actions disabled:
  otterdog then sends only 'enabled' (RepositoryWorkflowSettings.get_mapping_to_provider) and compares nothing
  else, so the repository converges although the other settings cannot be read. The selected step enables Actions
  with allowed_actions 'selected' and the selected-actions properties; the organization allows all actions
  (template), so the stricter repository value is managed (WorkflowSettings.are_actions_more_or_equally_restricted).
  It also refuses the approval of pull request reviews by workflows (actions_can_approve_pull_request_reviews false),
  which the organization allows. The local-only step restricts the repository to the organization's own actions
  (the selected-actions endpoint answers 409 then: absent) and sets the fork pull request approval policy, which
  otterdog manages on public repositories only (#635). default_workflow_permissions stays unmanaged here: the
  organization's 'read' coerces it away (scenario cli.repo.org-coerced manages it). The workflows block is one
  embedded attribute: every change step plans exactly one changed attribute.
priority: P1
min_plan: free
tags: [repo, workflows]
steps:
  - name: disabled
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-actions') {
            description: "otterdog e2e: repository actions",
            workflows+: {
              enabled: false,
            },
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-actions"]'
      counts: {add: 1, change: 0, delete: 0}
    state:
      - kind: repo_actions
        name: "{{ p }}-actions"
        match: {enabled: false}

  - name: selected
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-actions') {
            description: "otterdog e2e: repository actions",
            workflows+: {
              enabled: true,
              allowed_actions: "selected",
              allow_github_owned_actions: true,
              allow_verified_creator_actions: false,
              allow_action_patterns: ["actions/*"],
              actions_can_approve_pull_request_reviews: false,
            },
          }
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-actions"]'
      counts: {add: 0, change: 1, delete: 0}
    state:
      - kind: repo_actions
        name: "{{ p }}-actions"
        match: {enabled: true, allowed_actions: selected}
      - kind: repo_selected_actions
        repo: "{{ p }}-actions"
        match: {github_owned_allowed: true, verified_allowed: false, patterns_allowed: [actions/*]}
      - kind: repo_workflow_permissions
        name: "{{ p }}-actions"
        match: {can_approve_pull_request_reviews: false}

  - name: local-only
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-actions') {
            description: "otterdog e2e: repository actions",
            workflows+: {
              enabled: true,
              allowed_actions: "local_only",
              actions_can_approve_pull_request_reviews: false,
              fork_pr_approval_policy: "all_external_contributors",
            },
          }
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-actions"]'
      counts: {add: 0, change: 1, delete: 0}
    state:
      - kind: repo_actions
        name: "{{ p }}-actions"
        match: {enabled: true, allowed_actions: local_only}
      - {kind: repo_selected_actions, repo: "{{ p }}-actions", absent: true}
      - kind: repo_fork_pr_approval
        repo: "{{ p }}-actions"
        match: {approval_policy: all_external_contributors}
      - kind: repo_workflow_permissions
        name: "{{ p }}-actions"
        match: {can_approve_pull_request_reviews: false}
