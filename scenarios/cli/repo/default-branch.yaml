# repositories.default-branch (P0): rename and switch the default branch of a repository, and their requests.
id: cli.repo.default-branch
title: Rename and switch the default branch of a repository
tier: cli
description: |
  otterdog changes default_branch in two ways (otterdog/providers/github/rest/repo_client.py:727-746): when the
  configured branch exists, it PATCHes the repository's default branch (a switch); otherwise it renames the current
  default branch (POST /repos/{owner}/{repo}/branches/{branch}/rename). New repositories created with auto_init get
  their default branch through the same update right after creation (repo_client.py:310-339), so a configured 'master'
  renames the initial 'main'. Steps: create (main renamed to master), rename (master renamed to trunk, a single branch
  remains; no PATCH of the repository, default_branch is its only change), then the probe of tests/cli/conftest.py
  (PROBES) creates the run branch e2e/<run>/develop from trunk with the admin Mutator (YAML cannot create a branch),
  switch (the existing branch becomes the default with PATCH /repos/{owner}/{repo}, no rename, trunk stays), remove
  (the SUT deletes the repository, apply -d). Each step converges. A default branch change of an archived
  repository is pinned by cli.repo.archive-side-requests (KB-083); forks get their default branch through the same
  update (cli.repo.fork declares the upstream's 'master' to avoid that rename).
priority: P0
min_plan: free
# tier timeout 600 s + the probe: up to 60 s for the head of trunk and 60 s for the new branch (tests/cli/conftest.py)
timeout: 900
tags: [repo]
steps:
  - name: create
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-def-branch') {
            description: "otterdog e2e: default branch",
            default_branch: "master",
          }
    plan:
      expect: changes
      contains: ['+ add repository[name="{{ p }}-def-branch"]']
      counts: {add: 1, change: 0, delete: 0}
    apply:
      api:
        sent:
          - 'POST /orgs/{org}/repos'
          - 'POST /repos/{owner}/{repo}/branches/{name}/rename'
    state:
      - {kind: repo_default_branch, repo: "{{ p }}-def-branch", equals: master}
      - {kind: repo_branches, repo: "{{ p }}-def-branch", equals: [master]}

  - name: rename
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-def-branch') {
            description: "otterdog e2e: default branch",
            default_branch: "trunk",
          }
    plan:
      expect: changes
      contains: ['~ repository[name="{{ p }}-def-branch"]']
      counts: {add: 0, change: 1, delete: 0}
    apply:
      api:
        sent:
          - 'POST /repos/{owner}/{repo}/branches/{name}/rename'
        not_sent:
          - 'PATCH /repos/{owner}/{repo}'
    state:
      - {kind: repo_default_branch, repo: "{{ p }}-def-branch", equals: trunk}
      - {kind: repo_branches, repo: "{{ p }}-def-branch", equals: [trunk]}

  - name: switch
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-def-branch') {
            description: "otterdog e2e: default branch",
            default_branch: "e2e/{{ run }}/develop",
          }
    plan:
      expect: changes
      contains: ['~ repository[name="{{ p }}-def-branch"]']
      counts: {add: 0, change: 1, delete: 0}
    apply:
      api:
        sent:
          - 'PATCH /repos/{owner}/{repo}'
        not_sent:
          - 'POST /repos/{owner}/{repo}/branches/{name}/rename'
    state:
      - {kind: repo_default_branch, repo: "{{ p }}-def-branch", equals: "e2e/{{ run }}/develop"}
      - {kind: repo_branches, repo: "{{ p }}-def-branch", match: {$unordered: [trunk, "e2e/{{ run }}/develop"]}}
      - {kind: repo_branch, repo: "{{ p }}-def-branch", branch: trunk, absent: false}

  - name: remove
    fragments: {}
    plan:
      expect: changes
      contains: ['- remove repository[name="{{ p }}-def-branch"]']
      counts: {add: 0, change: 0, delete: 1}
    apply:
      delete: true
      api:
        sent:
          - 'DELETE /repos/{owner}/{repo}'
        not_sent:
          - 'POST /repos/{owner}/{repo}/branches/{name}/rename'
    state:
      - {kind: repo, name: "{{ p }}-def-branch", absent: true}
