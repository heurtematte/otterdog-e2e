# A repository created as a fork (coverage: repositories.fork).
id: cli.repo.fork
tier: cli
title: Create a repository as a fork of a public repository
description: |
  forked_repository '<owner>/<repo>' makes otterdog create the repository with POST /repos/{owner}/{repo}/forks
  {organization, name, default_branch_only} instead of POST /orgs/{org}/repos, then patch the remaining settings
  (providers/github/rest/repo_client.py:166-193). The upstream is GitHub's public demo repository octocat/Hello-World,
  whose default branch is 'master': the configuration declares it, otherwise otterdog would rename the fork's only
  branch to the template's 'main'. With fork_default_branch_only true the fork carries that branch alone. The oracle
  checks the fork relation (fork, parent.full_name), the branches and a patched setting; forked_repository and
  fork_default_branch_only are model-only (never read back), so converging shows that they do not produce a
  perpetual diff. GitHub keeps at most one fork of a repository per organization: only this scenario forks
  octocat/Hello-World, and the cleanup deletes the fork.
priority: P2
min_plan: free
tags: [repo]
steps:
  - name: fork
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-fork') {
            description: "otterdog e2e: fork of octocat/Hello-World",
            forked_repository: "octocat/Hello-World",
            fork_default_branch_only: true,
            default_branch: "master",
            has_wiki: false,
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-fork"]'
      counts: {add: 1, change: 0, delete: 0}
    state:
      - kind: repo
        name: "{{ p }}-fork"
        match:
          fork: true
          parent: {full_name: octocat/Hello-World}
          default_branch: master
          description: "otterdog e2e: fork of octocat/Hello-World"
          has_wiki: false
      - {kind: repo_branches, repo: "{{ p }}-fork", equals: [master]}
