# webhooks.repo.secret (P1): repository webhook secrets (plain, dummy, forced update, removal).
id: cli.repo.webhook-secret
title: Repository webhook secrets (plain value, dummy, --update-webhooks, removal)
tier: cli
description: |
  Webhook secrets (otterdog/models/webhook.py:59-95, :178-223): a plain value ('e2e-dummy-<run>') is applied as it is
  with the warning "does not use a credential provider", and GitHub then reports config.secret as '********'; a
  hook whose configured secret is the dummy '********' is skipped entirely (Info, never added: hooks created out of
  band keep their secret). GitHub never returns secret values, so they are never compared: the next plans converge.
  --update-webhooks forces ('!') every hook with a secret whose url matches --update-filter; a hook without a secret
  is never forced. Removing the secret (secret null) is planned with "Warning: removing secret for webhook with url
  '<url>'" (otterdog/operations/plan.py:103-110) and GitHub then reports no secret. The last step removes the hooks
  (apply -d). Hook URLs lie under the never-resolving hook base.
priority: P1
tags: [webhooks, repo, secrets]
steps:
  - name: create
    fragments:
      repositories: &secured
        - |
          orgs.newRepo('{{ p }}-hooksec') {
            description: "otterdog e2e: repository webhook secrets",
            webhooks: [
              orgs.newRepoWebhook('{{ hook_base }}secured') {
                content_type: "json",
                events+: ["push"],
                secret: "e2e-dummy-{{ run }}",
              },
              orgs.newRepoWebhook('{{ hook_base }}plain') {
                content_type: "json",
                events+: ["push"],
              },
              orgs.newRepoWebhook('{{ hook_base }}dummy') {
                content_type: "json",
                events+: ["push"],
                secret: "********",
              },
            ],
          }
    validate:
      verbose: true
      ok: true
      warnings_min: 1
      contains:
        - >-
          Warning: repo_webhook[url="{{ hook_base }}secured", repository={{ p }}-hooksec] has a secret
          'e2e-dummy-{{ run }}' that does not use a credential provider.
        - >-
          Info: repo_webhook[url="{{ hook_base }}dummy", repository={{ p }}-hooksec] has a secret set, but only a
          dummy secret '********' is provided in the configuration, will be skipped.
      not_contains:
        - 'repo_webhook[url="{{ hook_base }}plain", repository={{ p }}-hooksec] has a secret'
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-hooksec"]'
        - '+ add repo_webhook[url="{{ hook_base }}secured", repository={{ p }}-hooksec]'
        - '+ add repo_webhook[url="{{ hook_base }}plain", repository={{ p }}-hooksec]'
      not_contains:
        - 'repo_webhook[url="{{ hook_base }}dummy", repository={{ p }}-hooksec] {'
      counts: {add: 3, change: 0, delete: 0}
    state:
      - kind: repo_webhook
        repo: "{{ p }}-hooksec"
        url: "{{ hook_base }}secured"
        match: {active: true, config: {url: "{{ hook_base }}secured", secret: "********"}}
      - kind: repo_webhook
        repo: "{{ p }}-hooksec"
        url: "{{ hook_base }}plain"
        match: {active: true, config: {url: "{{ hook_base }}plain", secret: {$exists: false}}}
      - kind: repo_webhook
        repo: "{{ p }}-hooksec"
        url: "{{ hook_base }}dummy"
        absent: true

  - name: forced
    fragments:
      repositories: *secured
    plan:
      expect: changes
      update_webhooks: true
      update_filter: "{{ hook_base }}sec*"
      contains:
        - '! repo_webhook[url="{{ hook_base }}secured", repository={{ p }}-hooksec]'
      not_contains:
        - '! repo_webhook[url="{{ hook_base }}plain"'
        - 'repo_webhook[url="{{ hook_base }}dummy", repository={{ p }}-hooksec] {'
    apply:
      update_webhooks: true
      update_filter: "{{ hook_base }}sec*"
      contains:
        - '! repo_webhook[url="{{ hook_base }}secured", repository={{ p }}-hooksec]'
    state:
      - kind: repo_webhook
        repo: "{{ p }}-hooksec"
        url: "{{ hook_base }}secured"
        match: {config: {secret: "********"}}

  - name: remove-secret
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-hooksec') {
            description: "otterdog e2e: repository webhook secrets",
            webhooks: [
              orgs.newRepoWebhook('{{ hook_base }}secured') {
                content_type: "json",
                events+: ["push"],
                secret: null,
              },
              orgs.newRepoWebhook('{{ hook_base }}plain') {
                content_type: "json",
                events+: ["push"],
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '~ repo_webhook[url="{{ hook_base }}secured", repository={{ p }}-hooksec]'
        - "Warning: removing secret for webhook with url '{{ hook_base }}secured'"
      not_contains:
        - "removing secret for webhook with url '{{ hook_base }}plain'"
      counts: {add: 0, delete: 0}
    state:
      - kind: repo_webhook
        repo: "{{ p }}-hooksec"
        url: "{{ hook_base }}secured"
        match: {active: true, config: {url: "{{ hook_base }}secured", secret: {$exists: false}}}

  - name: remove-hooks
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-hooksec') {
            description: "otterdog e2e: repository webhook secrets",
          }
    plan:
      expect: changes
      contains:
        - '- remove repo_webhook[url="{{ hook_base }}secured", repository={{ p }}-hooksec]'
        - '- remove repo_webhook[url="{{ hook_base }}plain", repository={{ p }}-hooksec]'
      counts: {add: 0, delete: 2}
    apply: {delete: true}
    state:
      - kind: repo_webhook
        repo: "{{ p }}-hooksec"
        url: "{{ hook_base }}secured"
        absent: true
      - kind: repo_webhook
        repo: "{{ p }}-hooksec"
        url: "{{ hook_base }}plain"
        absent: true
