# C-REPO-WEBHOOK (SPEC 19, P0), also H-REPO-HOOK-PING: managed repository webhook + ping/deliveries probe.
id: cli.repo.webhook
title: Repository webhook (create, update, ping, remove)
description: |
  A run repository with a managed webhook whose URL lies under naming.HOOK_BASE
  (https://otterdog-e2e.invalid/<run>/..., a reserved TLD: deliveries never reach a server, GitHub still logs them).
  The oracle checks the hook config after create and update. After the 'update' step tests/cli/test_scenarios.py
  runs the webhook probe (tests/cli/conftest.py, 300 s budget because delivery logs lag): an explicit ping (POST
  .../hooks/{id}/pings) must add a new 'ping' delivery, delivered after GitHub's time of that ping (an earlier ping,
  such as the one of the hook's creation, logged late never counts). The creation ping is only logged, not asserted.
  The last step removes the hook from the still existing repository (nested removal, apply -d).
priority: P0
min_plan: free
# tier timeout 600 s + the probe: up to 60 s to find the hook and 300 s for its ping delivery (tests/cli/conftest.py)
timeout: 960
tags: [webhooks, repo]
steps:
  - name: create
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-hooks') {
            description: "otterdog e2e: repository webhook",
            webhooks: [
              orgs.newRepoWebhook('{{ hook_base }}repo-hook') {
                content_type: "json",
                events+: ["push"],
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-hooks"]'
        - '+ add repo_webhook[url="{{ hook_base }}repo-hook", repository={{ p }}-hooks]'
      counts: {add: 2, change: 0, delete: 0}
    state:
      - kind: repo_webhook
        repo: "{{ p }}-hooks"
        url: "{{ hook_base }}repo-hook"
        match:
          active: true
          events: [push]
          config: {url: "{{ hook_base }}repo-hook", content_type: json, insecure_ssl: "0"}

  - name: update
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-hooks') {
            description: "otterdog e2e: repository webhook",
            webhooks: [
              orgs.newRepoWebhook('{{ hook_base }}repo-hook') {
                content_type: "form",
                events+: ["push", "pull_request"],
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '~ repo_webhook[url="{{ hook_base }}repo-hook", repository={{ p }}-hooks]'
      counts: {add: 0, delete: 0}
    state:
      - kind: repo_webhook
        repo: "{{ p }}-hooks"
        url: "{{ hook_base }}repo-hook"
        match:
          active: true
          events: {$unordered: [push, pull_request]}
          config: {url: "{{ hook_base }}repo-hook", content_type: form}

  - name: remove-hook
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-hooks') {
            description: "otterdog e2e: repository webhook",
          }
    plan:
      expect: changes
      contains:
        - '- remove repo_webhook[url="{{ hook_base }}repo-hook", repository={{ p }}-hooks]'
      counts: {add: 0, delete: 1}
    apply: {delete: true}
    state:
      - kind: repo_webhook
        repo: "{{ p }}-hooks"
        url: "{{ hook_base }}repo-hook"
        absent: true
      - kind: repo
        name: "{{ p }}-hooks"
        match: {name: "{{ p }}-hooks"}
