# Ruleset bypass actors (coverage: rulesets.bypass-actors).
id: cli.ruleset.bypass
tier: cli
title: Ruleset bypass actors (roles and teams) and their bypass modes
description: |
  bypass_actors of a repository ruleset (models/ruleset.py:527-570 read, :634-670 write; docs
  reference/organization/repository/bypass-actor.md): '#OrganizationAdmin' becomes actor_type OrganizationAdmin,
  '#RepositoryAdmin', '#Maintain' and '#Write' the repository roles 5, 2 and 4, '@<org>/<team>' a Team (its id
  resolved through GET /orgs/{org}/teams/{slug}, read back through the organization's teams), each optionally with
  ':pull_request' (the default mode 'always' is read back without a suffix). A run team with push access to a public
  run repository is the team actor; the App actor is tested by cli.protection.app-checks and individual users by
  regression.779-user-bypass-actors. The create step uses every role, the update step changes the modes and the
  set; both converge. The last two steps reproduce known bugs, each one an expected failure of its own step while
  the bug exists (the other steps stay strict): an unknown role ('#Admin') passes validation and crashes the apply
  (KB-039), so the step asserts the validation error that should be reported; the documented explicit mode
  '<actor>:always' is read back without the suffix and never converges (KB-052), so the step asserts the converge.
priority: P1
min_plan: free
tags: [rulesets, teams, repo]
steps:
  - name: create
    fragments:
      teams:
        - &team |
          orgs.newTeam('{{ p }}-rs-bypass') {
            description: "otterdog e2e: ruleset bypass team",
            privacy: "visible",
            members: [],
          }
      repositories:
        - |
          orgs.newRepo('{{ p }}-rs-bypass') {
            description: "otterdog e2e: ruleset bypass actors",
            team_permissions: {
              "{{ p }}-rs-bypass": "push",
            },
            rulesets: [
              orgs.newRepoRuleset('{{ p }}-rs-bypass') {
                include_refs+: ["~DEFAULT_BRANCH"],
                bypass_actors: [
                  "#OrganizationAdmin",
                  "#RepositoryAdmin",
                  "#Maintain:pull_request",
                  "#Write",
                  "@{{ org }}/{{ p }}-rs-bypass",
                ],
                required_status_checks: null,
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '+ add team[name="{{ p }}-rs-bypass"]'
        - '+ add repo_ruleset[name="{{ p }}-rs-bypass", repository={{ p }}-rs-bypass]'
      counts: {add: 3, change: 0, delete: 0}
    state:
      - kind: repo_ruleset
        repo: "{{ p }}-rs-bypass"
        name: "{{ p }}-rs-bypass"
        match:
          bypass_actors:
            $unordered:
              - {actor_type: OrganizationAdmin, bypass_mode: always}
              - {actor_type: RepositoryRole, actor_id: 5, bypass_mode: always}
              - {actor_type: RepositoryRole, actor_id: 2, bypass_mode: pull_request}
              - {actor_type: RepositoryRole, actor_id: 4, bypass_mode: always}
              - {actor_type: Team, bypass_mode: always}

  - name: update
    fragments:
      teams:
        - *team
      repositories:
        - |
          orgs.newRepo('{{ p }}-rs-bypass') {
            description: "otterdog e2e: ruleset bypass actors",
            team_permissions: {
              "{{ p }}-rs-bypass": "push",
            },
            rulesets: [
              orgs.newRepoRuleset('{{ p }}-rs-bypass') {
                include_refs+: ["~DEFAULT_BRANCH"],
                bypass_actors: [
                  "#OrganizationAdmin:pull_request",
                  "#Maintain",
                  "@{{ org }}/{{ p }}-rs-bypass:pull_request",
                ],
                required_status_checks: null,
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '~ repo_ruleset[name="{{ p }}-rs-bypass", repository={{ p }}-rs-bypass]'
      counts: {add: 0, change: 1, delete: 0}
    state:
      - kind: repo_ruleset
        repo: "{{ p }}-rs-bypass"
        name: "{{ p }}-rs-bypass"
        match:
          bypass_actors:
            $unordered:
              - {actor_type: OrganizationAdmin, bypass_mode: pull_request}
              - {actor_type: RepositoryRole, actor_id: 2, bypass_mode: always}
              - {actor_type: Team, bypass_mode: pull_request}

  - name: unknown-role
    known_bug: KB-039
    fragments:
      teams:
        - *team
      repositories:
        - |
          orgs.newRepo('{{ p }}-rs-bypass') {
            description: "otterdog e2e: ruleset bypass actors",
            team_permissions: {
              "{{ p }}-rs-bypass": "push",
            },
            rulesets: [
              orgs.newRepoRuleset('{{ p }}-rs-bypass') {
                include_refs+: ["~DEFAULT_BRANCH"],
                bypass_actors: ["#Admin"],
                required_status_checks: null,
              },
            ],
          }
    validate:
      ok: false
      errors: 1
    plan:
      expect: validation_error
    apply: null
    converge: false

  - name: explicit-always
    known_bug: {id: KB-052, phases: [converge]}  # plan, apply and state stay strict
    fragments:
      teams:
        - *team
      repositories:
        - |
          orgs.newRepo('{{ p }}-rs-bypass') {
            description: "otterdog e2e: ruleset bypass actors",
            team_permissions: {
              "{{ p }}-rs-bypass": "push",
            },
            rulesets: [
              orgs.newRepoRuleset('{{ p }}-rs-bypass') {
                include_refs+: ["~DEFAULT_BRANCH"],
                bypass_actors: ["#Maintain:always", "@{{ org }}/{{ p }}-rs-bypass:always"],
                required_status_checks: null,
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '~ repo_ruleset[name="{{ p }}-rs-bypass", repository={{ p }}-rs-bypass]'
    state:
      - kind: repo_ruleset
        repo: "{{ p }}-rs-bypass"
        name: "{{ p }}-rs-bypass"
        match:
          bypass_actors:
            $unordered:
              - {actor_type: RepositoryRole, actor_id: 2, bypass_mode: always}
              - {actor_type: Team, bypass_mode: always}
