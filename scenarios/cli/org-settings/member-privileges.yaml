# org-settings.member-privileges (P1) and org-settings.pages-creation (P2), org_level: REST member privileges.
id: cli.org.member-privileges
title: Organization member privileges, repository creation, forking and Pages creation
tier: cli
description: |
  The member privileges otterdog manages through PATCH /orgs/{org} (otterdog/models/organization_settings.py:65-76):
  base repository permission (default_repository_permission read -> none), repository creation by members
  (members_can_create_public_repositories, members_can_create_private_repositories: every plan), deploy keys
  (deploy_keys_enabled_for_repositories), organization projects (has_organization_projects) and public Pages
  creation (members_can_create_public_pages). GET /orgs/{org} returns every key under the same name, so the oracle
  matches them one by one after each apply, and each step converges. Members may create public repositories in the
  'privileges' step and private ones too in the 'private-creation' step: GitHub Free answers 422 "Private-only
  repository creation policy is not allowed for this organization" to the PATCH that turns both on at once
  (nightlies 44545614854 and 44760214930, 1.8.0 and main 6f3ab92; the body lists
  members_can_create_private_repositories first, in the model's field order, and GitHub apparently checks the policy
  after each field, private-only after the first one).
  The run repository is created PUBLIC (otterdog before 1.7.0 cannot create a private repository on an organization
  without Code Security, #791, and the scenario runs on such SUTs too: BAT-01) and becomes private in the 'fork' step,
  with allow_forking true, in the apply that allows members to fork private repositories (settings are patched before
  repositories). Made private while the organization still refuses private forks, it would be refused whatever its
  allow_forking (KB-088: the 'privileges' step did so until 2026-11-22, and the repository stayed public). The 'fork'
  step keeps the privileges of the steps before: GitHub applies a default_repository_permission change in the
  background, for minutes, and answers 409 "Currently updating default_repository_permission. Further changes will be
  ignored until update is complete" to any PATCH /orgs/{org} that names it meanwhile (nightly 45395404229, 1.8.0 and
  main: the 'fork' step put the template values back 2-3 minutes after the 'privileges' step). The baseline reset
  restores them: a guarded apply refused with that 409 plans and applies again after a pause (baseline.py
  SETTINGS_BUSY_*; nightly 45596269086: the cleanup reset failed its settings patch for about 2 minutes).
  Private Pages creation (members_can_create_private_pages) is enterprise-only (validation, KB-024) and not changed
  here. org_level: unfiltered plans, full baseline reset as cleanup (it removes the private run repository too).
priority: P1
org_level: true
tags: [org-settings, repo]
steps:
  - name: repo
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-fork') {
            description: "otterdog e2e: private repository members may fork",
            has_wiki: false,
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-fork"]'
    apply:
      api:
        sent:
          - 'POST /orgs/{org}/repos'
    state:
      - kind: repo
        name: "{{ p }}-fork"
        match: {private: false}

  - name: privileges
    fragments:
      settings:
        - "default_repository_permission: 'none'"
        - "members_can_create_public_repositories: true"
        - "deploy_keys_enabled_for_repositories: false"
        - "has_organization_projects: false"
        - "members_can_create_public_pages: false"
      repositories:
        - |
          orgs.newRepo('{{ p }}-fork') {
            description: "otterdog e2e: private repository members may fork",
            has_wiki: false,
          }
    plan:
      expect: changes
      contains:
        - "~ settings {"
        - '"read" -> "none"'
        - "members_can_create_public_repositories"
        - "deploy_keys_enabled_for_repositories"
        - "has_organization_projects"
        - "members_can_create_public_pages"
      not_contains:
        - "members_can_create_private_repositories"
        - "members_can_fork_private_repositories"
        - 'repository[name="{{ p }}-fork"]'
    apply:
      api:
        sent:
          - 'PATCH /orgs/{org}'
    state:
      - kind: org
        match:
          default_repository_permission: none
          members_can_create_public_repositories: true
          members_can_create_private_repositories: false
          deploy_keys_enabled_for_repositories: false
          has_organization_projects: false
          members_can_create_public_pages: false

  - name: private-creation
    fragments:
      settings:
        - "default_repository_permission: 'none'"
        - "members_can_create_public_repositories: true"
        - "members_can_create_private_repositories: true"
        - "deploy_keys_enabled_for_repositories: false"
        - "has_organization_projects: false"
        - "members_can_create_public_pages: false"
      repositories:
        - |
          orgs.newRepo('{{ p }}-fork') {
            description: "otterdog e2e: private repository members may fork",
            has_wiki: false,
          }
    plan:
      expect: changes
      contains:
        - "~ settings {"
        - "members_can_create_private_repositories"
      not_contains:
        - "members_can_create_public_repositories"
        - "default_repository_permission"
        - 'repository[name="{{ p }}-fork"]'
    apply:
      api:
        sent:
          - 'PATCH /orgs/{org}'
    state:
      - kind: org
        match:
          default_repository_permission: none
          members_can_create_public_repositories: true
          members_can_create_private_repositories: true

  - name: fork
    fragments:
      settings:
        - "default_repository_permission: 'none'"
        - "members_can_create_public_repositories: true"
        - "members_can_create_private_repositories: true"
        - "members_can_fork_private_repositories: true"
        - "deploy_keys_enabled_for_repositories: false"
        - "has_organization_projects: false"
        - "members_can_create_public_pages: false"
      repositories:
        - |
          orgs.newRepo('{{ p }}-fork') {
            description: "otterdog e2e: private repository members may fork",
            private: true,
            allow_forking: true,
            has_wiki: false,
          }
    validate:
      ok: true
      not_contains:
        - "allow_forking"
    plan:
      expect: changes
      contains:
        - "~ settings {"
        - "members_can_fork_private_repositories"
        - '~ repository[name="{{ p }}-fork"]'
      not_contains:
        - "default_repository_permission"
        - "members_can_create_public_repositories"
        - "members_can_create_private_repositories"
    apply:
      api:
        sent:
          - 'PATCH /orgs/{org}'
          - 'PATCH /repos/{owner}/{repo}'
    state:
      - kind: org
        match:
          members_can_fork_private_repositories: true
          default_repository_permission: none
          members_can_create_public_repositories: true
          members_can_create_private_repositories: true
          deploy_keys_enabled_for_repositories: false
          has_organization_projects: false
          members_can_create_public_pages: false
      - kind: repo
        name: "{{ p }}-fork"
        match: {private: true, allow_forking: true}
