# C-REPO-LIFECYCLE (SPEC 19, P0): create -> oracle -> converge -> update -> delete of one public run repository.
id: cli.repo.lifecycle
title: Repository lifecycle (create, update, delete)
description: |
  A public run repository is created with a description, a homepage, topics and non-default merge settings. The
  oracle checks the REST repository and its topics, then a converge loop (plan -r <run>-*) must reach a no-op. The
  update step changes the description, homepage, topics, merge methods and feature flags; the last step removes
  the repository from the configuration and applies with -d (guarded: the removal carries this run's id).
priority: P0
min_plan: free
tags: [repo, smoke]
steps:
  - name: create
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-lifecycle') {
            description: "otterdog e2e: repository lifecycle",
            homepage: "https://example.org/otterdog-e2e/{{ run }}",
            topics: ["otterdog-e2e", "lifecycle"],
            has_wiki: false,
            allow_merge_commit: true,
            allow_rebase_merge: false,
            allow_squash_merge: true,
            delete_branch_on_merge: false,
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-lifecycle"]'
      counts: {add: 1, change: 0, delete: 0}
    state:
      - kind: repo
        name: "{{ p }}-lifecycle"
        match:
          name: "{{ p }}-lifecycle"
          description: "otterdog e2e: repository lifecycle"
          homepage: "https://example.org/otterdog-e2e/{{ run }}"
          private: false
          archived: false
          has_wiki: false
          has_issues: true
          allow_merge_commit: true
          allow_rebase_merge: false
          allow_squash_merge: true
          delete_branch_on_merge: false
          default_branch: main
      - kind: repo_topics
        name: "{{ p }}-lifecycle"
        match: {$unordered: [otterdog-e2e, lifecycle]}

  - name: update
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-lifecycle') {
            description: "otterdog e2e: repository lifecycle (updated)",
            homepage: "https://example.org/otterdog-e2e/{{ run }}/updated",
            topics: ["otterdog-e2e", "updated"],
            has_wiki: false,
            has_issues: false,
            allow_merge_commit: false,
            allow_rebase_merge: true,
            allow_squash_merge: true,
            delete_branch_on_merge: true,
          }
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-lifecycle"]'
      counts: {add: 0, delete: 0}
    state:
      - kind: repo
        name: "{{ p }}-lifecycle"
        match:
          description: "otterdog e2e: repository lifecycle (updated)"
          homepage: "https://example.org/otterdog-e2e/{{ run }}/updated"
          has_issues: false
          allow_merge_commit: false
          allow_rebase_merge: true
          allow_squash_merge: true
          delete_branch_on_merge: true
      - kind: repo_topics
        name: "{{ p }}-lifecycle"
        match: {$unordered: [otterdog-e2e, updated]}

  - name: delete
    plan:
      expect: changes
      contains:
        - '- remove repository[name="{{ p }}-lifecycle"]'
      counts: {add: 0, delete: 1}
    apply: {delete: true}
    state:
      - {kind: repo, name: "{{ p }}-lifecycle", absent: true}
