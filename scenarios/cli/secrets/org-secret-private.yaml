# secrets-variables.org-secret.lifecycle (visibility 'private', paid plans), org_level.
id: cli.org.secret-private
title: Organization secret visible to private repositories (Team and Enterprise plans)
tier: cli
description: |
  The organization secret visibility 'private' (every private and internal repository) exists on the paid plans
  only; on GitHub Free otterdog refuses it at validation ("... which is not available for an organization with free
  plan.", otterdog/models/organization_secret.py:40-57: the offline scenario O-VAL-ORGSECRET-PRIVATE-FREE). On Team
  and Enterprise targets the secret is created public (GitHub's 'all'), changed to 'private' with a forced value
  update (--update-secrets on the apply: values are never compared, the visibility change alone would not resend
  it), read back by the oracle and converges, then removed with apply -d. org_level: unfiltered plans, full
  baseline reset as cleanup.
priority: P2
min_plan: team
org_level: true
tags: [secrets]
steps:
  - name: create
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_ORG_PRIVATE') { value: 'e2e-dummy-{{ run }}' }"
    plan:
      expect: changes
      contains:
        - '+ add org_secret[name="{{ P }}_ORG_PRIVATE"]'
    state:
      - kind: org_secret
        name: "{{ P }}_ORG_PRIVATE"
        match: {visibility: all}

  - name: private
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_ORG_PRIVATE') { value: 'e2e-dummy-{{ run }}', visibility: 'private' }"
    validate:
      ok: true
      not_contains:
        - "which is not available for an organization with free plan"
    plan:
      expect: changes
      contains:
        - '~ org_secret[name="{{ P }}_ORG_PRIVATE"]'
        - '"public" -> "private"'
    apply:
      update_secrets: true
      update_filter: "{{ P }}_ORG_PRIVATE"
      contains:
        - '! org_secret[name="{{ P }}_ORG_PRIVATE"]'
    state:
      - kind: org_secret
        name: "{{ P }}_ORG_PRIVATE"
        match: {name: "{{ P }}_ORG_PRIVATE", visibility: private}

  - name: remove
    plan:
      expect: changes
      contains:
        - '- remove org_secret[name="{{ P }}_ORG_PRIVATE"]'
    apply: {delete: true}
    state:
      - kind: org_secret
        name: "{{ P }}_ORG_PRIVATE"
        absent: true
