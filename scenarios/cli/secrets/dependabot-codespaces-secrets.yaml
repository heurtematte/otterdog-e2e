# secrets-variables.org-dependabot-codespaces-secrets and .repo-dependabot-codespaces-secrets (P1), org_level:
# Dependabot and Codespaces secrets of the organization and of a repository end to end (eclipse-csi/otterdog#890).
id: cli.secrets.dependabot-codespaces
title: Dependabot and Codespaces secrets (organization and repository, visibility, removal)
tier: cli
description: |
  Since #890 (main after v1.7.1) otterdog manages the Dependabot and Codespaces secrets of the organization
  (PUT /orgs/{org}/dependabot|codespaces/secrets/{name}, value encrypted with the public key of that kind, visibility
  public == GitHub 'all', private, selected with repository ids) and of each repository
  (PUT /repos/{org}/{repo}/dependabot|codespaces/secrets/{name}), through otterdog/providers/github/rest/secret_client.py.
  Values are dummies ('e2e-dummy-<run>', warned as without credential provider); GitHub never returns them, so every
  step converges. The organization Dependabot secret then becomes 'selected' for the run repository, and the last
  step removes the four secrets (apply -d) while the repository stays. Every plan of such a SUT also READS these
  secrets (the template defines their functions): the admin token needs the Dependabot and Codespaces secrets
  permissions of the organization and of the repositories (docs/setup-free-org.md), or plan aborts. Older SUTs skip
  it (fixed_in). org_level: unfiltered plans, full baseline reset as cleanup; the janitor sweeps run-named
  organization Dependabot and Codespaces secrets.
priority: P1
org_level: true
fixed_in: 1.8.0
tags: [secrets, repo]
references:
  - pr: 890
    note: >-
      "feat: manage Dependabot and Codespaces secrets": the four secret kinds are created, changed and removed; older
      SUTs have none of the template functions and skip the scenario (fixed_in).
steps:
  - name: create
    fragments:
      extra:
        - "dependabot_secrets: [orgs.newOrgDependabotSecret('{{ P }}_DEP') { value: 'e2e-dummy-{{ run }}' }]"
        - "codespaces_secrets: [orgs.newOrgCodespacesSecret('{{ P }}_CS') { value: 'e2e-dummy-{{ run }}' }]"
      repositories: &secrets_repo
        - |-
          orgs.newRepo('{{ p }}-secrets') {
            description: 'otterdog e2e: Dependabot and Codespaces secrets',
            dependabot_secrets: [orgs.newRepoDependabotSecret('{{ P }}_RDEP') { value: 'e2e-dummy-{{ run }}' }],
            codespaces_secrets: [orgs.newRepoCodespacesSecret('{{ P }}_RCS') { value: 'e2e-dummy-{{ run }}' }],
          }
    validate:
      ok: true
      errors: 0
      warnings_min: 4
      contains:
        - 'Warning: org_dependabot_secret[name="{{ P }}_DEP"] has a value'
        - 'Warning: org_codespaces_secret[name="{{ P }}_CS"] has a value'
        - 'Warning: repo_dependabot_secret[name="{{ P }}_RDEP"'
        - 'Warning: repo_codespaces_secret[name="{{ P }}_RCS"'
    plan:
      expect: changes
      contains:
        - '+ add org_dependabot_secret[name="{{ P }}_DEP"]'
        - '+ add org_codespaces_secret[name="{{ P }}_CS"]'
        - '+ add repository[name="{{ p }}-secrets"]'
        - '+ add repo_dependabot_secret[name="{{ P }}_RDEP", repository={{ p }}-secrets]'
        - '+ add repo_codespaces_secret[name="{{ P }}_RCS", repository={{ p }}-secrets]'
    apply:
      api:
        sent:
          - 'PUT /orgs/{org}/dependabot/secrets/{name}'
          - 'PUT /orgs/{org}/codespaces/secrets/{name}'
          - 'PUT /repos/{owner}/{repo}/dependabot/secrets/{name}'
          - 'PUT /repos/{owner}/{repo}/codespaces/secrets/{name}'
    state:
      - kind: org_dependabot_secret
        name: "{{ P }}_DEP"
        match: {name: "{{ P }}_DEP", visibility: all}
      - kind: org_codespaces_secret
        name: "{{ P }}_CS"
        match: {name: "{{ P }}_CS", visibility: all}
      - kind: repo_dependabot_secret
        repo: "{{ p }}-secrets"
        name: "{{ P }}_RDEP"
        match: {name: "{{ P }}_RDEP"}
      - kind: repo_codespaces_secret
        repo: "{{ p }}-secrets"
        name: "{{ P }}_RCS"
        match: {name: "{{ P }}_RCS"}

  - name: selected
    fragments:
      extra:
        - |-
          dependabot_secrets: [
            orgs.newOrgDependabotSecret('{{ P }}_DEP') {
              value: 'e2e-dummy-{{ run }}',
              visibility: 'selected',
              selected_repositories: ['{{ p }}-secrets'],
            },
          ]
        - "codespaces_secrets: [orgs.newOrgCodespacesSecret('{{ P }}_CS') { value: 'e2e-dummy-{{ run }}' }]"
      repositories: *secrets_repo
    plan:
      expect: changes
      contains:
        - '~ org_dependabot_secret[name="{{ P }}_DEP"]'
        - '"public" -> "selected"'
        - '+ "{{ p }}-secrets"'
      not_contains: ['~ org_codespaces_secret[', '! org_dependabot_secret[']
    apply:
      api:
        sent:
          - 'PUT /orgs/{org}/dependabot/secrets/{name}'
    state:
      - kind: org_dependabot_secret
        name: "{{ P }}_DEP"
        match: {visibility: selected}
      - kind: org_dependabot_secret_repos
        name: "{{ P }}_DEP"
        equals: ["{{ p }}-secrets"]

  - name: remove
    fragments:
      repositories: ["orgs.newRepo('{{ p }}-secrets') { description: 'otterdog e2e: Dependabot and Codespaces secrets' }"]
    plan:
      expect: changes
      contains:
        - '- remove org_dependabot_secret[name="{{ P }}_DEP"]'
        - '- remove org_codespaces_secret[name="{{ P }}_CS"]'
        - '- remove repo_dependabot_secret[name="{{ P }}_RDEP", repository={{ p }}-secrets]'
        - '- remove repo_codespaces_secret[name="{{ P }}_RCS", repository={{ p }}-secrets]'
    apply:
      delete: true
      api:
        sent:
          - 'DELETE /orgs/{org}/dependabot/secrets/{name}'
          - 'DELETE /orgs/{org}/codespaces/secrets/{name}'
          - 'DELETE /repos/{owner}/{repo}/dependabot/secrets/{name}'
          - 'DELETE /repos/{owner}/{repo}/codespaces/secrets/{name}'
    state:
      - {kind: org_dependabot_secret, name: "{{ P }}_DEP", absent: true}
      - {kind: org_codespaces_secret, name: "{{ P }}_CS", absent: true}
      - {kind: repo_dependabot_secret, repo: "{{ p }}-secrets", name: "{{ P }}_RDEP", absent: true}
      - {kind: repo_codespaces_secret, repo: "{{ p }}-secrets", name: "{{ P }}_RCS", absent: true}
