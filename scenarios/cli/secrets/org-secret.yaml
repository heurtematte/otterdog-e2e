# secrets-variables.org-secret.lifecycle (P0), .selected-repositories (P1), .remove (org part) and the secret value
# rules of config.secret-references, org_level: organization secrets end to end.
id: cli.org.secret
title: Organization secrets (values, visibility, selected repositories, forced update, removal)
tier: cli
description: |
  Organization secrets (otterdog/models/organization_secret.py, PUT /orgs/{org}/actions/secrets/{name} with the value
  encrypted with the org public key, otterdog/providers/github/rest/org_client.py:312-384). Values: a plain dummy
  ('e2e-dummy-<run>') and a literal of an unknown provider prefix ('foo:e2e/...') are applied as they are, each with
  the warning "does not use a credential provider"; '********' is a dummy that otterdog skips entirely (Info, never
  added); a 'pass:' reference validates silently (validate only: plan and apply resolve references with the pass
  CLI, which the harness never provides). Visibility: the template's 'public' is GitHub's 'all'; 'selected' with
  selected_repositories (names resolved to ids when applied: the repositories are created in an earlier step, see
  cli.kb.org-secret-same-apply for the same apply), then a second repository in the list, applied with
  --update-secrets (the value is forced, '!'). GitHub never returns values, so values are never compared: every step
  converges. The last step removes the secrets (apply -d). Private visibility needs a paid plan:
  cli.org.secret-private. org_level: unfiltered plans, full baseline reset as cleanup.
priority: P0
org_level: true
tags: [secrets, repo]
steps:
  - name: references
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_ORG_PASS') { value: 'pass:e2e/otterdog-e2e/org-secret' }"
        - "orgs.newOrgSecret('{{ P }}_ORG_FOO') { value: 'foo:e2e/otterdog-e2e/org-secret' }"
    validate:
      ok: true
      errors: 0
      warnings_min: 1
      contains:
        - >-
          Warning: org_secret[name="{{ P }}_ORG_FOO"] has a value 'foo:e2e/otterdog-e2e/org-secret' that does not use
          a credential provider.
      not_contains:
        - 'org_secret[name="{{ P }}_ORG_PASS"] has a value'
    plan: null

  - name: create
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_ORG_SECRET') { value: 'e2e-dummy-{{ run }}' }"
        - "orgs.newOrgSecret('{{ P }}_ORG_FOO') { value: 'foo:e2e/otterdog-e2e/org-secret' }"
        - "orgs.newOrgSecret('{{ P }}_ORG_DUMMY') { value: '********' }"
      repositories: &repos
        - "orgs.newRepo('{{ p }}-sel') { description: 'otterdog e2e: org secret consumer' }"
        - "orgs.newRepo('{{ p }}-sel2') { description: 'otterdog e2e: second org secret consumer' }"
    validate:
      verbose: true
      ok: true
      contains:
        - "Warning: org_secret[name=\"{{ P }}_ORG_SECRET\"] has a value 'e2e-dummy-{{ run }}' that does not use a credential provider."
        - 'Info: org_secret[name="{{ P }}_ORG_DUMMY"] only has a dummy value, resource will be skipped.'
    plan:
      expect: changes
      contains:
        - '+ add org_secret[name="{{ P }}_ORG_SECRET"]'
        - '+ add org_secret[name="{{ P }}_ORG_FOO"]'
        - '+ add repository[name="{{ p }}-sel"]'
        - '+ add repository[name="{{ p }}-sel2"]'
      not_contains:
        - 'org_secret[name="{{ P }}_ORG_DUMMY"] {'
    state:
      - kind: org_secret
        name: "{{ P }}_ORG_SECRET"
        match: {name: "{{ P }}_ORG_SECRET", visibility: all}
      - kind: org_secret
        name: "{{ P }}_ORG_FOO"
        match: {visibility: all}
      - kind: org_secret
        name: "{{ P }}_ORG_DUMMY"
        absent: true

  - name: selected
    fragments:
      secrets:
        - |
          orgs.newOrgSecret('{{ P }}_ORG_SECRET') {
            value: "e2e-dummy-{{ run }}",
            visibility: "selected",
            selected_repositories: ["{{ p }}-sel"],
          }
        - "orgs.newOrgSecret('{{ P }}_ORG_FOO') { value: 'foo:e2e/otterdog-e2e/org-secret' }"
        - "orgs.newOrgSecret('{{ P }}_ORG_DUMMY') { value: '********' }"
      repositories: *repos
    plan:
      expect: changes
      contains:
        - '~ org_secret[name="{{ P }}_ORG_SECRET"]'
        - '"public" -> "selected"'
        - '+ "{{ p }}-sel"'
      not_contains:
        - '~ org_secret[name="{{ P }}_ORG_FOO"]'
        - "! org_secret"
    state:
      - kind: org_secret
        name: "{{ P }}_ORG_SECRET"
        match: {visibility: selected}
      - kind: org_secret_repos
        name: "{{ P }}_ORG_SECRET"
        equals: ["{{ p }}-sel"]

  - name: selected-two
    fragments:
      secrets:
        - |
          orgs.newOrgSecret('{{ P }}_ORG_SECRET') {
            value: "e2e-dummy-{{ run }}",
            visibility: "selected",
            selected_repositories: ["{{ p }}-sel", "{{ p }}-sel2"],
          }
        - "orgs.newOrgSecret('{{ P }}_ORG_FOO') { value: 'foo:e2e/otterdog-e2e/org-secret' }"
        - "orgs.newOrgSecret('{{ P }}_ORG_DUMMY') { value: '********' }"
      repositories: *repos
    plan:
      expect: changes
      contains:
        - '~ org_secret[name="{{ P }}_ORG_SECRET"]'
        - '+ "{{ p }}-sel2"'
      not_contains:
        - "! org_secret"
    apply:
      update_secrets: true
      update_filter: "{{ P }}_ORG_SECRET"
      contains:
        - '! org_secret[name="{{ P }}_ORG_SECRET"]'
      not_contains:
        - '! org_secret[name="{{ P }}_ORG_FOO"]'
    state:
      - kind: org_secret_repos
        name: "{{ P }}_ORG_SECRET"
        match: {$unordered: ["{{ p }}-sel", "{{ p }}-sel2"]}
      - kind: org_secret
        name: "{{ P }}_ORG_FOO"
        match: {visibility: all}

  - name: remove
    fragments:
      secrets:
        - "orgs.newOrgSecret('{{ P }}_ORG_DUMMY') { value: '********' }"
      repositories: *repos
    plan:
      expect: changes
      contains:
        - '- remove org_secret[name="{{ P }}_ORG_SECRET"]'
        - '- remove org_secret[name="{{ P }}_ORG_FOO"]'
      not_contains:
        - 'org_secret[name="{{ P }}_ORG_DUMMY"] {'
    apply: {delete: true}
    state:
      - kind: org_secret
        name: "{{ P }}_ORG_SECRET"
        absent: true
      - kind: org_secret
        name: "{{ P }}_ORG_FOO"
        absent: true
