# Known bug KB-037: the team privacy error lists ('secret' | 'closed'), the accepted values are 'secret' | 'visible'.
id: cli.kb.team-privacy-message
title: Team privacy validation message names the accepted values (known bug KB-037)
tier: cli
description: |
  otterdog accepts a team privacy of 'secret' or 'visible' (GitHub's 'closed'), but the model's validation error for
  any other value says "while only values ('secret' | 'closed') are allowed." (otterdog/models/team.py:77-83), so a
  user who wrote GitHub's 'closed' was told that 'closed' is allowed. Since 1.7.0 (#878) the team schema refuses the
  value while the configuration loads, with the accepted values ("'closed' is not one of ['secret', 'visible']"), so
  the model's message is never printed: the step asserts the accepted values and the absence of the wrong list. It
  carries known_bug KB-037 (fixed in 1.7.0): a regression guard on newer SUTs, an expected failure on older ones. The
  refusal itself (exit code 1) is asserted strictly by cli.validate.teams. Team validation lists the org members, so
  it runs live only; validate only (plan null), nothing is applied.
priority: P2
tags: [teams, known-bug]
steps:
  - name: privacy-message
    known_bug: KB-037
    fragments:
      teams:
        - |
          orgs.newTeam('{{ p }}-t1') {
            description: "otterdog e2e: team validation",
            privacy: "closed",
            members: [],
          }
    validate:
      ok: false
      contains:
        - "'closed' is not one of ['secret', 'visible']"
      not_contains:
        - "('secret' | 'closed')"
    plan: null
