# secrets-variables.env-secret.lifecycle, .env-variable.lifecycle (P2) and secrets-variables.remove (repository part,
# P1): environment secrets and variables, repository secrets and variables, forced updates and removals.
id: cli.environment.secrets
title: Environment and repository secrets and variables (add, change, forced update, remove)
tier: cli
description: |
  A public run repository holding a repository secret and variable, and a deployment environment with an
  environment secret and variable (orgs.newEnvSecret / orgs.newEnvVariable since otterdog 1.4.0; the reference docs
  name them newEnvironmentSecret / newEnvironmentVariable, KB-035). Environment secrets are encrypted with the
  environment's public key (otterdog/providers/github/rest/repo_client.py:775-866); nested objects carry their parent
  in the plan header (env_secret[name=..., environment=<env>]). The 'update' step changes both variables and applies
  with --update-secrets: values are never compared, so both secrets are forced ('!') while the variables are
  ordinary changes. The 'remove' step drops the four objects but keeps the repository and the environment, applied
  with -d (nested removals: '- remove repo_secret[...]', '- remove env_secret[...]', ...), and the oracle sees them
  gone. Secret values are plain dummies (the warning "does not use a credential provider" is expected).
priority: P1
tags: [secrets, variables, environments, repo]
steps:
  - name: create
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-envsec') {
            description: "otterdog e2e: environment secrets and variables",
            secrets: [
              orgs.newRepoSecret('{{ P }}_REPO_SECRET') { value: "e2e-dummy-{{ run }}" },
            ],
            variables: [
              orgs.newRepoVariable('{{ P }}_REPO_VAR') { value: "repo one" },
            ],
            environments: [
              orgs.newEnvironment('{{ p }}-env') {
                secrets: [
                  orgs.newEnvSecret('{{ P }}_ENV_SECRET') { value: "e2e-dummy-{{ run }}" },
                ],
                variables: [
                  orgs.newEnvVariable('{{ P }}_ENV_VAR') { value: "env one" },
                ],
              },
            ],
          }
    validate:
      ok: true
      warnings_min: 2
      contains:
        # validation headers carry no parent (Secret.validate: get_model_header() without the parent object)
        - "Warning: repo_secret[name=\"{{ P }}_REPO_SECRET\"] has a value 'e2e-dummy-{{ run }}' that does not use a credential provider."
        - "Warning: env_secret[name=\"{{ P }}_ENV_SECRET\"] has a value 'e2e-dummy-{{ run }}' that does not use a credential provider."
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-envsec"]'
        - '+ add repo_secret[name="{{ P }}_REPO_SECRET", repository={{ p }}-envsec]'
        - '+ add repo_variable[name="{{ P }}_REPO_VAR", repository={{ p }}-envsec]'
        - '+ add environment[name="{{ p }}-env", repository={{ p }}-envsec]'
        - '+ add env_secret[name="{{ P }}_ENV_SECRET", environment={{ p }}-env]'
        - '+ add env_variable[name="{{ P }}_ENV_VAR", environment={{ p }}-env]'
      counts: {add: 6, change: 0, delete: 0}
    state:
      - kind: repo_secret
        repo: "{{ p }}-envsec"
        name: "{{ P }}_REPO_SECRET"
        match: {name: "{{ P }}_REPO_SECRET"}
      - kind: repo_variable
        repo: "{{ p }}-envsec"
        name: "{{ P }}_REPO_VAR"
        match: {name: "{{ P }}_REPO_VAR", value: repo one}
      - kind: environment
        repo: "{{ p }}-envsec"
        name: "{{ p }}-env"
        match: {name: "{{ p }}-env"}
      - kind: env_secret
        repo: "{{ p }}-envsec"
        env: "{{ p }}-env"
        name: "{{ P }}_ENV_SECRET"
        match: {name: "{{ P }}_ENV_SECRET"}
      - kind: env_variable
        repo: "{{ p }}-envsec"
        env: "{{ p }}-env"
        name: "{{ P }}_ENV_VAR"
        match: {name: "{{ P }}_ENV_VAR", value: env one}

  - name: update
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-envsec') {
            description: "otterdog e2e: environment secrets and variables",
            secrets: [
              orgs.newRepoSecret('{{ P }}_REPO_SECRET') { value: "e2e-dummy-{{ run }}" },
            ],
            variables: [
              orgs.newRepoVariable('{{ P }}_REPO_VAR') { value: "repo two" },
            ],
            environments: [
              orgs.newEnvironment('{{ p }}-env') {
                secrets: [
                  orgs.newEnvSecret('{{ P }}_ENV_SECRET') { value: "e2e-dummy-{{ run }}" },
                ],
                variables: [
                  orgs.newEnvVariable('{{ P }}_ENV_VAR') { value: "env two" },
                ],
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '~ repo_variable[name="{{ P }}_REPO_VAR", repository={{ p }}-envsec]'
        - '~ env_variable[name="{{ P }}_ENV_VAR", environment={{ p }}-env]'
      not_contains:
        - '! repo_secret['
        - '! env_secret['
        - '~ env_secret['
      counts: {add: 0, delete: 0}
    apply:
      update_secrets: true
      contains:
        - '! repo_secret[name="{{ P }}_REPO_SECRET", repository={{ p }}-envsec]'
        - '! env_secret[name="{{ P }}_ENV_SECRET", environment={{ p }}-env]'
    state:
      - kind: repo_variable
        repo: "{{ p }}-envsec"
        name: "{{ P }}_REPO_VAR"
        match: {value: repo two}
      - kind: env_variable
        repo: "{{ p }}-envsec"
        env: "{{ p }}-env"
        name: "{{ P }}_ENV_VAR"
        match: {value: env two}
      - kind: env_secret
        repo: "{{ p }}-envsec"
        env: "{{ p }}-env"
        name: "{{ P }}_ENV_SECRET"
        absent: false

  - name: remove
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-envsec') {
            description: "otterdog e2e: environment secrets and variables",
            environments: [
              orgs.newEnvironment('{{ p }}-env'),
            ],
          }
    plan:
      expect: changes
      contains:
        - '- remove repo_secret[name="{{ P }}_REPO_SECRET", repository={{ p }}-envsec]'
        - '- remove repo_variable[name="{{ P }}_REPO_VAR", repository={{ p }}-envsec]'
        - '- remove env_secret[name="{{ P }}_ENV_SECRET", environment={{ p }}-env]'
        - '- remove env_variable[name="{{ P }}_ENV_VAR", environment={{ p }}-env]'
      not_contains:
        - '- remove environment['
      counts: {add: 0, change: 0, delete: 4}
    apply: {delete: true}
    state:
      - kind: repo_secret
        repo: "{{ p }}-envsec"
        name: "{{ P }}_REPO_SECRET"
        absent: true
      - kind: repo_variable
        repo: "{{ p }}-envsec"
        name: "{{ P }}_REPO_VAR"
        absent: true
      - kind: env_secret
        repo: "{{ p }}-envsec"
        env: "{{ p }}-env"
        name: "{{ P }}_ENV_SECRET"
        absent: true
      - kind: env_variable
        repo: "{{ p }}-envsec"
        env: "{{ p }}-env"
        name: "{{ P }}_ENV_VAR"
        absent: true
      - kind: environment
        repo: "{{ p }}-envsec"
        name: "{{ p }}-env"
        absent: false
