# plan-semantics.patch-order (P1) and known bug KB-022 (secret variant): an org secret selecting a new repository.
id: cli.kb.org-secret-same-apply
title: Org secret selecting a repository created in the same apply (known bug KB-022, secret variant)
tier: cli
description: |
  otterdog generates and applies live patches in a fixed order: roles, teams, settings, org webhooks, org secrets,
  org variables, org rulesets, then repositories (otterdog/models/github_organization.py:526-546; apply.py only moves
  the patches making objects read-only last). An org secret with visibility 'selected' resolves the ids of its
  repositories while its patch is built (otterdog/models/organization_secret.py:85-98 -> GitHubProvider.get_repo_ids,
  a GET per repository), so a repository created by the same apply does not exist yet. The 'same-apply' step adds
  the secret and two repositories in one configuration change and asserts what a user expects: a clean apply and
  the selection on GitHub. The step carries known_bug KB-022 (an expected failure while the bug exists; the bug's
  registry entry lists the variable variant, cli.kb.org-variable-same-apply). The 'retry' step is strict whatever
  happened before: both repositories exist by then, so selecting them works, whether it adds the secret (bug) or
  widens its selection (fixed). Org-level object: org_level (unfiltered plans, full baseline reset as cleanup).
priority: P2
org_level: true
tags: [secrets, repo, known-bug]
steps:
  - name: same-apply
    known_bug: KB-022
    fragments:
      secrets:
        - |
          orgs.newOrgSecret('{{ P }}_SAME_APPLY') {
            value: "e2e-dummy-{{ run }}",
            visibility: "selected",
            selected_repositories: ["{{ p }}-same-secret"],
          }
      repositories: &repos
        - "orgs.newRepo('{{ p }}-same-secret') { description: 'otterdog e2e: org secret and repository in one apply' }"
        - "orgs.newRepo('{{ p }}-same-secret2') { description: 'otterdog e2e: second repository of the same apply' }"
    plan:
      expect: changes
      contains:
        - '+ add org_secret[name="{{ P }}_SAME_APPLY"]'
        - '+ add repository[name="{{ p }}-same-secret"]'
        - '+ add repository[name="{{ p }}-same-secret2"]'
    state:
      - kind: org_secret_repos
        name: "{{ P }}_SAME_APPLY"
        equals: ["{{ p }}-same-secret"]

  - name: retry
    fragments:
      secrets:
        - |
          orgs.newOrgSecret('{{ P }}_SAME_APPLY') {
            value: "e2e-dummy-{{ run }}",
            visibility: "selected",
            selected_repositories: ["{{ p }}-same-secret", "{{ p }}-same-secret2"],
          }
      repositories: *repos
    plan:
      expect: changes
      contains:
        - 'org_secret[name="{{ P }}_SAME_APPLY"] {'
        - '"{{ p }}-same-secret2"'
    state:
      - kind: org_secret
        name: "{{ P }}_SAME_APPLY"
        match: {visibility: selected}
      - kind: org_secret_repos
        name: "{{ P }}_SAME_APPLY"
        match: {$unordered: ["{{ p }}-same-secret", "{{ p }}-same-secret2"]}
