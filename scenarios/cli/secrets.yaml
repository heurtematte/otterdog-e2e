# C-SECRETS (SPEC 19, P0): repository secret (dummy plain value) and variable; --update-secrets forced update.
id: cli.secrets
title: Repository secret and variable (dummy values, --update-secrets)
description: |
  A run repository with a repository secret holding a DUMMY plain value and a repository variable. otterdog applies
  plain secret values as-is and echoes them in validate/plan output (the scenario model only accepts '********' or
  e2e-dummy-<8 chars>; '********' would be skipped entirely by plan and apply, so a plain dummy is used). GitHub never
  returns secret values, so a changed secret value is invisible to plan: the update step also changes the variable
  (a normal change: the plan expects changes and the apply runs) and applies with --update-secrets, which must print
  a forced update ('!') of the secret. The secret value itself cannot be read back; the oracle checks existence.
priority: P0
min_plan: free
tags: [secrets, variables, repo]
steps:
  - name: create
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-secrets') {
            description: "otterdog e2e: secrets and variables",
            secrets: [
              orgs.newRepoSecret('{{ P }}_DUMMY_SECRET') {
                value: "e2e-dummy-{{ run }}",
              },
            ],
            variables: [
              orgs.newRepoVariable('{{ P }}_VARIABLE') {
                value: "first value",
              },
            ],
          }
    validate:
      ok: true
      warnings_min: 1
      contains:
        - "does not use a credential provider"
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-secrets"]'
        - '+ add repo_secret[name="{{ P }}_DUMMY_SECRET", repository={{ p }}-secrets]'
        - '+ add repo_variable[name="{{ P }}_VARIABLE", repository={{ p }}-secrets]'
      counts: {add: 3, change: 0, delete: 0}
    state:
      - kind: repo_secret
        repo: "{{ p }}-secrets"
        name: "{{ P }}_DUMMY_SECRET"
        match: {name: "{{ P }}_DUMMY_SECRET"}
      - kind: repo_variable
        repo: "{{ p }}-secrets"
        name: "{{ P }}_VARIABLE"
        match: {name: "{{ P }}_VARIABLE", value: "first value"}

  - name: update
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-secrets') {
            description: "otterdog e2e: secrets and variables",
            secrets: [
              orgs.newRepoSecret('{{ P }}_DUMMY_SECRET') {
                value: "e2e-dummy-updated1",
              },
            ],
            variables: [
              orgs.newRepoVariable('{{ P }}_VARIABLE') {
                value: "second value",
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '~ repo_variable[name="{{ P }}_VARIABLE", repository={{ p }}-secrets]'
      not_contains:
        - 'repo_secret[name="{{ P }}_DUMMY_SECRET", repository={{ p }}-secrets]'
      counts: {add: 0, delete: 0}
    apply:
      update_secrets: true
      contains:
        - '! repo_secret[name="{{ P }}_DUMMY_SECRET", repository={{ p }}-secrets]'
    state:
      - kind: repo_secret
        repo: "{{ p }}-secrets"
        name: "{{ P }}_DUMMY_SECRET"
        absent: false
      - kind: repo_variable
        repo: "{{ p }}-secrets"
        name: "{{ P }}_VARIABLE"
        match: {value: "second value"}
