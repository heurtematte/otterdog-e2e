# C-NEG-PRIVATE-BPR (SPEC 19, P0): branch protection on a PRIVATE repository (discovery on plans without it).
id: cli.neg.private-bpr
title: Branch protection rule on a private repository (discovery without the capability)
description: |
  A private run repository with a branch protection rule on main. With Cap.PRIVATE_REPO_BRANCH_PROTECTION (Team,
  Enterprise) the rule must be created, read back by the oracle and converge. Without it (GitHub Free) this is a
  DISCOVERY scenario (GH-06): GitHub rejects or ignores protection on private repositories of Free orgs, and
  otterdog treats GraphQL errors returned with HTTP 200 as success (graphql.py), so the apply outcome is recorded
  ('expect: any', observe) and neither state nor convergence is asserted. Document the observed behaviour in
  docs/capability-matrix.md before turning it into a strict assertion. Private repos of the example template need
  allow_forking false (the template disables members_can_fork_private_repositories: validation error otherwise)
  and has_wiki false (warning on Free): the helper e2e.privateRepo of the library scenarios/lib/e2e.libsonnet sets
  both (example of a library used by an inline fragment, docs/writing-scenarios.md).
  The repository is created PUBLIC in a first step and made private by the next one: otterdog before 1.7.0.dev14
  cannot create a private repository on an organization without Code Security (the code scanning default setup
  PATCH of new repositories fails, #791; regression.791-731-private-repo covers that path).
priority: P0
min_plan: free
tags: [bpr, repo, discovery, private]
expect_failure_without: [private_repo_branch_protection]
observe: true
libraries:
  e2e: ../lib/e2e.libsonnet
steps:
  - name: public
    fragments:
      repositories:
        - |
          e2e.publicRepo('{{ p }}-priv-bpr', 'otterdog e2e: branch protection on a private repository') {
            has_wiki: false,
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-priv-bpr"]'
      counts: {add: 1, delete: 0}
    state:
      - kind: repo
        name: "{{ p }}-priv-bpr"
        match: {private: false}

  - name: create
    fragments:
      repositories:
        - |
          e2e.privateRepo('{{ p }}-priv-bpr', 'otterdog e2e: branch protection on a private repository') {
            branch_protection_rules: [
              orgs.newBranchProtectionRule('main') {
                required_approving_review_count: 1,
              },
            ],
          }
    plan:
      expect: changes
      contains:
        - '~ repository[name="{{ p }}-priv-bpr"]'
        - '+ add branch_protection_rule[pattern="main", repository={{ p }}-priv-bpr]'
      not_contains:
        - '+ add repository[name="{{ p }}-priv-bpr"]'
    state:
      - kind: repo
        name: "{{ p }}-priv-bpr"
        match: {private: true}
      - kind: bpr
        repo: "{{ p }}-priv-bpr"
        pattern: main
        match: {pattern: main, requiresApprovingReviews: true, requiredApprovingReviewCount: 1}
    on_missing_capability:
      apply: {expect: any}
      state: []
      converge: false
