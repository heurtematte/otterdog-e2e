# C-ORG-VARIABLE (SPEC 19, P1, org_level): organization variable shared with selected repositories.
id: cli.org.variable
title: Organization variable with selected repositories
description: |
  An organization variable (run-prefixed name) visible to a selected run repository. The repository is created in a
  first step on purpose: otterdog applies org secrets/variables BEFORE repositories, so a variable that selects a
  repository created by the same apply cannot resolve its id (see known bug KB-022, scenario
  cli.kb.org-variable-same-apply). The oracle checks the variable (GET .../actions/variables/{name}) and its selected
  repositories (GH-07: GET .../variables/{name}/repositories). The update step changes the value and widens the
  visibility to all repositories (otterdog 'public' == GitHub 'all'). Org-level object: the scenario is org_level, so
  its plans are not filtered with -r and its cleanup is a full baseline reset.
  Every HTTP verb of the variable is asserted (apply.api): POST on creation, PUT .../repositories when the selection
  grows while the visibility stays 'selected' (org_client.py update_variable sends it only then), PATCH on the value
  change, and DELETE in the remove step, applied by the SUT with -d (the cleanup reset runs another CLI).
priority: P1
min_plan: free
org_level: true
tags: [variables, repo]
steps:
  - name: repo
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-orgvar') {
            description: "otterdog e2e: org variable consumer",
          }
    plan:
      expect: changes
      contains:
        - '+ add repository[name="{{ p }}-orgvar"]'
    state:
      - {kind: repo, name: "{{ p }}-orgvar", match: {name: "{{ p }}-orgvar"}}

  - name: variable
    fragments:
      variables:
        - |
          orgs.newOrgVariable('{{ P }}_ORG_VARIABLE') {
            value: "org value one",
            visibility: "selected",
            selected_repositories: ["{{ p }}-orgvar"],
          }
      repositories: &repos
        - |
          orgs.newRepo('{{ p }}-orgvar') {
            description: "otterdog e2e: org variable consumer",
          }
        - |
          orgs.newRepo('{{ p }}-orgvar2') {
            description: "otterdog e2e: second org variable consumer",
          }
    plan:
      expect: changes
      contains:
        - '+ add org_variable[name="{{ P }}_ORG_VARIABLE"]'
        - '+ add repository[name="{{ p }}-orgvar2"]'
    apply:
      api:
        sent:
          - 'POST /orgs/{org}/actions/variables'
    state:
      - kind: org_variable
        name: "{{ P }}_ORG_VARIABLE"
        match: {name: "{{ P }}_ORG_VARIABLE", value: "org value one", visibility: selected}
      - kind: org_variable_repos
        name: "{{ P }}_ORG_VARIABLE"
        equals: ["{{ p }}-orgvar"]

  - name: selected-two
    fragments:
      variables:
        - |
          orgs.newOrgVariable('{{ P }}_ORG_VARIABLE') {
            value: "org value one",
            visibility: "selected",
            selected_repositories: ["{{ p }}-orgvar", "{{ p }}-orgvar2"],
          }
      repositories: *repos
    plan:
      expect: changes
      contains:
        - '~ org_variable[name="{{ P }}_ORG_VARIABLE"]'
        - '+ "{{ p }}-orgvar2"'
    apply:
      api:
        sent:
          - 'PUT /orgs/{org}/actions/variables/{name}/repositories'
    state:
      - kind: org_variable_repos
        name: "{{ P }}_ORG_VARIABLE"
        match: {$unordered: ["{{ p }}-orgvar", "{{ p }}-orgvar2"]}

  - name: update
    fragments:
      variables:
        - |
          orgs.newOrgVariable('{{ P }}_ORG_VARIABLE') {
            value: "org value two",
            visibility: "public",
          }
      repositories: *repos
    plan:
      expect: changes
      contains:
        - '~ org_variable[name="{{ P }}_ORG_VARIABLE"]'
    apply:
      api:
        sent:
          - 'PATCH /orgs/{org}/actions/variables/{name}'
    state:
      - kind: org_variable
        name: "{{ P }}_ORG_VARIABLE"
        match: {value: "org value two", visibility: all}

  - name: remove
    fragments:
      repositories: *repos
    plan:
      expect: changes
      contains:
        - '- remove org_variable[name="{{ P }}_ORG_VARIABLE"]'
      counts: {add: 0, change: 0, delete: 1}
    apply:
      delete: true
      api:
        sent:
          - 'DELETE /orgs/{org}/actions/variables/{name}'
    state:
      - {kind: org_variable, name: "{{ P }}_ORG_VARIABLE", absent: true}
