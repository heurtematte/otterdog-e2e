# Regression #790 (merged as 9bdeb75, after v1.6.1): repo ruleset status checks without 'strict' fail validation.
id: regression.790-repo-ruleset-without-strict
title: "#790: repository ruleset status checks without 'strict' are a validation error"
description: |
  PR https://github.com/eclipse-csi/otterdog/pull/790 ("fix: validate required status checks of rulesets") makes
  Ruleset.validate call StatusCheckSettings.validate (otterdog/models/ruleset.py:123-136 and :454-455): a ruleset
  literal that is not based on orgs.newRepoRuleset and sets required_status_checks without 'strict' now fails
  validation with "has not set required parameter 'required_status_checks.strict'.".
  Known-bad: b5f7bb1 (9bdeb75^1, #791) and v1.6.1 - validation passed, plan showed '1 to add' and apply failed with
  "Error for key strict_required_status_checks_policy: 'strict'" (jsonbender), leaving nothing created.
  Validation only: nothing is applied. The org-ruleset variant crashes instead (KB-008, scenario
  enterprise.org-ruleset.790-missing-strict).
  Not released yet: 9bdeb75 is otterdog 1.7.0.dev15 (v1.6.1 + 15 commits), so
  fixed_in skips the scenario on older SUTs such as release:latest (ScenarioEngine.skip_reason).
priority: P1
min_plan: free
fixed_in: "1.7.0.dev15"
tags: [rulesets, repo, regression, pr-790]
steps:
  - name: validate
    fragments:
      repositories:
        - |
          orgs.newRepo('{{ p }}-r790') {
            description: "otterdog e2e: #790 ruleset without strict",
            rulesets: [
              {
                name: "{{ p }}-r790-no-strict",
                enforcement: "active",
                target: "branch",
                include_refs: ["~DEFAULT_BRANCH"],
                exclude_refs: [],
                bypass_actors: [],
                allows_creations: false,
                allows_deletions: false,
                allows_updates: true,
                allows_force_pushes: false,
                requires_commit_signatures: false,
                requires_linear_history: false,
                requires_deployments: false,
                required_deployment_environments: [],
                required_pull_request: null,
                required_merge_queue: null,
                required_status_checks+: {
                  status_checks+: ["e2e-ci"],
                },
              },
            ],
          }
    validate:
      ok: false
      errors: 1
      contains:
        - "has not set required parameter 'required_status_checks.strict'"
    plan:
      expect: validation_error
    apply: null
    converge: false
