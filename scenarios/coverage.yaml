  - id: teams.team-sync
    area: teams
    title: "team_sync (orgs.newTeamSync: id, name, description): identity provider groups connected to a team through team synchronization, identified by their id; at most 5 groups, no duplicate id, exclusive with external_group_id, and no members for a team managed by an identity provider (#911, eb8dca5, in v1.8.0)"
    source: ["otterdog/models/team_sync.py:25-36", "otterdog/models/team.py:95-190", "otterdog/providers/github/rest/team_client.py:209-238"]
