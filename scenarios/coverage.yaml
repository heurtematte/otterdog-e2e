# Coverage matrix of otterdog's features against the e2e battery (machine-readable source).
#
# docs/coverage-matrix.md is generated from this file: after editing it run
#   .venv/bin/python tests/unit/test_coverage_matrix.py --write
# tests/unit/test_coverage_matrix.py validates the schema, checks that every covered_by item exists (scenario ids of
# scenarios/{offline,cli,enterprise}, pytest node ids of tests/<tier>/), that every property of the
# example template (tests/unit/data/template, = otterdog examples/template @9bdeb75) and every inventory key (CLI
# commands, webhook events, comment commands, tasks, endpoints, pages, blueprint/policy types, markers, statuses,
# receiver checks) belongs to a feature, and that the generated documentation is up to date.
#
# Feature fields:
#   id           stable dotted id (rename only together with every reference)
#   area         one of `areas`
#   title        one line
#   source       otterdog paths at main 9bdeb75 (path:line or path:line-line; "ws:" = a local branch of the maintainer)
#   model        with `properties`: the template model whose keys the feature groups (exhaustiveness check)
#   inventory    '<kind>:<value>' keys of EXPECTED_INVENTORY in the test
#   operations   what has to be exercised (`operations` vocabulary)
#   min_plan     lowest GitHub plan of the test org that can exercise it (free | team | enterprise)
#   tier         where it is (or must be) tested (`tiers` vocabulary)
#   ui_only      true for settings only readable/writable through otterdog's web-UI login (Playwright)
#   priority     P0 core everyday usage (Eclipse otterdog-configs frequency counts), P1, P2
#   status       covered (an existing scenario or test exercises it with assertions) | partial | gap
#   covered_by   scenario ids and pytest node ids (never tests/unit: they test the harness)
#   known_bugs   KB-nnn of scenarios/known_bugs.yaml involved
#   findings     F-nn of `findings` (defects found while building this inventory)
#   notes        verified behaviour, caveats
#   gap_outline  partial/gap only: suggested scenario id and file, steps, assertions, needs (fixtures, capabilities,
#                identities, harness changes); a need starting with "available:" names the harness API, YAML key, fixture
#                or check kind that provides it (docs/battery-guide.md), the other harness needs ("harness:",
#                "runner:", "TemplatePublisher ...") are still missing
#
# Behaviours marked "verified offline" were reproduced with the offline CLI otterdog 1.7.0.dev19 (main 9bdeb75 +
# workspace deps), `validate|local-plan --local -v`, COLUMNS=4096, NO_COLOR=1, `unshare -rn`: the quoted messages are
# exact. Offline scenarios run `validate --local` WITHOUT -v (Info messages are hidden) unless a step sets
# `validate: {verbose: true}`; the offline loader refuses teams, and code_scanning_default_languages unless
# code_scanning_default_setup_enabled is false beside them (they call GitHub).
schema_version: 1
title: otterdog feature coverage of the e2e battery
description: >-
  Inventory of otterdog main @9bdeb75 (after v1.6.1; release:latest is v1.6.1): every CLI command and its flags, every
  property of the configuration model grouped by feature, validation rules, diff semantics, the webapp (webhook
  events, comment commands, tasks, auto-merge, apply, blueprints, policies, /api and /internal), the webhook receiver
  contract and notable CHANGELOG fixes, mapped to the existing scenarios and tests of this repository. Gaps and partial
  coverage carry the outline of the missing test.
otterdog:
  repository: eclipse-csi/otterdog
  ref: 9bdeb75f3e82a6cbd107d6bc3c9ec90392475c08
  release: v1.6.1
  offline_probe: otterdog 1.7.0.dev19 (offline CLI of the research notes)

areas:
  - {id: cli, title: CLI commands and global options}
  - {id: config, title: "otterdog.json, base template and credentials"}
  - {id: validation, title: Validation rules}
  - {id: plan-semantics, title: Diff engine and plan semantics}
  - {id: org-settings, title: Organization settings}
  - {id: org-workflows, title: Organization Actions settings}
  - {id: custom-properties, title: Organization custom properties}
  - {id: org-roles, title: Custom organization roles}
  - {id: teams, title: Teams}
  - {id: webhooks, title: Managed organization and repository webhooks}
  - {id: secrets-variables, title: "Secrets and variables (organization, repository, environment)"}
  - {id: repositories, title: Repositories}
  - {id: repo-workflows, title: Repository Actions settings}
  - {id: branch-protection, title: Branch protection rules}
  - {id: rulesets, title: Repository and organization rulesets}
  - {id: environments, title: Deployment environments}
  - {id: receiver, title: Webhook receiver contract}
  - {id: webapp-events, title: Webapp webhook event routing}
  - {id: webapp-commands, title: Pull request comment commands}
  - {id: webapp-pr, title: "Pull request validation, sync check and apply"}
  - {id: webapp-automerge, title: Auto-merge eligibility and merge}
  - {id: webapp-runtime, title: "Webapp boot, init, API and pages"}
  - {id: blueprints, title: Blueprints}
  - {id: policies, title: Policies}
  - {id: regressions, title: CHANGELOG fixes (regression guards)}
  - {id: pending, title: Unmerged otterdog changes (pull requests and local branches)}

tiers:
  offline: "no GitHub: validate, local-plan, show --local with the vendored template (tests/offline, scenarios/offline); the webapp container with dummy credentials"
  cli: "live CLI against the test organization: plan -n, apply -f -n, oracle checks, converge (tests/cli, scenarios/cli, regressions included)"
  webhooks: "otterdog-managed hooks and real App deliveries through the relay (tests/webhooks)"
  webapp: "the webapp under test in docker compose, GitHub App, config-repository pull requests (tests/webapp)"
  web_ui: "otterdog's own web-UI login (bot username, password, TOTP, Playwright Firefox): tests/web_ui, gated by --e2e-allow-web-ui and the admin web credentials (trusted SUTs only)"
  enterprise: "a GitHub Enterprise Cloud target (tests/enterprise, scenarios/enterprise)"

operations:
  add: "create the object or setting (plan '+ add', apply ADD)"
  modify: "change an existing object (plan '~', apply CHANGE)"
  remove: "delete it (plan '- remove', apply -d)"
  rename: "rename or re-key through aliases"
  archive: "behaviour with archived repositories"
  converge: "a plan after the apply is a no-op (the live read-back maps to the configuration)"
  import: "import round trip (live -> jsonnet -> no-op plan)"
  validate: "validation errors, warnings or infos"
  plan: "plan / local-plan rendering and counters"
  coerce: "values ignored or rewritten because of other settings (UNSET semantics)"
  forced-update: "'!' updates forced by --update-secrets / --update-webhooks"
  filter: "repository filter (-r) or update filter (--update-filter)"
  run: "command execution and its output"
  exit-code: "process exit status semantics"
  prompt: "interactive approval on stdin"
  error: "error handling and error messages"
  config: "configuration loading"
  event: "webhook event routing"
  task: "background task behaviour"
  comment: "bot comment content and minimization"
  status: "commit status contexts and descriptions"
  permission: "authorization and eligibility checks"
  api: "HTTP endpoint contract"
  state: "webapp database state"
  security: "signatures, import confinement, secret handling"

