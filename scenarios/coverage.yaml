# Defects found while building this inventory, registered in scenarios/known_bugs.yaml as KB-028 (F-01) to KB-040
# (F-13); docs/known-issues.md holds their reproductions.
findings:
  - id: F-01
    title: "Organization variables are never validated: lowercase or GITHUB_ names, invalid visibility and 'private' on a free plan all pass"
    source: ["otterdog/models/github_organization.py:196-264", "otterdog/models/organization_variable.py:40-63", "otterdog/models/variable.py:29-42"]
    verified: "offline: validate --local of newOrgVariable('lower_case') {visibility: 'private'} and newOrgVariable('GITHUB_X') {visibility: 'nonsense', selected_repositories: ['a']} with plan free prints 'Validation succeeded' (exit 0); the same org secret errors"
    suggestion: "registered as KB-028 (confirmed); offline scenario expecting the 4 errors (non-strict xfail of KB-028 until fixed); docs/capability-matrix.md now states that the variable check is never called"
  - id: F-02
    title: "An invalid workflows.allowed_actions crashes validation with a KeyError as soon as a repository exists (org 'some' -> \"Error: 'some'\", repo 'x' -> \"Error: 'x'\", exit 2)"
    source: ["otterdog/models/workflow_settings.py:94-113", "otterdog/models/repo_workflow_settings.py:56-57", "otterdog/models/repo_workflow_settings.py:99-105"]
    verified: "offline: settings workflows+ {allowed_actions: 'some'} with orgs.newRepo('r1') exits 2 printing \"Error: 'some'\"; without repositories the documented ERROR \"settings has 'workflows.allowed_actions' of value 'some', ...\" is printed (exit 1)"
    suggestion: "registered as KB-029 (confirmed); offline scenario expecting the documented error with a repository present (xfail KB-029)"
  - id: F-03
    title: "A required custom property without default_value crashes loading ('unexpected None value', exit 2) when any repository exists, before the validation error can be reported"
    source: ["otterdog/models/repository.py:296-303", "otterdog/models/github_organization.py:349-351", "otterdog/models/custom_property.py:83-90"]
    verified: "offline: newCustomProperty('p') {required: true, default_value: null} plus orgs.newRepo('r1') -> 'Error: unexpected None value' exit 2; without a repository: custom_property[name=\"p\"] has 'required' set to 'true', but no property 'default_value' is specified."
    suggestion: "registered as KB-030 (confirmed); offline scenario with a repository expecting the validation error (xfail KB-030)"
  - id: F-04
    title: "Missing required keys of required_pull_request and required_merge_queue are never reported (keys() skips UNSET), unlike required_status_checks since #790"
    source: ["otterdog/models/ruleset.py:57-65", "otterdog/models/ruleset.py:240-248", "otterdog/models/__init__.py:677-684", "otterdog/models/ruleset.py:128-136"]
    verified: "offline: a repo ruleset with required_pull_request: {requires_code_owner_review: true} (no required_approving_review_count) and one with required_merge_queue: {merge_method: 'MERGE'} validate ('Validation succeeded'); the apply payload built by RepositoryRuleset.to_provider_data carries UNSET in the pull request rule (json.dumps: TypeError) and raises BendingException for the merge queue, and the apply loop only catches RuntimeError"
    suggestion: "registered as KB-031 (confirmed); offline scenario expecting \"has not set required parameter 'required_pull_request.required_approving_review_count'\" (xfail KB-031); a live apply crashes before its request"
  - id: F-05
    title: "The team_permissions validation error is unreachable: the schema rejects other values first (uncaught jsonschema error, exit 2), including the uppercase READ/WRITE the model accepts"
    source: ["otterdog/models/repository.py:491-499", "otterdog/models/repository.py:194-205", "otterdog/resources/schemas/team-permission.json:1-11"]
    verified: "offline: team_permissions {t: 'super'} -> \"Error: 'super' is not one of ['pull', 'triage', 'push', 'maintain', 'admin']\" with the schema dump, exit 2; the model message \"invalid permission ... allowed values are ('read/pull' | ...)\" never prints"
    suggestion: "registered as KB-032 (confirmed, low): report the schema error as a validation error or drop the dead check"
  - id: F-06
    title: "Documented repository warnings and errors never fire because repositories are coerced at load (has_projects, web_commit_signoff_required, has_discussions source, gh_pages_visibility below enterprise)"
    source: ["otterdog/models/github_organization.py:349-351", "otterdog/models/repository.py:284-316", "otterdog/models/repository.py:436-465", "otterdog/models/repository.py:583-600"]
    verified: "offline: has_projects true with org has_organization_projects false, web_commit_signoff_required false with the template's org default true, has_discussions false on the org discussion source repo and gh_pages_visibility 'private' on free all print 'Validation succeeded'"
    suggestion: "registered as KB-033 (confirmed, low, docs): validate before coercion or remove the messages; regression scenario documenting the current behaviour"
  - id: F-07
    title: "validate/plan exit with the number of validation errors, so two errors exit 2 like an uncaught exception"
    source: ["otterdog/operations/validate.py:59-102", "otterdog/operations/plan.py:121-139", "otterdog/cli.py:999-1001"]
    verified: "offline: a repository with an invalid squash_merge_commit_title gets 2 errors and validate exits 2; 256 repositories with an invalid topic exit 0 (validate and local-plan: the exit status is the error count modulo 256)"
    suggestion: "registered as KB-034 (confirmed, design): exit 1 on validation errors, keep 2 for crashes; harness checks must never read exit 2 as a crash without the output"
  - id: F-08
    title: "Docs show orgs.newEnvironmentSecret/newEnvironmentVariable, the template functions are newEnvSecret/newEnvVariable"
    source: ["docs/reference/organization/repository/environment/index.md:45-52", "examples/template/otterdog-defaults.libsonnet:288-292"]
    verified: "offline: orgs.newEnvironmentSecret('X') -> 'failed to load configuration: failed to evaluate jsonnet file: no such field: newEnvironmentSecret' (exit 1)"
    suggestion: "registered as KB-035 (confirmed): docs fix upstream; nothing to test beyond the load error"
  - id: F-09
    title: "The template comment of deployment_branch_policy lists 'all, protected_branches, branch_policies' while validation accepts 'all' | 'protected' | 'selected'"
    source: ["examples/template/otterdog-defaults.libsonnet:281-282", "otterdog/models/environment.py:128-135"]
    verified: "offline: deployment_branch_policy 'protected_branches' -> \"... has 'deployment_branch_policy' of value 'protected_branches', while only values ('all' | 'protected' | 'selected') are allowed.\""
    suggestion: "registered as KB-036 (confirmed): template comment fix upstream"
  - id: F-10
    title: "The team privacy error says ('secret' | 'closed') although the accepted values are 'secret' | 'visible'"
    source: ["otterdog/models/team.py:77-83"]
    verified: "offline, with the member listing of the team validation (its only GitHub read) replaced by a constant: privacy 'closed' -> \"... has 'privacy' of value 'closed', while only values ('secret' | 'closed') are allowed.\""
    suggestion: "registered as KB-037 (confirmed): message fix upstream; the live validation scenario must match the current wording"
  - id: F-11
    title: "Two validation messages print Python sets, their value order changes from run to run (fork_pr_approval_policy values, code scanning languages)"
    source: ["otterdog/models/workflow_settings.py:143-150", "otterdog/models/repository.py:611-618", "otterdog/models/repository.py:731-732"]
    verified: "offline: \"... while only values {'first_time_contributors', 'first_time_contributors_new_to_github', 'all_external_contributors'} are allowed.\" and the language list in arbitrary order"
    suggestion: "registered as KB-038 (confirmed, reproduced with PYTHONHASHSEED=1 and 2): scenarios assert only the stable prefix of these messages; upstream could sort the values"
  - id: F-12
    title: "An unknown role in ruleset bypass_actors ('#Admin') passes validation; the apply then crashes with an uncaught KeyError"
    source: ["otterdog/models/ruleset.py:648-654", "otterdog/models/ruleset.py:360-361"]
    verified: "offline: validate of a repo ruleset with bypass_actors ['#Admin'] succeeds; the apply payload (RepositoryRuleset.to_provider_data) raises KeyError 'Admin', which the apply loop does not catch (RuntimeError only)"
    suggestion: "registered as KB-039 (confirmed): validate bypass actors; offline validate scenario plus a live apply check (xfail KB-039)"
  - id: F-13
    title: "A crashing sync check sets the sync status to 'failure' with the description 'otterdog detected out of sync changes, but they will not prevent a successful merge': misleading for an error, and a required sync context then blocks the merge"
    source: ["otterdog/webapp/tasks/check_sync.py:135-139", "otterdog/webapp/tasks/check_sync.py:225-234"]
    verified: "offline, in the webapp image of 9bdeb75 (network none, GitHub REST and MongoDB replaced by recorders): an exception of the sync plan posts 'failure' with that description; the out-of-sync result posts 'success'"
    suggestion: "registered as KB-040 (confirmed): describe the error ('sync check failed, contact an admin') or keep the state success like the out-of-sync case; webapp-pr.sync-failure records the current behaviour"

