      needs: [target, "available: WorkspaceLayout(defaults_override={'github': {'exclude_teams': [...]}}), Mutator.create_team and oracle.team (cli.team.exclude-pattern)", "available: LiveConfig.write(suffix='-BASE') and the local-apply calls of tests/cli/test_commands_local_apply.py", "an otterdog release >= 1.8.0"]

