      steps:
        - "a merge_queue rule on main of the config repository, a validated PR adding a run repository enqueued by the admin and merged by the queue"
      assertions:
        - "webapps with #904: the ApplyChangesTask of the PR fails, its log naming 'unable to determine base of merged pull request, no merge of a pull request into branch 'main' up to commit '<merge sha>' found in the activity of repo '<org>/<config repo>'', no apply comment, the run repository is not created"
      needs: [target, webapp, "target: merge queues on the config repository (a public repository, or the enterprise plan for a private one)", "harness: enqueue a pull request (GraphQL enqueuePullRequest) and wait for the merge of the queue", "an otterdog release >= 1.8.0"]
    verified_on:
      - {target: "webapp", sut: "main-fa01483", run: "tp2fya79", date: "2026-11-25"}

  - id: regression.905-excluded-teams-local-operations
    area: regressions
    title: "#905 (62ac2a4, in v1.8.0): local-plan and local-apply (the webapp's validation and apply) drop from the base configuration the teams whose slug matches defaults.github.exclude_teams and that the configuration no longer declares, so removing such a team plans no deletion; a local apply finds the slug of a removed team from its name; updating or deleting a team missing on GitHub fails with 'failed to find team with name ...'"
    source: ["otterdog/models/github_organization.py:176-218", "otterdog/operations/local_plan.py:86-91", "otterdog/operations/local_apply.py:91-95", "otterdog/providers/github/__init__.py:326-343", "otterdog/models/team.py:367-369"]
    operations: [plan, remove, error]
