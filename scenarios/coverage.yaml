    ui_only: false
    priority: P1
    status: gap
    covered_by: []
    notes: "cli.team.exclude-pattern (tests/cli/test_org_config.py::test_excluded_teams_are_neither_loaded_nor_configurable) covers the live plan, import and validation, which #905 does not change (an excluded team is never loaded from GitHub; declaring one is the error \"... which is not allowed due to exclusion pattern '<pattern>'.\"). No item runs local-plan or local-apply with exclude_teams, nor removes a team with local-apply (cli.local-apply removes a repository only). Upstream: before #905 the base configuration kept an excluded team, so a configuration dropping it (as its validation requires) planned '- remove team[...]', and every team removal of a local apply failed, a team of a configuration having no slug. Unit-tested upstream (tests/models/test_team.py, tests/operations/test_diff_operations.py)."
