    source: ["otterdog/cli.py:171-176", "otterdog/__init__.py:9-11"]
    operations: [run]
    min_plan: free
    tier: offline
    ui_only: false
    priority: P0
    status: covered
    covered_by: [tests/offline/test_cli_basics.py::test_version_is_the_resolved_sut_version, tests/cli/test_smoke.py::test_version]

  - id: cli.help
    area: cli
    title: "--help lists the 29 subcommands; no subcommand or an unknown option is a click usage error (exit 2)"
    source: ["otterdog/cli.py:28", "otterdog/cli.py:171-176", "otterdog/cli.py:179-969"]
    operations: [run, exit-code]
    min_plan: free
    tier: offline
    ui_only: false
    priority: P2
    status: covered
    covered_by: [tests/offline/test_cli_basics.py::test_help_lists_every_command, tests/offline/test_cli_basics.py::test_command_help_lists_the_shared_options, tests/offline/test_cli_basics.py::test_usage_errors_exit_2]
    notes: "--help/-h list the 29 inventoried commands (an unknown extra command only warns), validate --help the shared options; otterdog alone, an unknown option, an unknown command and open-pr without -a exit 2 with the click usage on stderr before any config load (v1.6.1 and 9bdeb75)"

  - id: cli.global.organizations
    area: cli
    title: "ORGANIZATIONS positional: project name or github_id (case-insensitive), none = every non-archived org, exit code = max over orgs"
    source: ["otterdog/cli.py:100", "otterdog/cli.py:972-1001", "otterdog/config.py:340-362"]
    operations: [run, exit-code, config]
    min_plan: free
    tier: offline
    ui_only: false
    priority: P2
    status: covered
    covered_by: [tests/offline/test_config_loading.py::test_organizations_positional]
    notes: "First org 1 error, second valid: no positional processes both in config order and exits 1 (largest, not the last org's 0); github_id and project name match case-insensitively; positionals keep their order; 'nope' exits 2 before any header"

  - id: cli.global.local-mode
    area: cli
    title: "--local uses the vendored template without cloning; a missing vendor file fails with \"template file '<f>' does not exist\" (exit 2)"
    source: ["otterdog/cli.py:89-98", "otterdog/jsonnet.py:98-110"]
    operations: [config, error]
    min_plan: free
    tier: offline
    ui_only: false
    priority: P1
    status: covered
    covered_by: [O-VAL-OK, O-LPLAN-ADD, tests/offline/test_config_loading.py::test_local_mode_needs_the_vendored_template]
    notes: "Missing vendor file: validate and show exit 2 (\"template file '...' does not exist\", before the project header), local-plan exits 1 ('planning aborted: template file ...'); vendoring fixes it"

  - id: cli.global.verbosity
    area: cli
    title: "-v shows Info messages (otherwise 'in order to print validation infos, enable printing info messages by adding '-v' flag.'); -vv adds tracebacks"
    source: ["otterdog/cli.py:73-78", "otterdog/logging.py:57-97", "otterdog/operations/validate.py:95-100", "otterdog/operations/diff_operation.py:241-246"]
    operations: [run]
    min_plan: free
    tier: offline
    ui_only: false
    priority: P2
    status: covered
    covered_by: [O-VAL-INFOS, tests/offline/test_cli_exit_codes.py::test_verbosity_levels, tests/offline/test_cli_exit_codes.py::test_debug_verbosity_prints_the_traceback]
    notes: "level 0: Info messages only counted (validate hint, local-plan 'there have been 1 validation infos'); -v: the Info boxes (validate and local-plan, O-VAL-INFOS); -vv: DEBUG lines and the rich traceback of an escaped exception on stderr instead of the Error box; -vvv: TRACE lines."

  - id: cli.global.exit-codes
    area: cli
    title: "Uncaught exceptions and config load errors exit 2 ('Error: <message>', traceback on stderr only with -vv)"
    source: ["otterdog/cli.py:102-117", "otterdog/cli.py:999-1001", "otterdog/logging.py:116-143"]
    operations: [exit-code, error]
    min_plan: free
    tier: offline
    ui_only: false
    priority: P1
    status: covered
    covered_by: [O-VAL-SYNTAX, tests/offline/test_cli_exit_codes.py::test_validation_outcomes_set_the_exit_status, tests/offline/test_cli_exit_codes.py::test_load_errors_and_crashes, tests/offline/test_cli_exit_codes.py::test_debug_verbosity_prints_the_traceback, tests/offline/test_cli_exit_codes.py::test_local_plan_exit_status, tests/offline/test_cli_exit_codes.py::test_validation_errors_never_exit_like_a_crash, tests/offline/test_cli_exit_codes.py::test_secret_reference_with_colons_validates]
