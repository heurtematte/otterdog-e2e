  - {id: org-variable, constructor: newOrgVariable, source: "otterdog/models/organization_variable.py:27-34"}
  - {id: repo-secret, constructor: newRepoSecret, source: "otterdog/models/repo_secret.py:24-31"}
  - {id: repo-variable, constructor: newRepoVariable, source: "otterdog/models/repo_variable.py:24-31"}
