    area: cli
    title: "validate: 'Validating organization configurations:', per-org header, 'Validation succeeded' / \"Validation succeeded': i info(s), w warning(s), 0 error(s)\" / 'Validation failed: ...'"
    source: ["otterdog/cli.py:179-186", "otterdog/operations/validate.py:43-104"]
