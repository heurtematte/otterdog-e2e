# Known otterdog defects (SPEC 12.5), mirrored and explained in docs/known-issues.md.
#
# Evidence paths are relative to the otterdog repository at main 9bdeb75 (after v1.6.1) unless prefixed: "chart:" =
# Helm chart otterdog-1.5.4 (eclipse-csi/helm-charts), "openapi:" = GitHub REST OpenAPI description (api.github.com),
# "e2e:" = a file of this project that reproduces the bug (offline scenarios detect it without listing it in
# `scenarios`, which would xfail them on SUTs that do not have the bug).
# status: confirmed = reproduced OFFLINE with the otterdog 1.7.0.dev19 CLI or the snapshot code (reproduction commands
# in docs/known-issues.md); suspected = established from the source and docs but not reproduced (needs a live org).
# scenarios: scenario ids exercising the bug; each such test item is marked xfail(strict=False) at collection, so
# an XPASS reveals a fix (then set status: fixed and fixed_in). Ids may be YAML scenario ids or the scenario(id)
# marker of a Python test (tests/offline, tests/cli, tests/enterprise, tests/webhooks, tests/webapp, tests/web_ui); a
# Python known-bug test has a scenario id of its own (cli.kb.<name>, O-KB-<NAME>, W-<NAME>), and a bug declared by a
# step of a YAML scenario never lists that scenario (only that step is an expected failure).
# KB-028..KB-040 are the findings F-01..F-13 of scenarios/coverage.yaml, KB-041 the web-UI tier's finding, KB-042..
# KB-077 the findings of the test battery, KB-078..KB-080 the findings of the fine-grained token support (otterdog with
# a fine-grained admin token); features of the coverage matrix reference them in their `known_bugs`.

