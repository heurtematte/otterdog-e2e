# Documentation site (GitHub Pages, .github/workflows/docs.yml), built by Zensical: `make docs` builds it strictly into
# site/, `make docs-serve` previews it (both need `poetry install --with docs`). Zensical runs no MkDocs hooks: docs_site.py
# stages the pages first (.docs-site/: the home page generated from README.md, the scenario explorer generated from
# scenarios/ and tests/, the GitHub-flavored Markdown bridged to Python-Markdown) with a copy of this file pointing at
# them. The pages stay GitHub-flavored Markdown that renders on github.com. See docs/local-development.md.
[project]
site_name = "Otterdog Acceptance"
site_description = "End-to-end test harness for otterdog (CLI, GitHub App webapp and webhooks) against real GitHub organizations."
site_url = "https://heurtematte.github.io/otterdog-e2e/"
repo_url = "https://github.com/heurtematte/otterdog-e2e"
repo_name = "heurtematte/otterdog-e2e"
edit_uri = "edit/main/docs/"
copyright = "Otterdog Acceptance is licensed under the Eclipse Public License 2.0"

# installed by .github/workflows/docs.yml, not a page of the site
exclude_docs = """
/requirements.txt
"""

# Zensical validates links and anchors (`zensical build --strict` fails on a broken one); docs_site.py fails on a link
# leaving docs/ whose target is not in the repository

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Onboarding a test organization" = "onboarding.md" },
    { "Roles and interactions" = "roles.md" },
    { "GitHub Free organization" = "setup-free-org.md" },
    { "GitHub Enterprise Cloud organization" = "setup-enterprise-org.md" },
    { "The e2e GitHub App" = "github-app.md" },
    { "Local development" = "local-development.md" },
  ] },
  { "Writing tests" = [
    { "Writing scenarios" = "writing-scenarios.md" },
    { "Writing the test battery" = "battery-guide.md" },
    { "Web-UI testing" = "web-ui-testing.md" },
    { "AI-assisted test writing" = "ai-assistance.md" },
  ] },
  { "Testing otterdog PRs" = [
    { "Testing a pull request or a checkout" = "testing-an-otterdog-pr.md" },
  ] },
  # generated by docs_scenarios.py; docs_site.py turns this entry into a section (tiers, domains, scenarios, tests)
  { "Scenario explorer" = "scenarios/index.md" },
  { "Reference" = [
    { "Architecture" = "architecture.md" },
    { "Security" = "security.md" },
    { "Capability matrix" = "capability-matrix.md" },
    { "Coverage matrix" = "coverage-matrix.md" },
    { "HTTP request coverage" = "api-coverage.md" },
    { "Scenario catalog" = "scenario-catalog.md" },
    { "Known otterdog issues" = "known-issues.md" },
    { "Glossary" = "glossary.md" },
  ] },
]

# the filter and sort controls of the scenario explorer's tables (docs_scenarios.py); the Eclipse colors and the hero
# of the home page
extra_css = ["assets/explorer.css", "assets/theme.css"]
extra_javascript = ["assets/explorer.js"]

# the links of the footer
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/heurtematte/otterdog-e2e"
name = "Otterdog Acceptance on GitHub"

[[project.extra.social]]
icon = "octicons/repo-16"
link = "https://github.com/eclipse-csi/otterdog"
name = "otterdog on GitHub"

[[project.extra.social]]
icon = "lucide/book-open"
link = "https://otterdog.readthedocs.io/"
name = "otterdog documentation"

[project.theme]
# partials/actions.html: the edit button of a generated page opens its source (docs_site.py, edit_url); main.html: the
# announcement bar and the hero of the home page; partials/tabs.html: the tiers of the scenario explorer as a second
# row of tabs
custom_dir = "docs-theme"
# the official artwork of otterdog (eclipse-csi/.github, artwork/eclipse-otterdog), the files of otterdog's own site
# (eclipse-csi/otterdog docs/assets/images/) copied unaltered as its brand guidelines require: the emblem is drawn on a
# white disc by docs/assets/theme.css, its blue being too dark for the purple of the header
logo = "assets/images/otterdog-emblem.png"
favicon = "assets/images/favicon-32x32.png"
icon.repo = "fontawesome/brands/github"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# the colors of the Eclipse Foundation, set by docs/assets/theme.css
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

# GitHub-flavored Markdown only: no extension whose syntax github.com would show verbatim (attr_list is left out on
# purpose: it turns a trailing `{...}` of a table cell or a heading into HTML attributes and drops the text)
[project.markdown_extensions]
toc.permalink = true
# the anchors GitHub generates (lower case, punctuation dropped, spaces to dashes): links to page.md#some-heading work
# on github.com and on the site
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
tables = {}
# the meaning of SUT, KB... where the pointer rests: docs_site.py appends the definitions of the abbreviations table
# of docs/glossary.md to the staged pages only, the sources keep GitHub's syntax
abbr = {}
md_in_html = {}
admonition = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  # ```mermaid blocks, rendered by Material's own mermaid integration
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
# GitHub's extended autolinks (bare https:// URLs), ~~strikethrough~~ and `\~` escapes, task lists
pymdownx.magiclink = {}
pymdownx.tilde.subscript = false
pymdownx.tasklist.custom_checkbox = true
