# otterdog-e2e @RUN@: action references for the pin_workflow blueprint (W-BP-PIN); never dispatched.
# Expected remediation: only the checkout line is pinned to '<commit sha> # <tag>' (otterdog/webapp/tasks/blueprints/
# pin_workflow.py:99-144); an 'ignore' comment, a main/master reference and a local action stay as they are.
name: @NAME@
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5 # ignore: kept unpinned on purpose
      - uses: actions/cache@main
      - uses: ./.github/actions/e2e-local
